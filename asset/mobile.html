<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile — PQA Asset Mgmt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="asset.css">
</head>
<body>
<script type="module">
/* หน้า Mobile — มือถือทุกเครื่อง (ทีม PQA / Personal / Outsource) + ผู้ถือปัจจุบัน
   แทนหน้า All Mobile Devices + PQA Mobile ของแอปเดิม */
import {
  boot, me, store, loadStore, deviceById, createDrawer, deviceDialog, multiChip, prefs, sorter, link,
  esc, ownershipPill, statusPill, holderHTML, modelText, errMsg, toast,
} from './asset.js';

boot('mobile', async main => {
  const pf = prefs('mobile');
  const st = {
    seg: pf.get('seg', 'all'),
    q: pf.get('q', ''),
    mine: pf.get('mine', !!me.resource_id),          // แทน default Owner filter (rev 15) — ใช้ resource_id ไม่ใช่การเทียบชื่อ
    free: pf.get('free', false),
    inactive: pf.get('inactive', false),
    platforms: pf.get('platforms', []),
    brands: pf.get('brands', []),
    os: pf.get('os', []),
    sort: pf.get('sort', null),
    collapsed: new Set(pf.get('collapsed', [])),
  };
  const save = () => { for (const k of ['seg', 'q', 'mine', 'free', 'inactive', 'platforms', 'brands', 'os', 'sort']) pf.set(k, st[k]); pf.set('collapsed', [...st.collapsed]); };

  main.innerHTML = `
    <div class="page-head">
      <h2>Mobile</h2><span class="badge" id="count">…</span>
      <span class="spacer"></span>
      <span class="muted" style="font-size:12px">มือถือทีมเพิ่มที่หน้า <a href="${link('devices.html')}">อุปกรณ์ทีม</a></span>
      <button class="btn accent" id="addBtn" type="button">+ ลงทะเบียนมือถือ Personal / Outsource</button>
    </div>
    <div class="filters">
      <div class="seg" id="seg" role="tablist"></div>
      <input class="search" id="q" type="search" placeholder="ค้นหา Internal ID, รุ่น, ผู้ถือ, Serial…" aria-label="ค้นหา">
    </div>
    <div class="filters">
      ${me.resource_id ? '<button class="chip" id="cMine" type="button">ของฉัน</button>' : ''}
      <button class="chip" id="cFree" type="button">ว่าง</button>
      <button class="chip" id="cPlat"></button>
      <button class="chip" id="cBrand"></button>
      <button class="chip" id="cOs"></button>
      <button class="chip" id="cInactive" type="button">รวมที่ปิดใช้งาน</button>
      <button class="link" id="clear" type="button">ล้างตัวกรอง</button>
    </div>
    <div class="list-layout" id="layout">
      <div class="table-wrap cards" id="tableWrap"><div class="empty">กำลังโหลด…</div></div>
      <div id="drawerHost" hidden></div>
    </div>`;

  await loadStore();
  const drawer = createDrawer(document.getElementById('drawerHost'), {
    layoutEl: document.getElementById('layout'),
    onChanged: async () => { await loadStore(['devices', 'models']); render(); drawer.refresh(); },
    onClose: () => render(),
  });

  const mobiles = () => store.devices.filter(d => d.is_mobile);
  const osMajor = d => { const m = String(d.os_version || '').match(/\d+/); return m ? `${d.platform_name || ''} ${m[0]}`.trim() : null; };
  const SEGS = [['all', 'ทั้งหมด'], ['team', 'ทีม PQA'], ['personal', 'Personal'], ['outsource', 'Outsource']];

  const opts = (fn) => {
    const c = {};
    mobiles().forEach(d => { const v = fn(d); if (v) c[v] = (c[v] || 0) + 1; });
    return Object.keys(c).sort((a, b) => a.localeCompare(b, 'th', { numeric: true })).map(v => ({ value: v, label: v, count: c[v] }));
  };
  const chips = {
    plat: multiChip(document.getElementById('cPlat'), { label: 'Platform', options: opts(d => d.platform_name), selected: st.platforms, onChange: v => { st.platforms = v; render(); } }),
    brand: multiChip(document.getElementById('cBrand'), { label: 'Brand', options: opts(d => d.brand), selected: st.brands, onChange: v => { st.brands = v; render(); } }),
    os: multiChip(document.getElementById('cOs'), { label: 'OS', options: opts(osMajor), selected: st.os, onChange: v => { st.os = v; render(); } }),
  };
  const toggle = (id, key) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.onclick = () => { st[key] = !st[key]; render(); };
  };
  toggle('cMine', 'mine'); toggle('cFree', 'free'); toggle('cInactive', 'inactive');
  const q = document.getElementById('q');
  q.value = st.q;
  q.oninput = () => { st.q = q.value; render(); };
  document.getElementById('clear').onclick = () => {
    Object.assign(st, { q: '', mine: false, free: false, inactive: false, platforms: [], brands: [], os: [] });
    q.value = ''; chips.plat.set([]); chips.brand.set([]); chips.os.set([]); render();
  };
  document.getElementById('addBtn').onclick = () => deviceDialog(null, {
    kind: 'byod',
    onSaved: async msg => { toast(msg); await loadStore(['devices', 'models']); render(); },
  });

  // ผ่านทุกตัวกรองยกเว้น segment (ไว้นับจำนวนบนปุ่ม segment)
  function baseFilter(d) {
    if (!st.inactive && !(d.status === 'active' || d.status === 'repair')) return false;
    if (st.mine && d.holder_resource_id !== me.resource_id) return false;
    if (st.free && !d.is_available) return false;
    if (st.platforms.length && !st.platforms.includes(d.platform_name)) return false;
    if (st.brands.length && !st.brands.includes(d.brand)) return false;
    if (st.os.length && !st.os.includes(osMajor(d))) return false;
    const t = st.q.trim().toLowerCase();
    if (t && ![d.internal_id, d.asset_tag, d.serial_number, d.brand, d.model_name, modelText(d), d.holder_name, d.os_version, d.note, d.holder_note]
      .some(v => String(v || '').toLowerCase().includes(t))) return false;
    return true;
  }

  const OWN_ORDER = { team: 0, personal: 1, outsource: 2 };
  const cmp = sorter({
    model: modelText,
    os: d => String(d.os_version || '').replace(/\d+/g, n => n.padStart(4, '0')),
    holder: d => d.holder_name || '',
    held: d => d.held_days ?? -1,
    ownership: d => OWN_ORDER[d.ownership],
  });
  const defaultCmp = (a, b) => (OWN_ORDER[a.ownership] - OWN_ORDER[b.ownership])
    || String(a.internal_id || '~').localeCompare(String(b.internal_id || '~'), 'th', { numeric: true })
    || modelText(a).localeCompare(modelText(b)) || String(a.holder_name || '').localeCompare(String(b.holder_name || ''), 'th');

  const COLS = [
    ['internal_id', 'Internal ID'], ['model', 'รุ่น'], ['os', 'OS'], ['holder', 'ผู้ถือ / เจ้าของ'], ['held', 'ถือมา'], ['ownership', 'ประเภท'], [null, 'Note'],
  ];

  function render() {
    save();
    document.getElementById('cMine')?.classList.toggle('on', st.mine);
    document.getElementById('cFree').classList.toggle('on', st.free);
    document.getElementById('cInactive').classList.toggle('on', st.inactive);

    const base = mobiles().filter(baseFilter);
    const counts = { all: base.length };
    base.forEach(d => { counts[d.ownership] = (counts[d.ownership] || 0) + 1; });
    const seg = document.getElementById('seg');
    seg.innerHTML = SEGS.map(([k, l]) => `<button type="button" role="tab" data-seg="${k}" class="${st.seg === k ? 'on' : ''}">${l}<em>${counts[k] || 0}</em></button>`).join('');
    seg.querySelectorAll('[data-seg]').forEach(b => b.onclick = () => { st.seg = b.dataset.seg; render(); });

    const rows = base.filter(d => st.seg === 'all' || d.ownership === st.seg)
      .sort(st.sort ? cmp(st.sort.key, st.sort.dir) : defaultCmp);
    document.getElementById('count').textContent = `${rows.length} เครื่อง`;

    const wrap = document.getElementById('tableWrap');
    if (!rows.length) {
      wrap.innerHTML = `<div class="empty">ไม่พบมือถือตามตัวกรองนี้${st.mine ? ' — ลองปิดตัวกรอง "ของฉัน"' : ''}</div>`;
      return;
    }
    const groups = {};
    rows.forEach(d => { const g = d.platform_name || 'ไม่ระบุ Platform'; (groups[g] = groups[g] || []).push(d); });
    const sel = drawer.current()?.device_id;
    const head = COLS.map(([k, l]) => k
      ? `<th class="sortable" data-sort="${k}">${l}${st.sort?.key === k ? `<span class="arrow">${st.sort.dir > 0 ? '▲' : '▼'}</span>` : ''}</th>`
      : `<th>${l}</th>`).join('');
    const body = Object.keys(groups).sort().map(g => {
      const list = groups[g];
      const col = st.collapsed.has(g);
      return `<tr class="grp" data-grp="${esc(g)}"><td colspan="${COLS.length}"><span class="tw">${col ? '▸' : '▾'}</span>${esc(g)} · ${list.length}</td></tr>`
        + (col ? '' : list.map(d => `<tr class="row ${d.device_id === sel ? 'sel' : ''}" data-id="${d.device_id}" tabindex="0">
          <td class="iid" data-card="side">${esc(d.internal_id || '')}</td>
          <td data-card="title">${esc(modelText(d))} ${statusPill(d.status)}</td>
          <td data-card="full"><span class="muted"><span class="card-only">${esc(d.platform_name || '')} </span>${esc(d.os_version || '-')}</span></td>
          <td data-card="full">${holderHTML(d)}</td>
          <td class="num" data-card="hide">${d.held_days != null ? d.held_days : ''}</td>
          <td data-card="full">${ownershipPill(d.ownership)}</td>
          <td class="muted" data-card="${d.holder_note || d.note ? 'full' : 'hide'}">${esc(d.holder_note || d.note || '')}</td>
        </tr>`).join(''));
    }).join('');
    wrap.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;

    wrap.querySelectorAll('[data-sort]').forEach(th => th.onclick = () => {
      const k = th.dataset.sort;
      st.sort = st.sort?.key === k ? (st.sort.dir > 0 ? { key: k, dir: -1 } : null) : { key: k, dir: 1 };
      render();
    });
    wrap.querySelectorAll('[data-grp]').forEach(tr => tr.onclick = () => {
      const g = tr.dataset.grp;
      st.collapsed.has(g) ? st.collapsed.delete(g) : st.collapsed.add(g);
      render();
    });
    wrap.querySelectorAll('tr.row').forEach(tr => {
      const open = () => { drawer.open(deviceById(tr.dataset.id)); render(); };
      tr.onclick = open;
      tr.onkeydown = ev => { if (ev.key === 'Enter') open(); };
    });
  }

  render();
  const want = new URLSearchParams(location.search).get('id');
  if (want && deviceById(want)) { drawer.open(deviceById(want)); render(); }
});
</script>
</body>
</html>
