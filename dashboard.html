<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — PQA Resource Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  /* ---- topbar nav (canonical, same markup/classes as other pages) ---- */
  .topbar .nav { display:flex; gap:4px; margin-left:6px; }
  .topbar .nav a {
    font-size:13px; text-decoration:none; color:var(--dk-text2);
    padding:6px 12px; border-radius:8px; font-weight:600;
  }
  .topbar .nav a:hover { background:var(--dk-hover); color:var(--dk-text); }
  .topbar .nav a.active { background:var(--dk-accent-d); color:var(--dk-accent); }

  /* ---- view tabs ---- */
  .view-tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .view-tab {
    border:1px solid var(--dk-border-s); background:#fff; color:var(--dk-text2);
    padding:7px 13px; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .view-tab:hover { background:var(--dk-hover); }
  .view-tab.active { background:var(--dk-accent-d); border-color:var(--dk-accent); color:var(--dk-accent); }

  /* ---- toolbar row: view tabs + ตัวกรอง, all on one line, กั้นด้วย "|"
     (2026-08-14, ตามคำขอพี่กิ๊บ — เดิม ตัวกรอง อยู่ชิดขวาแยกจาก tabs ด้วย justify-content:
     space-between. 2026-09-01 (§5.50): ปุ่ม "Show chart"/#summaryToggleBtn ที่เคยอยู่แถวนี้
     ถูกลบไปพร้อมกับกราฟ+การ์ด KPI ทั้งชุด — ดู §5.50) ---- */
  .dash-toolbar-row {
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .toolbar-sep { color:var(--dk-border-s); font-weight:600; }
  .filters-inline { align-items:center !important; gap:8px; }
  .period-lbl { font-size:12px; font-weight:700; color:var(--dk-text2); letter-spacing:.02em; }
  .period-sep { color:var(--dk-text3); }

  /* ---- ตัวกรอง panel select (Type/Domain) — mirrors gantt.html/outsource.html.
     2026-08-14: min-width 160→128 (ตามคำขอพี่กิ๊บ — ลดขนาดกล่อง filter ให้พอดี 1 บรรทัด ตอนนี้ต้อง
     เผื่อที่ให้ Type/Domain ที่โชว์ทุก tab แล้วด้วย) ---- */
  .filters select {
    padding:7px 9px; border-radius:9px; border:1px solid var(--dk-border-s);
    font-size:13px; background:#fff; color:var(--dk-text); font-weight:600; min-width:128px;
  }
  .filters select:focus { outline:none; border-color:var(--dk-accent); }

  /* ---- checkbox multiselect (Project/UAT Lead/App — matches Project Gantt/Outsource,
     2026-08-14; min-width 180→148 same reason as .filters select above) ---- */
  .ms { position:relative; }
  .ms-btn {
    min-width:148px; text-align:left; padding:7px 10px; border-radius:9px;
    border:1px solid var(--dk-border-s); background:#fff; color:var(--dk-text);
    font-size:13px; font-weight:600; cursor:pointer; display:flex; justify-content:space-between; gap:8px;
  }
  .ms-btn:hover { border-color:var(--dk-accent); }
  .ms-panel {
    position:absolute; top:calc(100% + 4px); left:0; z-index:40;
    background:#fff; border:1px solid var(--dk-border-s); border-radius:12px;
    box-shadow:0 16px 40px rgba(34,28,21,.16); padding:6px; width:270px;
    max-height:290px; overflow:auto;
  }
  .ms-panel.hidden { display:none; }
  .ms-item { display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:8px; font-size:13px; cursor:pointer; }
  .ms-item:hover { background:var(--dk-hover); }
  .ms-item input { margin:0; accent-color:var(--dk-accent); }
  .ms-search-wrap { position:relative; padding:4px 6px 6px; }
  .ms-search { width:100%; box-sizing:border-box; padding:7px 26px 7px 10px; border-radius:8px;
    border:1px solid var(--dk-border-s); font-size:12.5px; background:#fff; color:var(--dk-text); }
  .ms-search:focus { outline:none; border-color:var(--dk-accent); }
  .ms-search-x { position:absolute; right:12px; top:50%; transform:translateY(-50%);
    border:none; background:none; cursor:pointer; font-size:15px; line-height:1; color:var(--dk-text3);
    width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; }
  .ms-search-x:hover { background:var(--dk-hover); color:var(--dk-text); }
  .ms-tools { display:flex; gap:6px; padding:4px 6px 8px; border-bottom:1px solid var(--dk-border); margin-bottom:4px; }
  .ms-tools button { font-size:11px; padding:4px 9px; border-radius:7px; border:1px solid var(--dk-border-s); background:#fff; color:var(--dk-text2); }
  .ms-tools button:hover { background:var(--dk-hover); }

  /* ---- narrow single-line cells: clip with ellipsis, full text shown via title tooltip ----
     widened (was 80px/100px) so App + Project Name are readable without opening the tooltip —
     used by both the By Project table (App/Project Name) and the Signoff table (App/Project Name) */
  table.dash-table td.col-app   { max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  table.dash-table td.proj-name { max-width:240px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---- overall-mode range filter (mirrors gantt.html .filters/.fld) ----
     2026-08-14 (ตามคำขอพี่กิ๊บ): เพิ่ม card boundary (background/border/shadow) + margin-bottom
     ให้เหมือน gantt.html/outsource.html's .filters — เดิมหน้านี้ไม่มีกรอบ/เว้นระยะกับหัวตารางเลย.
     ลด gap + ความกว้างของแต่ละ field (ดู .ms-btn/.filters select/input ด้านล่าง) ให้ทุก field
     พอดี 1 บรรทัด. 2026-09-01 (§5.50): Start/End (input[type=date] ×2) + ปุ่ม "ค้นหา" ถูกแทนที่
     ด้วย month picker ช่องเดียว (ดู .dash-month-picker ด้านล่าง) — เหลือ Project/UAT Lead/App/
     Type/Domain/เดือน/ล้าง. */
  .filters {
    display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;
    background:var(--dk-card); border:1px solid var(--dk-border); border-radius:14px;
    padding:12px 14px; margin-bottom:16px; box-shadow:0 1px 2px rgba(34,28,21,.04);
  }
  .filters .fld { display:flex; flex-direction:column; gap:5px; }
  .filters label { font-size:11px; color:var(--dk-text3); font-weight:700; letter-spacing:.02em; text-transform:uppercase; }

  /* ---- month picker ("เดือน" ตัวกรอง — mirrors calendar.html's .cal-month-picker/.cal-*
     ทั้งชุด, ตามที่โจทย์ระบุ, 2026-09-01 §5.50) — ใช้ prefix .dash-month-*/.dash-picker-*
     แทน .cal-* เดิม (คลาสเป็น page-local อยู่แล้วในทั้ง 2 ไฟล์ ไม่ชนกัน แค่ตั้งชื่อแยกให้ชัดว่า
     เป็นของหน้านี้) โครง/พฤติกรรมเหมือน calendar.html เป๊ะ: ปุ่ม ‹ / ปุ่มกลางโชว์เดือน (กดเปิด
     picker ปี+เดือน) / ปุ่ม › ---- */
  .dash-month-picker { position:relative; display:flex; align-items:center; gap:6px; }
  .dash-nav-btn { padding:7px 12px; font-size:15px; font-weight:700; min-width:38px; text-align:center; }
  .dash-month-btn {
    min-width:128px; font-size:13px; font-weight:700; color:var(--dk-accent);
    background:#fff; border:1px solid var(--dk-border-s); border-radius:9px; padding:7px 12px;
  }
  .dash-month-btn:hover { background:var(--dk-hover); }
  .dash-month-panel {
    position:absolute; top:calc(100% + 6px); left:0; z-index:40;
    background:#fff; border:1px solid var(--dk-border-s); border-radius:10px;
    box-shadow:0 12px 30px rgba(34,28,21,.15); padding:10px; width:230px;
  }
  .dash-month-panel.hidden { display:none; }
  .dash-picker-year {
    display:flex; align-items:center; justify-content:space-between;
    font-weight:700; font-size:13px; color:var(--dk-text); margin-bottom:8px;
  }
  .dash-picker-year button { padding:3px 9px; }
  .dash-picker-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .dash-picker-month {
    padding:8px 4px; border-radius:7px; border:1px solid var(--dk-border-s);
    background:#fff; color:var(--dk-text); font-size:12.5px; font-weight:600; text-align:center; cursor:pointer;
  }
  .dash-picker-month:hover { background:var(--dk-hover); }
  .dash-picker-month.active { background:var(--dk-accent); border-color:var(--dk-accent); color:#fff; }

  /* ---- sortable table headers ---- */
  table.dash-table th.sortable { cursor:pointer; user-select:none; }
  table.dash-table th.sortable:hover { color:var(--dk-text); }
  table.dash-table th .sort-ico { margin-left:4px; opacity:.6; font-size:10px; }
  table.dash-table th.sort-active .sort-ico { opacity:1; color:var(--dk-accent); }
  .ico-btn {
    border:1px solid var(--dk-border-s); background:#fff; border-radius:6px; width:26px; height:26px;
    font-size:13px; cursor:pointer; line-height:1;
  }
  .ico-btn:hover { background:var(--dk-hover); }
  .ico-btn[disabled] { opacity:.35; cursor:default; }
  .ico-btn[disabled]:hover { background:#fff; }

  /* ---- dashboard tables (generic) ---- */
  .dash-table-wrap { background:#fff; border:1px solid var(--dk-border); border-radius:12px; overflow:auto; max-height:calc(100vh - 300px); }
  /* By Lead tab shows one role's table at a time, picked via #leadRoleSelect
     (2026-08-13) — the shared .section-title (theme.css) has a dashed top rule + top
     margin meant for mid-page dividers; here it's the very first thing under the tab
     bar, so it shouldn't have either. */
  #viewContainer .section-title:first-child { margin-top:0; border-top:none; padding-top:0; }
  table.dash-table { width:100%; border-collapse:collapse; font-size:13px; }
  table.dash-table th {
    position:sticky; top:0; background:var(--dk-surface); text-align:left; padding:9px 12px;
    font-weight:700; color:var(--dk-text2); font-size:11.5px; border-bottom:1px solid var(--dk-border); white-space:nowrap;
  }
  table.dash-table td { padding:8px 12px; border-bottom:1px solid var(--dk-border); }
  table.dash-table td.right, table.dash-table th.right { text-align:right; }
  table.dash-table td.center, table.dash-table th.center { text-align:center; }
  tr.dash-app-row { cursor:pointer; background:var(--dk-surface); font-weight:700; }
  tr.dash-app-row:hover { background:var(--dk-hover); }
  tr.dash-app-row td { border-bottom:1px solid var(--dk-border); }
  tr.dash-proj-row td { color:var(--dk-text2); }
  tr.dash-proj-row td:nth-child(2) { color:var(--dk-text); font-weight:600; }
  tfoot.dash-total td, tr.dash-total-row td {
    font-weight:800; color:var(--dk-text); background:var(--dk-hover); border-top:2px solid var(--dk-accent-d);
  }
  .toggle-ico { display:inline-block; width:14px; }

  /* ---- By OS pivot: frozen left columns ----
     Fixed widths on the 3 frozen columns (name/role/total) make their `left` offsets below
     deterministic: left(role)=170 (name's width), left(total)=300 (170+130).
     Header cells need a HIGHER z-index than body cells, and both need MORE-SPECIFIC selectors
     than the generic `thead th` / plain class rules below — with equal specificity the LATER
     rule wins by source order, not the one that "looks like" the override, which is what
     caused the header/body collision when scrolling right. Using `table.dash-os-table th.foo`
     everywhere keeps every frozen-column rule at a higher, consistent specificity than the
     generic `table.dash-os-table thead th` rule so the intended override always wins. */
  .dash-os-scroll { background:var(--dk-card); border:1px solid var(--dk-border); border-radius:12px; overflow:auto; max-height:calc(100vh - 300px); }
  table.dash-os-table { border-collapse:separate; border-spacing:0; font-size:12.5px; white-space:nowrap; }
  table.dash-os-table th, table.dash-os-table td {
    padding:7px 10px; border-bottom:1px solid var(--dk-border); border-right:1px solid var(--dk-border);
  }
  table.dash-os-table thead th { position:sticky; top:0; background:var(--dk-surface); color:var(--dk-text2); font-weight:700; z-index:20; text-align:center; }

  table.dash-os-table td.td-os-name, table.dash-os-table th.th-os-name {
    position:sticky; left:0; width:170px; min-width:170px; text-align:left; background:var(--dk-card); z-index:10;
  }
  table.dash-os-table td.td-os-role, table.dash-os-table th.th-os-role {
    position:sticky; left:170px; width:130px; min-width:130px; text-align:left; background:var(--dk-card); z-index:10;
  }
  table.dash-os-table td.td-os-total, table.dash-os-table th.th-os-total {
    position:sticky; left:300px; width:80px; min-width:80px; text-align:right; background:var(--dk-card); z-index:10;
    box-shadow:2px 0 4px rgba(34,28,21,.08);
  }
  /* header freeze cells: same left offsets as above, but sit above BOTH the scrolling header
     cells (z-index:20) and the frozen body cells (z-index:10) */
  table.dash-os-table thead th.th-os-name,
  table.dash-os-table thead th.th-os-role,
  table.dash-os-table thead th.th-os-total {
    z-index:30; background:var(--dk-surface);
  }
  table.dash-os-table tr.dash-total-row td.td-os-name,
  table.dash-os-table tr.dash-total-row td.td-os-role,
  table.dash-os-table tr.dash-total-row td.td-os-total {
    background:var(--dk-hover);
  }
  .td-md-cell { text-align:right; }

  /* ---- By Project view: widened + frozen first 2 columns (App / Project Name only) ----
     Lead used to be frozen too (left:400) — no longer; it now scrolls with the rest of
     the table like every other column. Fixed widths (not just min-width) keep the `left`
     offset of Project Name deterministic: left(Project Name)=160 (App's width). Project
     Name is now +15px wider (240 → 255). Scoped with #projectTable so the Signoff table
     (which reuses .col-app/.proj-name for its own App/Project Name columns) is unaffected
     — it just gets the wider max-width from the shared rule above. */
  #projectTable { border-collapse:separate; border-spacing:0; }
  #projectTable th.col-app,   #projectTable td.col-app   { width:160px; min-width:160px; max-width:160px; }
  #projectTable th.proj-name, #projectTable td.proj-name { width:255px; min-width:255px; max-width:255px; }
  #projectTable th.col-lead,  #projectTable td.col-lead  { width:110px; min-width:110px; max-width:110px; }

  /* Lead cell = Main Lead (normal) + Sub Lead(s) on their own grey lines below.
     Cells align to the top so a 3-line Lead cell doesn't push the MD numbers down. */
  #projectTable td.col-lead, #signoffTable td.col-lead { vertical-align:top; }
  .lead-sub {
    display:block; font-size:11px; line-height:1.35; color:var(--dk-text3);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  #projectTable th.col-app,   #projectTable td.col-app,
  #projectTable th.proj-name, #projectTable td.proj-name,
  #projectTable td.total-label-frozen {
    position:sticky; background:var(--dk-card); z-index:5;
  }
  #projectTable th.col-app,  #projectTable td.col-app,  #projectTable td.total-label-frozen { left:0; }
  #projectTable th.proj-name, #projectTable td.proj-name { left:160px; }
  /* boundary shadow now sits on Project Name (the last frozen column) + its footer
     equivalent, instead of on Lead which is no longer frozen */
  #projectTable th.proj-name, #projectTable td.proj-name,
  #projectTable td.total-label-frozen {
    box-shadow:2px 0 4px rgba(34,28,21,.08);
  }

  /* header freeze cells: above both the scrolling header cells and the frozen body cells */
  #projectTable thead th.col-app, #projectTable thead th.proj-name {
    z-index:16; background:var(--dk-surface);
  }
  #projectTable tfoot td.total-label-frozen,
  #projectTable tr.dash-total-row td.total-label-frozen {
    background:var(--dk-hover);
  }

  /* ---- By Lead: frozen first 2 columns (2026-08-13, ตามที่ขอ) ----
     Freeze is structural (nth-child), not per-column classes, because column 2's content
     differs by role picked in #leadRoleSelect: "Total MD" for the Main Lead table, but
     "Total Project" for Sub Lead / Executor (Main is the only role withMD — see
     LEAD_ROLE_META). Column 2 is always the 2nd <th>/<td> regardless of which one it is,
     so nth-child freezes the right cell either way without branching in JS. Same pattern
     as #projectTable's App/Project Name freeze above, just column-count-agnostic. */
  #leadTable { border-collapse:separate; border-spacing:0; }
  #leadTable th:nth-child(1), #leadTable td:nth-child(1) {
    position:sticky; left:0; width:140px; min-width:140px; max-width:140px;
    background:var(--dk-card); z-index:5;
  }
  #leadTable th:nth-child(2), #leadTable td:nth-child(2) {
    position:sticky; left:140px; width:90px; min-width:90px; max-width:90px; text-align:right;
    background:var(--dk-card); z-index:5; box-shadow:2px 0 4px rgba(34,28,21,.08);
  }
  #leadTable thead th:nth-child(1), #leadTable thead th:nth-child(2) {
    z-index:16; background:var(--dk-surface);
  }
  #leadTable tr.dash-total-row td:nth-child(1), #leadTable tr.dash-total-row td:nth-child(2) {
    background:var(--dk-hover);
  }

  .empty-state { padding:40px; text-align:center; color:var(--dk-text3); }

  /* ---- loading wrapper: viewContainer (task 1) ----
     visibility:hidden (NOT display:none) on the real content while loading — keeps the
     element's normal box/layout size so nothing visibly jumps/reflows once the overlay is
     lifted. The overlay sits on top via position:absolute so nothing is ever visibly
     "stale" mid-fetch. (2026-09-01, §5.50: this used to ALSO matter for Chart.js, which
     needed a real non-zero canvas width to size the bar/donut charts correctly even while
     hidden underneath the overlay — that reason is gone now that the KPI grid + chart row
     have been removed entirely; visibility:hidden is kept purely for the no-reflow behavior.) */
  .dash-content { position:relative; min-height:80px; }
  .dash-content.is-loading > *:not(.dash-loading-overlay) { visibility:hidden; }
  .dash-loading-overlay {
    display:none; position:absolute; inset:0; align-items:center; justify-content:center;
    gap:8px; color:var(--dk-text3); font-size:13px; font-weight:600;
  }
  .dash-content.is-loading .dash-loading-overlay { display:flex; }
  .dash-spinner {
    width:15px; height:15px; border-radius:50%; border:2px solid var(--dk-border-s);
    border-top-color:var(--dk-accent); animation:dash-spin .7s linear infinite;
  }
  @keyframes dash-spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginPage" class="hidden">
  <div class="login-card">
    <h1>PQA Resource Mgmt</h1>
    <p class="sub">เข้าสู่ระบบด้วย Supabase</p>
    <form id="loginForm" autocomplete="on">
      <label for="email">อีเมล</label>
      <input id="email" type="email" required placeholder="you@infinitaskt.com">
      <label for="password">รหัสผ่าน</label>
      <input id="password" type="password" required placeholder="••••••••">
      <button id="loginBtn" class="btn-primary" type="submit">เข้าสู่ระบบ</button>
      <div class="login-err" id="loginErr"></div>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <div class="topbar">
    <span class="brand">PQA Resource Mgmt</span>
    <nav class="nav">
      <a href="gantt.html">Project</a>
      <a href="outsource.html">Outsource</a>
      <a href="calendar.html">Calendar</a>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="signoff-review.html">Signoff Review</a>
      <a href="admin.html" id="navAdmin" style="display:none">Admin</a>
    </nav>
    <span class="spacer"></span>
    <div class="noti-bell">
      <button class="noti-bell-btn" id="notiBellBtn" type="button" aria-label="การแจ้งเตือน">🔔<span class="noti-dot" id="notiDot" style="display:none"></span></button>
      <div class="noti-panel" id="notiPanel" style="display:none">
        <div class="noti-panel-head">การแจ้งเตือน</div>
        <div class="noti-panel-list" id="notiList"></div>
      </div>
    </div>
    <span class="who" id="who"></span>
    <button class="btn sm" id="logoutBtn">ออกจากระบบ</button>
  </div>

  <div class="main">

    <!-- ===== Toolbar row: view tabs (left) + filter toggle (right) ===== -->
    <div class="toolbar dash-toolbar-row">
      <div class="view-tabs" id="viewTabs">
        <button class="view-tab active" data-view="project">📊 By Project</button>
        <button class="view-tab" data-view="os">👤 By OS</button>
        <button class="view-tab" data-view="lead">👑 By Lead</button>
        <button class="view-tab" data-view="signoff">📋 Signoff</button>
      </div>
      <span class="toolbar-sep">|</span>
      <!-- ปุ่มตัวกรอง (2026-08-14, ตามคำขอพี่กิ๊บ) — เอา pattern เดียวกับ gantt.html/outsource.html
           มาใช้: default หุบ, กดเปิด/ปิดได้, จำสถานะเปิด/ปิดผ่าน panelOpen ใน prefs. Panel เดียวใช้
           ร่วมกันทุก tab ของ Dashboard (ไม่แยก panel ต่อ tab) — ตัวกรอง "ค้นหา Project" (เดือน,

// ใน buildLeadProjectPhaseRows()) จึงเก็บ PHASE_META ไว้ แค่ตัด `color`/`order`/PHASE_CODES ทิ้ง
const PHASE_META = {
  SIT:     { name:'SIT' },
  TCPREP:  { name:'TC Prep' },
  UAT:     { name:'UAT' },
  REG:     { name:'Reg' },

};
function phaseName(c){ return (PHASE_META[c]||{}).name || c; }
function roleRank(code){ return code==='SENIOR'?1 : code==='TESTER'?2 : code==='JUNIOR'?3 : 4; }
/* Effective MD ผ่านการคูณสัดส่วน (computeAgg pass 2) จึงมี float noise ได้
   เช่น 12 → 11.999999999999998 ถ้าเช็ค isInteger ตรงๆ จะโชว์ "12.0" → ปัดทศนิยม 1 ตำแหน่งก่อนเสมอ */
function fmtMD(v){
  if (v == null || v === '') return '0';
  const n = Number(v);
  if (isNaN(n)) return '0';
  const r = Math.round(n * 10) / 10;
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
}
/* Cap a (long) project name at 100 chars with an ellipsis; CSS .proj-name clamps it to 2 lines. */
function truncName(s, max=100){
  s = String(s || '');
  return s.length > max ? s.slice(0, max).trimEnd() + '…' : s;
}

  filter: { projects: new Set(), leads: new Set(), apps: new Set() }, // 2026-08-14: Project/UAT Lead/App multiselect (ตัวกรอง panel) — ANDed with S.overallRange in matchProjectDiscovery(); empty Set = no restriction (same convention as gantt.html/outsource.html)
  // 2026-09-01 (§5.50): "ค้นหา Project" เปลี่ยนจาก Start/End (2 input[type=date]) เป็น month

  // จาก y/m ผ่าน overallRangeFromYM() ทุกครั้งที่เดือนเปลี่ยน) — ห้ามลบ/เปลี่ยนรูปร่าง overallRange
  // เด็ดขาด: projectMatchesRange()/recomputeAggregates()/matchProjectDiscovery() (§5.37/§5.39)

  y: 0,                          // ปีที่เลือก (ตัวเลขเต็ม เช่น 2026)

let dashPickerYear = null; // ปีที่กำลังเลือกอยู่ใน month picker panel (#dashMonthPanel, §5.50)

/* =====================================================================
   AUTH (copied pattern from pqaResourceManagement.html / gantt.html)
   ===================================================================== */
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('loginBtn');
  btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...'; $('loginErr').textContent = '';
  const { error } = await signIn($('email').value, $('password').value);
  btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
  if (error) $('loginErr').textContent = error.message || 'เข้าสู่ระบบไม่สำเร็จ';
});
$('logoutBtn').addEventListener('click', () => supabase.auth.signOut());
// _authBooted กัน getSession() IIFE ชนกับ onAuthStateChange (race ที่ทั้งคู่เรียก showApp() ซ้ำซ้อน
// ตอนโหลดหน้าครั้งแรก) — event ในอนาคต (token refresh ฯลฯ) ยังทำงานผ่าน onAuthStateChange ปกติ
// (คนละชั้นกับ sessionBooted ด้านล่าง ซึ่งกัน loadMasterData()/loadPeriod() ไม่ให้รันซ้ำ)
let _authBooted = false;
supabase.auth.onAuthStateChange((_e, session) => {
  _authBooted = true;
  session ? showApp(session) : showLogin();
});
(async () => {
  if (_authBooted) return;
  const { data } = await supabase.auth.getSession();
  if (_authBooted) return; // onAuthStateChange ชนะไปแล้วระหว่างรอ await นี้
  _authBooted = true;
  if (data.session) showApp(data.session); else showLogin();
})();

function showLogin(){
  $('app').classList.add('hidden'); $('loginPage').classList.remove('hidden');
  sessionBooted = false; // allow a fresh login to re-run the full boot sequence
}

// Supabase's auth listener + the initial getSession() call can both resolve to the same
// session on first load (and onAuthStateChange may itself fire more than once) — without
// this guard loadMasterData()/loadPeriod() would run 2-3x in a row (historically this also
// re-created/destroyed the Chart.js bar/donut each time, causing a visible flicker — task 6;
// the charts themselves are gone as of 2026-09-01/§5.50, but the double-fetch this guard
// prevents is still wasteful, so the guard stays).
let sessionBooted = false;

/* จำ Applied filter/มุมมองตอนสลับหน้า (sessionStorage ผ่าน common.js) — restore ต้องเกิด
   ก่อนโหลดข้อมูลรอบแรก เพราะ overallRange (ค้นหา Project, derive จาก S.y/S.m) เป็นตัวกำหนดว่า
   project ไหนถูกนับใน recomputeAggregates() ค่าที่อ่านจาก storage ไม่น่าไว้ใจ → validate
   ชนิด/ช่วงก่อนใช้เสมอ เพี้ยน = ปล่อยให้ default เดิมทำงานต่อ (ensureOverallRangeDefaults() จะ
   ไม่ทับ S.y/S.m ถ้าถูก set ไว้แล้วจากตรงนี้)
   2026-09-01 (§5.50): เดิมเก็บ `rangeS`/`rangeE` (yyyy-mm-dd ×2) ตอนนี้เก็บ `y`/`m` แทน (แบบ
   เดียวกับ calendar.html) — ค่าเก่ารูปแบบ rangeS/rangeE ที่อาจค้างใน sessionStorage จากก่อนวันนี้
   จะไม่ match เงื่อนไข y/m ด้านล่างเลย (คนละคีย์) จึงตกไปใช้ default เงียบๆ ใน
   ensureOverallRangeDefaults() โดยอัตโนมัติ ไม่ทำให้หน้าเว็บพัง */
function restoreDashPrefs(){
  const p = loadPrefs(PAGE);

  const py = Number(p.y), pm = Number(p.m);
  if (Number.isInteger(py) && py >= 2000 && py <= 2100 && Number.isInteger(pm) && pm >= 1 && pm <= 12) {
    S.y = py; S.m = pm;
  }

  if (['project', 'os', 'lead', 'signoff'].includes(p.dashView)) {
    S.dashView = p.dashView;
    document.querySelectorAll('#viewTabs .view-tab').forEach(b => b.classList.toggle('active', b.dataset.view === S.dashView));
  }
  // Type/Domain — By Lead tab เท่านั้น (2026-08-14 round 4, ตามคำขอพี่กิ๊บ)
  $('leadRoleFld').classList.toggle('hidden', S.dashView !== 'lead');
  $('leadDomainFld').classList.toggle('hidden', S.dashView !== 'lead');

  // 2026-08-14: Project/UAT Lead/App multiselect (ตัวกรอง panel) — restore the selected Sets;
  // the actual .ms widgets are (re)built afterward in buildFilterMultiSelects() (called once
  // master data is loaded), which reads these Sets as the initial "checked" state.
  S.filter.projects = prefSet(p.projects);
  S.filter.leads = prefSet(p.leads);
  S.filter.apps = prefSet(p.apps);

  if (['all', 'main', 'sub', 'exec'].includes(p.leadRoleFilter)) {
    S.leadRoleFilter = p.leadRoleFilter;
  }
  $('leadRoleSelect').value = S.leadRoleFilter;

  if (['all', 'infinitas', 'arise', 'other'].includes(p.leadDomainFilter)) {
    S.leadDomainFilter = p.leadDomainFilter;
  }
  $('leadDomainSelect').value = S.leadDomainFilter;

  // ปุ่มตัวกรอง (2026-08-14) — เหมือน gantt.html/outsource.html: จำว่า panel เปิดค้างไว้ไหม
  if (p.panelOpen === true) $('filterPanel').classList.remove('hidden');

  if (p.projectSort && typeof p.projectSort === 'object') {
    const { key, dir } = p.projectSort;
    if (Object.prototype.hasOwnProperty.call(PROJECT_KEYFNS, key) && (dir === 'asc' || dir === 'desc')) {
      S.projectSort = { key, dir };
    }
  }
  if (p.signoffSort && typeof p.signoffSort === 'object') {
    const { key, dir } = p.signoffSort;
    if (Object.prototype.hasOwnProperty.call(SIGNOFF_KEYFNS, key) && (dir === 'asc' || dir === 'desc')) {
      S.signoffSort = { key, dir };
    }
  }
}

async function showApp(session){
  $('loginPage').classList.add('hidden'); $('app').classList.remove('hidden');
  // paint เมนู Admin แบบ optimistic จาก cache ทันที (sync) ก่อนรอ query role จาก DB เสร็จ
  // กันเมนูกระพริบ (แว้บหาย-แว้บโผล่) ทุกครั้งที่สลับหน้า เพราะแอปนี้เป็น multi-page full reload
  paintNavAdmin(getCachedRole(session.user.email));
  initNotificationBell(); // idempotent เอง (กันซ้ำใน common.js)
  let who = session.user.email, role = '';
  // pqa_emp_id เพิ่มเข้ามา 2026-08-14 — ใช้ตั้งชื่อไฟล์ + บันทึกลง download_log ตอนกด
  // "Download Excel" ทุกแท็บ (ดู downloadDashboardExcel()) ไม่กระทบของเดิม (who/role)
  const { data:u } = await supabase.from('app_user').select('display_name,app_role,pqa_emp_id')
    .eq('email', session.user.email).maybeSingle();
  if (u) { who = u.display_name; role = u.app_role; }
  $('who').innerHTML = `<b>${esc(who)}</b>${role?` · ${esc(role)}`:''}`;
  setCachedRole(session.user.email, role);
  paintNavAdmin(role);
  S.user = { displayName: who, role, userId: session.user.id, pqaEmpId: (u && u.pqa_emp_id) || null };

  if (sessionBooted) return;
  sessionBooted = true;

  // re-arm the loading overlay in case a previous session already revealed the content
  // (logout → login again re-runs this full boot sequence).
  showDashLoading();
  wireToolbar();
  wireMonthPicker();
  await loadMasterData();
  // เดือนปัจจุบัน = default ตั้งต้น (mirrors calendar.html's showApp()) — ตั้งก่อนเสมอ แล้วค่าที่
  // จำไว้ (ถ้ามี y/m ที่สมเหตุสมผลใน sessionStorage) จะมาทับทีหลังผ่านการ restore ด้านล่าง
  const today = new Date();
  S.y = today.getFullYear();
  S.m = today.getMonth() + 1;
  // เปลี่ยน login = ล้าง filter ของคนก่อนทิ้ง (ต้องมาก่อน restoreDashPrefs เสมอ)
  setPrefsOwner(session.user.email);
  restoreDashPrefs();
  // 2026-08-14: Project/UAT Lead/App multiselect — ต้องมาหลัง loadMasterData() (ใช้
  // S.activeProjects/S.leadsAll/S.appList) และหลัง restoreDashPrefs() (ใช้ S.filter.* ที่
  // restore แล้วเป็น selected set เริ่มต้นตอนสร้าง widget)
  buildFilterMultiSelects();
  ensureOverallRangeDefaults();
  await loadPeriod(true);
}

/* =====================================================================
   MASTER DATA (loaded once, cached — Refresh reloads it)
   ===================================================================== */
async function loadMasterData(){
  // 2026-09-01: project_lead/project_phase paginated with fetchAllRows() — unbounded select()
  // silently drops rows past Supabase's Max Rows cap (1000, see fetchAllRows() in common.js).
  // project_phase = projects × up to 7 phases, easily > 1000 as the project list grows; a
  // truncated result here would silently corrupt projectMatchesRange()'s phase-date matching
  // (§5.23/§5.37) for whichever projects fell outside the returned page. project_lead similarly
  // grows with each Main/Sub Lead/Internal Executor row per project (§5.42).
  // v_project_wide is 1 row per project (group by project_key in sql/05_views.sql) — project
  // count grows far slower than booking/phase/lead rows (45 at initial migration, still nowhere
  // near 1000) so it's low-risk, but paginated too since the extra request costs nothing once
  // the table is under the cap (fetchAllRows stops after the first short page) and it removes
  // one more silent-truncation failure mode as the project list grows over time.
  const [holidays, projRes, allProjRes, appRes, resRes, leadRes, plRes, phaseRes] = await Promise.all([
    loadHolidays(),
    fetchAllRows((from, to) => supabase.from('v_project_wide')
      .select('project_key,project_name,app,other_app,uat_lead,status,signoff_date,signoff_url,is_active,project_note')
      .eq('is_active', true)
      .order('project_key', { ascending: true })
      .range(from, to)),
    fetchAllRows((from, to) => supabase.from('v_project_wide')
      .select('project_key,project_name,app,other_app,uat_lead,status,signoff_date,signoff_url,is_active,project_note')
      .order('project_key', { ascending: true })
      .range(from, to)),
    supabase.from('app').select('app_code,app_name,sort_order').order('sort_order', { nullsFirst:false }),
    supabase.from('v_resource').select('resource_id,full_name_en,nickname,role_code,resource_type,is_active'),
    supabase.from('pqa_lead').select('emp_id,short_name,nickname,incharge_role,email').eq('is_active', true),
    fetchAllRows((from, to) => supabase.from('project_lead').select('project_key,pqa_emp_id,is_main,is_executor')
      .order('project_key', { ascending: true })
      .order('pqa_emp_id', { ascending: true })
      .range(from, to)),   // PK (project_key, pqa_emp_id) — sql/01_schema.sql
    fetchAllRows((from, to) => supabase.from('project_phase')
      .select('project_key,phase_code,phase_label,start_date,end_date,sort_order')
      .order('project_key', { ascending: true })
      .order('phase_code', { ascending: true })
      .order('phase_label', { ascending: true })
      .range(from, to)),   // unique index (project_key, phase_code, coalesce(phase_label,'')) — sql/01_schema.sql
  ]);

  S.holidays = holidays || {};

  S.activeProjects = projRes.data || [];
  S.activeProjMap = {};
  S.activeProjects.forEach(p => { S.activeProjMap[p.project_key] = p; });

  S.allProjectsFull = allProjRes.data || [];
  S.allProjMap = {};
  S.allProjectsFull.forEach(p => { S.allProjMap[p.project_key] = p; });

  S.appList = appRes.data || [];
  S.appOrder = {};
  S.appList.forEach(a => { S.appOrder[a.app_code] = a.sort_order ?? 999; });

  S.resourceMap = {};
  (resRes.data || []).forEach(r => { S.resourceMap[r.resource_id] = r; });

  S.leadsAll = (leadRes.data || []).slice().sort((a,b)=>String(a.short_name).localeCompare(String(b.short_name)));
  S.projectLeadRows = plRes.data || [];

  S.phasesByProject = {};
  (phaseRes.data || []).forEach(ph => {
    (S.phasesByProject[ph.project_key] = S.phasesByProject[ph.project_key] || []).push(ph);
  });
  Object.values(S.phasesByProject).forEach(arr => arr.sort((a,b) => (a.sort_order ?? 999) - (b.sort_order ?? 999)));

  for (const r of [projRes, allProjRes, appRes, resRes, leadRes, plRes, phaseRes]) {
    if (r.error) { console.warn('master data load error', r.error); }
  }
}

/* =====================================================================
   PERIOD ("ค้นหา Project" custom Start–End range — the dashboard's only mode)
   DATA LOADING + AGGREGATION
   ===================================================================== */
/** Currently selected "ค้นหา Project" search range as {first,last} 'yyyy-MM-dd'. */
function currentRange(){
  return { first: S.overallRange.s, last: S.overallRange.e };
}
/** Projects to show in the By Project / By Lead / Signoff subviews.
 * 2026-08-13 (confirmed by Gibb): counts like Project/OS/Lead must only ever count
 * is_active=true records — By Lead and Signoff used to read S.allProjectsFull/S.allProjMap
 * (ALL projects, including inactive) while By Project already used the active-only set.
 * Switched both to the active-only set so all 3 subviews agree — a project you deactivate
 * now disappears from By Lead's matrix and from the Signoff list, same as it already does
 * on By Project. (projectMatchesRange()/recomputeAggregates() still look dates up via
 * S.allProjMap internally — that's fine, each project's own MD total is independent of
 * which other projects share the dict, so leaving those alone doesn't leak inactive rows
 * back into what actually renders here.) */
function currentProjectsList(){
  return S.activeProjects;
}
function currentProjMap(){
  return S.activeProjMap;
}

/**
 * Fetch v_booking_daily / v_leave_daily (FULL, unrestricted history — NOT date-filtered by
 * S.overallRange, §5.37) only when needed (first boot, or force=true), then always recompute
 * the search-matched aggregates + re-render. Booking/leave data no longer depends on the
 * selected "ค้นหา Project" range, so re-querying Supabase on every "แสดง" (Apply) click would
 * be wasteful — only recomputeAggregates() (cheap, in-memory, no network) needs to run then.
 */
async function loadPeriod(force){
  const { first, last } = currentRange();
  if (!first || !last) return; // search range not resolved yet

  showDashLoading();
  try {
    if (force || !S.bookingLeaveLoaded) {
      // 2026-09-01 🔴 root cause of "By OS shows 0 for most people": these two queries have no
      // .gte/.lte at all (intentional, §5.37 — MD must be full-Phase-span, not clipped to the
      // search box) and v_booking_daily explodes each booking row into one row per working day
      // (sql/05_views.sql §3) — strictly bigger than the `booking` table, which itself already
      // passed 1000 active rows by 2026-08-25 (see fetchAllRows() comment in common.js, and the
      // gantt.html fix that followed it). Being unbounded, the old `.select()` here silently hit
      // Supabase's default "Max Rows" cap (1000) and returned only the first page — most
      // resources' MD then computed from a truncated slice of their real bookings, landing at 0
      // whenever none of their rows happened to survive into that first page. Paginate with
      // fetchAllRows() exactly like gantt.html's booking queries — do NOT add .gte/.lte back in,
      // that would undo §5.37's full-span-MD invariant.
      const [bkRes, lvRes] = await Promise.all([
        fetchAllRows((from, to) => supabase.from('v_booking_daily')
          .select('booking_id,project_key,resource_id,phase_code,work_date,md_per_day')
          .order('booking_id', { ascending: true })
          .order('work_date', { ascending: true })
          .range(from, to)),   // unique pair (booking_id, work_date) — sql/05_views.sql §3
        fetchAllRows((from, to) => supabase.from('v_leave_daily')
          .select('leave_id,resource_id,leave_date,leave_slot,leave_md')
          .order('leave_id', { ascending: true })
          .order('leave_date', { ascending: true })
          .range(from, to)),   // unique pair (leave_id, leave_date)
      ]);
      if (bkRes.error) throw bkRes.error;
      if (lvRes.error) throw lvRes.error;

      S.bookingDaily = bkRes.data || [];
      S.leaveDaily = lvRes.data || [];
      S.bookingLeaveLoaded = true;
    }
    recomputeAggregates();
    // render FIRST (while still hidden behind the overlay — the content uses
    // visibility:hidden, not display:none, so the table keeps its real box size and
    // doesn't reflow/jump when the overlay lifts), THEN reveal.
    renderAll();
    hideDashLoading();
  } catch (err) {
    console.error(err);
    $('viewContainer').innerHTML = `<div class="empty-state" style="color:var(--danger)">โหลดข้อมูลไม่สำเร็จ: ${esc(err.message||String(err))}</div>`;
    hideDashLoading();
  }
}

/**
 * Recompute S.periodAgg / S.periodAggActiveOnly from the FULL (unrestricted) booking/leave
 * history, scoped to only the projects that match the current "ค้นหา Project" search window
 * (S.overallRange) — see projectMatchesRange(). Cheap + synchronous (no network), so this runs
 * on every search-Apply click without re-fetching from Supabase.
 *
 * EXCEPTION (2026-09-01): periodAggActiveOnly (By OS) does NOT use projectMatchesRange()'s
 * phase-date-span check — only `is_active` + the Project/UAT Lead/App ตัวกรอง selections gate
 * which projects are eligible; `dateRange` (below) does the real date filtering off each
 * booking's own work_date instead, matching outsource.html. See the fix comment inside the
 * function body for why.
 *
 * `restrict:true` (both calls) makes computeAgg only count booking rows whose project_key is a
 * key of the map we pass — i.e. only projects that matched the "ค้นหา Project" search. Because
 * S.bookingDaily/S.leaveDaily are the FULL unrestricted history (§5.37), the MD each matched
 * project gets is its true full-span Booked-minus-Leave total, not clipped to the search
 * window — exactly the desired "Booked MD เต็มช่วงของ Phase" behavior (same definition as
 * Gantt's Booked MD, §5.9/§5.8).
 *
 * 🔴 FIXED 2026-08-12 (§5.39): computeAgg's leave-apportionment (pass 1, effFactorByResDay) is
 * now computed from ALL bookingRows SYSTEM-WIDE, regardless of `restrict` — the exact same
 * scope as Gantt's `buildEffFactorMap()` in gantt.html (§5.38, sums from `S.bookings` with no
 * filter at all). `restrict` now controls ONLY pass 2 (which projects' bookings get distributed
 * into byProject/byProjectPhase/byAppPhase/phaseTotals/byOsApp/byOsTotal — i.e. what shows in
 * the tables), never the leave-proration factor. Previously (before this fix) the factor was
 * computed only from bookings on MATCHED projects, so a resource booked on both a matched and a
 * non-matched project on the same day, who also took leave that day, had the leave fully
 * apportioned against the matched-project booking(s) only — understating that project's MD
 * relative to Gantt, which always used the system-wide denominator. This was the root cause of
 * Gantt vs Dashboard showing different Booked MD for the same project/phase (reported: "Lotto
 * N3 MVP 6.1", app 422_GLO Lotto, phase UAT 20/07–21/08/2026 — Gantt 76 vs Dashboard 65 with
 * search range 01/08–31/08/2026). Now that both pages prorate leave over the same system-wide
 * denominator, the two pages are guaranteed to agree for the same underlying data.
 */
function recomputeAggregates(){
  const rangeS = S.overallRange.s || '', rangeE = S.overallRange.e || '';
  const matchedAll = {};
  Object.keys(S.allProjMap).forEach(pk => { if (matchProjectDiscovery(pk, rangeS, rangeE)) matchedAll[pk] = S.allProjMap[pk]; });
  S.periodAgg = computeAgg(S.bookingDaily, S.leaveDaily, matchedAll, { restrict: true });
  // 2026-09-01 (รายงานโดย Gibb): By OS ตัด MD ตามช่วงวันที่ที่เลือกด้วย (dateRange) ต่างจาก
  // periodAgg (By Project/By Lead/Signoff) ที่ยังนับ MD เต็มช่วง Phase เหมือน Gantt ตามเดิม —
  // ทำให้ By OS ตรงกับ webapp/outsource.html ที่นับเฉพาะ MD ในช่วงวันที่ที่เลือกเท่านั้น
  // (ยืนยันขอบเขตกับ Gibb แล้ว: เฉพาะแท็บ By OS เท่านั้น ไม่กระทบแท็บอื่น) — ดู
  // [[pqa-outsource-dashboard-active-project-mismatch-2026-09]]
  //
  // 🔴 FIXED 2026-09-01 (follow-up, same day, same memory topic): the project set feeding
  // periodAggActiveOnly used to be built with matchProjectDiscovery() — same as periodAgg —
  // which also requires the project's *planned phase-date span* (projectMatchesRange(), read
  // from project_phase.start_date/end_date) to overlap the search range. That's the wrong gate
  // for By OS: a booking's own work_date can fall inside the search range even when the
  // project's recorded phase-planning dates don't line up with it (phase dates entered loosely,
  // or never updated to match actual bookings) — the booking then got silently dropped from the
  // whole aggregate before `dateRange` below ever got a chance to look at its real date.
  // Reported by Gibb: OS "กุ๊ก : Sirinapa Suraso" had a live Reg-phase booking 10–14/08/2026
  // (4 MD, visible and counted in Outsource's day grid, 154 total) but showed Total = 0 in
  // Dashboard > By OS for the same 01–31/08/2026 range. outsource.html never applies a
  // phase-window check at all — it only requires the project to be active
  // (`S.projMap[b.project_key]`, see reloadRangeData()) and then filters bookings by their own
  // start_date/end_date. By OS now matches that exactly: only `is_active` (guaranteed by
  // iterating S.activeProjMap) plus the explicit Project/UAT Lead/App ตัวกรอง selections
  // (projectPassesExtraFilters — unrelated to dates) decide which projects' bookings are
  // eligible; `dateRange` is solely responsible for the actual date restriction, checked
  // against each booking row's real work_date — same two-condition rule as outsource.html.
  // periodAgg (By Project/By Lead/Signoff) is untouched — still gated by
  // matchProjectDiscovery()'s phase-window check, still full-Phase-span MD, still matching
  // Gantt (§5.39) — this fix is scoped to periodAggActiveOnly/By OS only.
  const matchedActiveOs = {};
  Object.keys(S.activeProjMap).forEach(pk => { if (projectPassesExtraFilters(pk)) matchedActiveOs[pk] = S.activeProjMap[pk]; });
  S.periodAggActiveOnly = computeAgg(S.bookingDaily, S.leaveDaily, matchedActiveOs,
    { restrict: true, dateRange: { s: rangeS, e: rangeE } });
}

/**
 * Aggregate a set of booking/leave rows over an arbitrary period.
 *
 * นิยาม MD (ยืนยัน 2026-08-03): MD = WD × Booking MD ของพนักงานทุกคน
 *   — WD = จำนวนวันทำงาน (จ-ศ ไม่รวมวันหยุด) ที่ booking คาบเกี่ยวช่วง Period
 *   — Booking MD = booking.md ซึ่งเป็น "MD ต่อวัน" (1.0 เต็มวัน / 0.5 ครึ่งวัน)
 *   — รวมทุก booking ที่ทำงานให้ project phase นั้น
 *   v_booking_daily กาง booking เป็นรายวันทำงานให้แล้ว (md_per_day = booking.md)
 *   ดังนั้น "sum(md_per_day) ของแถวในช่วง" = WD × MD ต่อวัน = ตรงนิยามพอดี
 *   ⚠️ ก่อน 2026-08-03 view หาร md ด้วยจำนวนวันทำงานอีกชั้น ทำให้ทุกตัวเลขในหน้านี้
 *      ต่ำกว่าจริงเท่ากับจำนวนวันทำงาน — แก้ที่ sql/patch_2026-08-03_booking_md_per_day.sql
 *
 * NOTE on MD calculation (per task spec):
 *  - ทุกตัวเลขในหน้านี้เป็น **Effective MD (Booked − Leave)** เหมือนกันหมด — KPI card,
 *    chart, ตาราง By Project / By OS / By Lead → ผลรวมท้ายตารางต้องเท่ากับ KPI เสมอ
 *    (ก่อน 2026-08-04 มีแต่ KPI ที่หัก leave ตารางใช้ booked ดิบ → ต่างกันเมื่อมีวันลา
 *     ทับวันที่ถูกจอง เช่น KPI 339 vs ตาราง 340)
 *  - วิธีหัก: ทำเป็น 2 pass ต่อ resource+วัน
 *      pass 1 — รวม booked md ของ resource นั้นในวันนั้น จาก **bookingRows ทั้งหมดแบบไม่กรอง
 *               (ทุก project/phase ทั้งระบบ ไม่ว่า `restrict` จะเป็น true/false ก็ตาม)**
 *      pass 2 — factor = max(0, booked − leave) / booked แล้วคูณ md ของทุกแถวที่ผ่าน `restrict`
 *               filter แล้วเท่านั้น (นี่คือจุดเดียวที่ `restrict` มีผล — ดูหัวข้อ `restrict` ด้านล่าง)
 *    ⇒ วันลาถูก **ปันส่วนตามสัดส่วนของ booking ทั้งหมดในวันนั้นทั้งระบบ** ไม่ใช่แค่ project/phase
 *      ที่ผ่าน filter (ลาครึ่งวัน + จอง 2 project วันเดียวกัน → หักคนละครึ่งของครึ่งวัน ไม่ใช่หัก
 *      project แรกหมด — เหมือนเดิม แต่ตอนนี้ "2 project" นับรวม project ที่ไม่ผ่าน restrict ด้วย)
 *    ⇒ sum ของทุกตารางย่อย (ที่กระจายใน pass 2) = kpiEffectiveMD โดยนิยาม (kpiEffectiveMD สะสม
 *      ใน pass 2 พร้อมกับตารางอื่น ไม่ใช่ pass 1 อีกต่อไป — ดู §5.39)
 *  - วันที่มี leave แต่ไม่มี booking ไม่นับ (ไม่มีแถวใน bookingRows ให้หัก)
 *  - `restrict`: when true, bookings whose project isn't in `projMap` are skipped — **ตั้งแต่
 *    §5.39 (2026-08-12) มีผลแค่กับ pass 2 เท่านั้น** (ตัดสินว่า project ไหนโผล่ใน
 *    byProject/byProjectPhase/byAppPhase/phaseTotals/byOsApp/byOsTotal/kpiEffectiveMD) —
 *    **ไม่มีผลกับ pass 1 อีกต่อไป** pass 1 สะสม dailyBookedByResDay จาก bookingRows ทั้งหมดเสมอ
 *    เพื่อให้ factor การหักวันลาคำนวณจาก scope เดียวกับ Gantt's `buildEffFactorMap()`
 *    (`gantt.html`, §5.38 — sum จาก `S.bookings` ทั้งระบบไม่กรองอะไรเลย) ทุกประการ — การันตีว่า
 *    Booked MD ของ project/phase เดียวกันจะตรงกันระหว่าง Gantt กับ Dashboard เสมอ (ก่อนหน้านี้
 *    factor คำนวณจากแถวที่ผ่าน restrict แล้วเท่านั้น ทำให้ project ที่คนถูกจองคาบเกี่ยวกับ
 *    project อื่นที่ไม่ผ่าน filter ในวันเดียวกันแล้วมีวันลาด้วย จะโดนหักวันลาเกินจริง เทียบกับ Gantt
 *    ที่หักตาม booking ทั้งระบบ — ดู comment เหนือ `recomputeAggregates()` สำหรับเคสที่รายงานจริง)
 *    ⚠️ `bookingRows`/`leaveRows` ที่ส่งเข้ามาเป็นประวัติ**ทั้งหมดแบบไม่กรองวันที่**แล้ว
 *    (S.bookingDaily/S.leaveDaily ไม่ได้ query ด้วย .gte/.lte ช่วง Period อีกต่อไป, §5.37) ดังนั้น
 *    MD ที่ project หนึ่งได้คือ MD **เต็มช่วงจริง** ของทุก booking ของ project นั้น ไม่ถูกตัดตาม
 *    ช่วงวันที่ที่เลือกในกล่องค้นหา — **ยกเว้น** เมื่อส่ง `opts.dateRange` มา (ดูหัวข้อถัดไป)
 *  - `dateRange`: `{s, e}` (yyyy-mm-dd, 2026-09-01 ใหม่) — ถ้าส่งมา จะกรอง pass 2 rows เพิ่มอีกชั้น
 *    ให้เหลือเฉพาะ work_date อยู่ใน [s, e] เท่านั้น (ตัด MD ตามช่วงวันที่ที่เลือกจริงๆ ไม่ใช่เต็ม
 *    Phase) — ตอนนี้ใช้เฉพาะกับ `S.periodAggActiveOnly` (By OS) เพื่อให้ตรงกับ
 *    `webapp/outsource.html` ที่นับ MD แบบตัดตามวันที่เหมือนกัน (รายงานโดย Gibb 2026-09-01 — ดู
 *    [[pqa-outsource-dashboard-active-project-mismatch-2026-09]]) — `S.periodAgg` (By Project/By
 *    Lead/Signoff) ไม่ส่ง dateRange จึงยังนับเต็มช่วง Phase เหมือนเดิม (ตรงกับ Gantt's Booked MD
 *    ตามที่เคยยืนยัน §5.39 — อย่าเผลอเพิ่ม dateRange ให้ periodAgg เพราะจะทำให้ By Project เพี้ยน
 *    ไปจาก Gantt)
 */
function computeAgg(bookingRows, leaveRows, projMap, opts){
  const restrict = !!(opts && opts.restrict);
  const dateRange = opts && opts.dateRange; // { s, e } — 2026-09-01, By OS เท่านั้น, ดู recomputeAggregates()
  const byAppPhase = {};       // app -> phase -> md
  const phaseTotals = {};      // phase -> md
  const byProject = {};        // project_key -> md
  const byProjectPhase = {};   // project_key -> phase -> md
  const byOsApp = {};          // resource_id -> app -> md
  const byOsTotal = {};        // resource_id -> md
  const bookedOsSet = new Set();
  const dailyBookedByResDay = {}; // 'resId|date' -> md sum (raw booked, ก่อนหัก leave)

  // ---- pass 1: รวม booked md ต่อ resource+วัน จาก bookingRows "ทั้งหมด" เสมอ (ไม่ผ่าน restrict
  // filter) — ตั้งแต่ §5.39 (2026-08-12) เพื่อให้ factor หักวันลาคำนวณจาก scope เดียวกับ Gantt's
  // buildEffFactorMap() (sum จาก S.bookings ทั้งระบบ ไม่กรองอะไรเลย) restrict ไม่มีผลกับ pass นี้
  // อีกต่อไป (ก่อนหน้านี้ pass 1 กรองด้วย restrict เหมือน pass 2 ทำให้ project ที่คนถูกจองคาบเกี่ยว
  // กับ project อื่นที่ไม่ผ่าน filter ในวันเดียวกัน โดนหักวันลาเกินจริงเทียบกับ Gantt — ดู comment
  // เหนือ recomputeAggregates()) ----
  bookingRows.forEach(row => {
    const dayKey = row.resource_id + '|' + row.work_date;
    dailyBookedByResDay[dayKey] = (dailyBookedByResDay[dayKey] || 0) + (Number(row.md_per_day) || 0);
  });

  // leave map (unrestricted by project — leave is per-person, not per-project)
  const leaveByResDay = {};
  leaveRows.forEach(l => { leaveByResDay[l.resource_id + '|' + l.leave_date] = Number(l.leave_md) || 0; });

  // factor ต่อ resource+วัน = สัดส่วน MD ที่เหลือหลังหักวันลา (0..1) — คำนวณจาก booked ทั้งระบบ
  // (pass 1 ข้างบน) เทียบกับ leave ของวันนั้น ไม่ขึ้นกับ restrict
  const effFactorByResDay = {};
  Object.keys(dailyBookedByResDay).forEach(k => {
    const booked = dailyBookedByResDay[k];
    const eff = Math.max(0, booked - (leaveByResDay[k] || 0));
    effFactorByResDay[k] = booked > 0 ? eff / booked : 0;
  });

  // ---- pass 2: กระจาย MD (หัก leave ตามสัดส่วนแล้ว) ลงทุกมิติ — เฉพาะแถวที่ผ่าน restrict filter
  // เท่านั้น (restrict ตอนนี้มีผลแค่ตรงนี้ — ตัดสินว่า project ไหนโผล่ในตาราง ไม่เกี่ยวกับ factor
  // ข้างบนอีกต่อไป) kpiEffectiveMD สะสมที่นี่ด้วย (ย้ายมาจาก pass 1 เดิม) เพื่อรักษา invariant
  // sum(byProject) === kpiEffectiveMD ให้ยังเป็นจริงโดยนิยาม แม้ pass 1 จะไม่ผ่าน restrict แล้ว ----
  // 2026-09-01: `dateRange` (ตอนนี้ใช้แค่ periodAggActiveOnly/By OS) ตัด pass 2 ให้เหลือเฉพาะแถวที่
  // work_date ตกในช่วงที่เลือกจริงๆ เพิ่มจาก restrict (project active) — ไม่กระทบ pass 1
  // (factor หักวันลายังคิดจาก booking ทั้งระบบทุกวันเหมือนเดิม)
  let rows = restrict ? bookingRows.filter(r => !!projMap[r.project_key]) : bookingRows;
  if (dateRange) {
    rows = rows.filter(r => r.work_date >= dateRange.s && r.work_date <= dateRange.e);
  }
  let kpiEffectiveMD = 0;
  rows.forEach(row => {
    const proj = projMap[row.project_key];
    const factor = effFactorByResDay[row.resource_id + '|' + row.work_date];
    const md = (Number(row.md_per_day) || 0) * (factor === undefined ? 1 : factor);
    kpiEffectiveMD += md;
    const app = proj ? (proj.app || proj.other_app || '— ไม่มี App —') : '— ไม่ทราบ App —';

    byAppPhase[app] = byAppPhase[app] || {};
    byAppPhase[app][row.phase_code] = (byAppPhase[app][row.phase_code] || 0) + md;
    phaseTotals[row.phase_code] = (phaseTotals[row.phase_code] || 0) + md;
    byProject[row.project_key] = (byProject[row.project_key] || 0) + md;

    byProjectPhase[row.project_key] = byProjectPhase[row.project_key] || {};
    byProjectPhase[row.project_key][row.phase_code] = (byProjectPhase[row.project_key][row.phase_code] || 0) + md;

    const res = S.resourceMap[row.resource_id];
    if (res && res.resource_type === 'outsource') {
      byOsApp[row.resource_id] = byOsApp[row.resource_id] || {};
      byOsApp[row.resource_id][app] = (byOsApp[row.resource_id][app] || 0) + md;
      byOsTotal[row.resource_id] = (byOsTotal[row.resource_id] || 0) + md;
      // นับหัวคนที่ "ถูกจอง" จาก booking จริง ไม่เกี่ยวกับวันลา — ลาเต็มช่วงก็ยังถือว่าถูกจอง
      bookedOsSet.add(row.resource_id);
    }
  });

  return { byAppPhase, phaseTotals, byProject, byProjectPhase, byOsApp, byOsTotal, bookedOsCount: bookedOsSet.size, kpiEffectiveMD };
}

/* =====================================================================
   RENDER — ORCHESTRATION
   ===================================================================== */
// 2026-09-01 (§5.50, ยืนยันโดย Gibb "ตัด KPI ทิ้งด้วย เหลือแค่ตาราง"): renderSummaryToggle()/
// renderKPI()/renderCharts() (KPI grid 4 กล่อง + Chart.js bar/donut ของ By Project/By OS) ถูกลบ

// §5.20/§5.39 ที่มี test คุมอยู่: sum(byProject) === sum(phaseTotals) === kpiEffectiveMD) แค่ไม่มี

/* Show/hide the loading overlay that covers the view table. visibility:hidden keeps real
   box sizes so nothing jumps once the overlay is lifted — see the .dash-content CSS comment
   above (2026-09-01: no longer needs to accommodate Chart.js canvas sizing — charts removed). */
function showDashLoading(){
  const el = $('dashContent');
  if (el) el.classList.add('is-loading');
}
function hideDashLoading(){

  if (el) el.classList.remove('is-loading');
}

/* apps ที่ปรากฏใน byAppPhase/byOsApp ฯลฯ เรียงตาม S.appOrder (master `app` table's sort_order)
   แล้ว fallback ตัวอักษร — ใช้ร่วมกันทั้ง By OS (renderOsView/downloadOsExcel), By Lead
   (computeLeadCoverage/renderLeadView) — ไม่ใช่ chart-only helper */
function sortedApps(appKeys){
  return appKeys.slice().sort((a,b) => {
    const oa = S.appOrder[a] ?? 999, ob = S.appOrder[b] ?? 999;
    return (oa-ob) || a.localeCompare(b);
  });
}

   VIEW SWITCHING
   ===================================================================== */
function renderView(){
  const c = $('viewContainer');
  if (S.dashView === 'project') renderProjectView(c);
  else if (S.dashView === 'os') renderOsView(c);
  else if (S.dashView === 'lead') renderLeadView(c);
  else renderSignoffView(c);
}

/* ---- generic sortable-table helpers (By Project + Signoff) ---- */
function sortIco(sortState, key){
  if (sortState.key !== key) return '';
  return `<span class="sort-ico">${sortState.dir === 'asc' ? '▲' : '▼'}</span>`;
}
function thSort(label, key, sortState, extraClass){
  const cls = ['sortable', sortState.key === key ? 'sort-active' : '', extraClass||''].join(' ').trim();
  return `<th class="${cls}" data-sort-key="${esc(key)}">${esc(label)}${sortIco(sortState, key)}</th>`;
}
function genericSort(rows, sortState, keyFns){
  const kf = keyFns[sortState.key] || (() => null);
  const dir = sortState.dir === 'desc' ? -1 : 1;
  return rows.slice().sort((a,b) => {
    const va = kf(a), vb = kf(b);
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
    return String(va).localeCompare(String(vb)) * dir;
  });
}
function wireSortHeader(theadEl, sortState, onChange){
  theadEl.addEventListener('click', e => {
    const th = e.target.closest('th.sortable');
    if (!th) return;
    const key = th.dataset.sortKey;
    if (sortState.key === key) sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
    else { sortState.key = key; sortState.dir = 'asc'; }
    onChange();
  });
}

/* ---- By Project ----
   One row per project (flat — not grouped by App) so every phase-MD column
   and the UAT period can be shown/sorted at project granularity. "App" is the
   first column per spec; "Project Name" is kept as an extra identifying
   column right after it (a bare App column with no project name would make
   rows impossible to tell apart). */
/* Sub Lead names per project (project_lead.is_main = false).
   v_project_wide.uat_lead resolves the MAIN lead only, so sub leads have to come from
   project_lead + pqa_lead — the same pair the By Lead matrix uses. pqa_lead is loaded
   with is_active = true, so a sub lead that was deactivated falls back to its emp_id
   rather than disappearing from the row. */
function subLeadMap(){
  const nameOf = {};
  S.leadsAll.forEach(l => { nameOf[l.emp_id] = l.short_name || l.nickname || l.emp_id; });
  const map = {};
  S.projectLeadRows.forEach(pl => {
    if (pl.is_main || pl.is_executor) return;
    (map[pl.project_key] = map[pl.project_key] || []).push(nameOf[pl.pqa_emp_id] || pl.pqa_emp_id);
  });
  Object.values(map).forEach(a => a.sort((x,y)=>String(x).localeCompare(String(y))));
  return map;
}
/* Internal Executor names per project (project_lead.is_executor = true) — added 2026-08-13,
   same shape/pattern as subLeadMap() above, shown as another grey line in the Lead cell. */
function executorMap(){
  const nameOf = {};
  S.leadsAll.forEach(l => { nameOf[l.emp_id] = l.short_name || l.nickname || l.emp_id; });
  const map = {};
  S.projectLeadRows.forEach(pl => {
    if (!pl.is_executor) return;
    (map[pl.project_key] = map[pl.project_key] || []).push(nameOf[pl.pqa_emp_id] || pl.pqa_emp_id);
  });
  Object.values(map).forEach(a => a.sort((x,y)=>String(x).localeCompare(String(y))));
  return map;
}
/** Lead cell HTML: main lead + one grey line per sub lead (or — when there is no lead at all). */
function leadCellHTML(mainLead, subLeads, executors){
  const subs = subLeads || [];
  const execs = executors || [];
  const main = mainLead ? esc(mainLead) : ((subs.length || execs.length) ? '<span class="muted">—</span>' : '');
  const subHtml = subs.map(n => `<span class="lead-sub">${esc(n)}</span>`).join('');
  const execHtml = execs.map(n => `<span class="lead-sub">${esc(n)}</span>`).join('');
  if (!main && !subHtml && !execHtml) return '<span class="muted">—</span>';
  return `${main}${subHtml}${execHtml}`;
}

/** Whether project `pk`'s overall span (all its project_phase rows, exactly like the
 *  existing per-phase min-start/max-end scan — SIT included, nothing filtered out —
 *  PLUS project.signoff_date as one more candidate date on both ends) overlaps the given
 *  [rangeS, rangeE] "ค้นหา Project" search window. Same §4.1 standard: start ≤ End &&
 *  end ≥ Start (yyyy-mm-dd string compare). Shared by buildProjectRows() (decides which
 *  rows show in the By Project table) and recomputeAggregates() (decides which projects'
 *  bookings count toward the MD totals shown everywhere) — see §5.37. */
function projectMatchesRange(pk, rangeS, rangeE){
  const phases = S.phasesByProject[pk] || [];
  const proj = S.allProjMap[pk];
  const tcprepPhase = phases.find(ph => ph.phase_code === 'TCPREP');
  const starts = phases.map(ph => ph.start_date).filter(Boolean).sort();
  let periodStart = (tcprepPhase && tcprepPhase.start_date) || starts[0] || null;
  let maxEnd = null;
  phases.forEach(ph => { if (ph.end_date && (!maxEnd || ph.end_date > maxEnd)) maxEnd = ph.end_date; });
  if (proj && proj.signoff_date) {
    if (!periodStart || proj.signoff_date < periodStart) periodStart = proj.signoff_date;
    if (!maxEnd || proj.signoff_date > maxEnd) maxEnd = proj.signoff_date;
  }
  const periodEnd = maxEnd || periodStart;
  return !!periodStart && !!rangeS && !!rangeE && periodStart <= rangeE && periodEnd >= rangeS;
}

/** Whether project `pk` passes the Project/UAT Lead/App multiselect ตัวกรอง (2026-08-14) —
 *  independent of projectMatchesRange()'s date-range check. Empty Set on any of the 3 = "no
 *  restriction" for that field (same convention as gantt.html/outsource.html's S.filter).
 *  UAT Lead matches ANY role on the project (Main/Sub/Executor, via project_lead) — not just
 *  the main lead shown in the "Lead" column — same breadth as Gantt's msLead filter. */
function projectPassesExtraFilters(pk){
  if (S.filter.projects.size && !S.filter.projects.has(pk)) return false;
  if (S.filter.apps.size) {
    const proj = S.allProjMap[pk];
    const app = proj ? (proj.app || '') : '';
    if (!(app && S.filter.apps.has(app))) return false;
  }
  if (S.filter.leads.size) {
    const hasLead = S.projectLeadRows.some(pl => pl.project_key === pk && S.filter.leads.has(pl.pqa_emp_id));
    if (!hasLead) return false;
  }
  return true;
}

/** Combined "should this project count as discovered" check (2026-08-14) — AND's the
 *  existing date-range match (projectMatchesRange(), §5.37) with the new Project/UAT
 *  Lead/App multiselect filters above. Replaces bare projectMatchesRange() at every call
 *  site that decides which projects feed the MD aggregates / show up in a tab's rows. */
function matchProjectDiscovery(pk, rangeS, rangeE){
  return projectMatchesRange(pk, rangeS, rangeE) && projectPassesExtraFilters(pk);
}

const PROJECT_STD_PHASES = ['TCPREP','UAT','REG','SUPPORT'];

/** "Project Period" DISPLAY string for project `pk` = TC Prep phase start_date through the
 *  max end_date across all of its project_phase rows — same formula as the inline block in
 *  buildProjectRows() (kept inline there, not refactored to call this, so the tests/
 *  run_tests.mjs vm-eval harness that extracts+runs buildProjectRows() in isolation still
 *  works unmodified). Added 2026-08-14 for downloadLeadExcel()'s Project sheet, which needs
 *  the same "Project Period" text as the By Project tab — if you change one, change both. */
function projectPeriodDisp(pk){
  const phases = S.phasesByProject[pk] || [];
  const tcprepPhase = phases.find(ph => ph.phase_code === 'TCPREP');
  let maxEnd = null;
  phases.forEach(ph => { if (ph.end_date && (!maxEnd || ph.end_date > maxEnd)) maxEnd = ph.end_date; });
  const starts = phases.map(ph => ph.start_date).filter(Boolean).sort();
  const periodStart = (tcprepPhase && tcprepPhase.start_date) || starts[0] || null;
  const disp = periodStart && maxEnd ? `${dDisp(periodStart)} – ${dDisp(maxEnd)}`
    : periodStart ? dDisp(periodStart) : '—';
  return { disp, periodStart };
}

function buildProjectRows(){
  const agg = S.periodAgg || { byProject:{}, byProjectPhase:{} };
  const subLeads = subLeadMap();
  const executors = executorMap();
  // §6: By Project shows ONLY active projects (is_active = true) — activeProjects is
  // already server-filtered via .eq('is_active', true) in loadMasterData().
  const rangeS = S.overallRange.s || '', rangeE = S.overallRange.e || '';
  return S.activeProjects.map(p => {
    const pk = p.project_key;
    const phases = S.phasesByProject[pk] || [];
    const pAgg = agg.byProjectPhase[pk] || {};
    const totalMD = agg.byProject[pk] || 0;

    // any phase besides the 4 standard ones (e.g. SIT, custom-labeled phases) is an "Other"
    const otherCodes = new Set();
    phases.forEach(ph => { if (!PROJECT_STD_PHASES.includes(ph.phase_code)) otherCodes.add(ph.phase_code); });
    Object.keys(pAgg).forEach(c => { if (!PROJECT_STD_PHASES.includes(c)) otherCodes.add(c); });
    const otherSorted = [...otherCodes].sort((a,b) => {
      const pa = phases.find(x => x.phase_code === a), pb = phases.find(x => x.phase_code === b);
      return (pa && pa.sort_order != null ? pa.sort_order : 999) - (pb && pb.sort_order != null ? pb.sort_order : 999);
    });
    let other1 = 0, other2 = 0;
    otherSorted.forEach((c, i) => { const v = pAgg[c] || 0; if (i === 0) other1 += v; else other2 += v; });

    // Project Period (DISPLAY column only) = TC Prep phase start_date through the max
    // end_date across all phases — kept exactly as before, NOT signoff_date-extended.
    // The show/hide MATCH decision below uses projectMatchesRange() instead, which is a
    // separate (signoff_date-extended) calculation — see that function's doc comment.
    const tcprepPhase = phases.find(ph => ph.phase_code === 'TCPREP');
    let maxEnd = null;
    phases.forEach(ph => { if (ph.end_date && (!maxEnd || ph.end_date > maxEnd)) maxEnd = ph.end_date; });
    const starts = phases.map(ph => ph.start_date).filter(Boolean).sort();
    const periodStart = (tcprepPhase && tcprepPhase.start_date) || starts[0] || null;
    const uatPeriodDisp = periodStart && maxEnd ? `${dDisp(periodStart)} – ${dDisp(maxEnd)}`
      : periodStart ? dDisp(periodStart) : '—';

    /* §5.37 (2026-08-12): แสดงเฉพาะโปรเจกต์ที่ "ตรงกับคำค้นหา" — phase dates (ทุกเฟส รวม SIT)
       หรือ signoff_date คาบเกี่ยวช่วง "ค้นหา Project" ที่เลือก (projectMatchesRange(), มาตรฐาน
       เดียวกับ §4.1: start ≤ End && end ≥ Start) — เดิม §5.23 มีข้อยกเว้น "MD มากกว่าศูนย์ต้อง
       แสดงเสมอ" เพราะตอนนั้น MD ยังถูกตัดตามช่วง Period ที่เลือก ทำให้ MD มากกว่าศูนย์ได้แม้ phase
       จะไม่คาบเกี่ยว ตอนนี้ MD เป็นค่าเต็มช่วง (full-span) ของ**เฉพาะ**โปรเจกต์ที่ผ่านการค้นหา
       แล้วเท่านั้น (recomputeAggregates() ใช้ projectMatchesRange() ตัวเดียวกันนี้กรอง projMap
       ก่อนเข้า computeAgg) ⇒ โปรเจกต์ที่ไม่ผ่านการค้นหาจะมี MD เป็นศูนย์เสมอโดยธรรมชาติ —
       เก็บ exception เดิมไว้จะทำให้ตัวกรองค้นหาไม่กรองอะไรเลย จึงตัดทิ้งไปตรงๆ */
    if (!matchProjectDiscovery(pk, rangeS, rangeE)) return null;

    return {
      app: p.app || p.other_app || '— ไม่มี App —',
      projectName: p.project_name || '',
      lead: p.uat_lead || '',
      subLeads: subLeads[pk] || [],
      executors: executors[pk] || [],
      uatPeriodDisp, uatPeriodSortKey: periodStart || '',
      totalMD, tcprep: pAgg.TCPREP || 0, uat: pAgg.UAT || 0, reg: pAgg.REG || 0,
      other1, other2, support: pAgg.SUPPORT || 0,
    };
  }).filter(Boolean);
}
const PROJECT_KEYFNS = {
  app: r => r.app, lead: r => r.lead, uatPeriod: r => r.uatPeriodSortKey,
  totalMD: r => r.totalMD, tcprep: r => r.tcprep, uat: r => r.uat, reg: r => r.reg,
  other1: r => r.other1, other2: r => r.other2, support: r => r.support,
};
function renderProjectView(container){
  const rows = buildProjectRows();
  if (!rows.length) {
    container.innerHTML = '<div class="empty-state">ไม่พบ Project</div>';
    return;
  }
  const sorted = genericSort(rows, S.projectSort, PROJECT_KEYFNS);

  let gTotal=0, gTcprep=0, gUat=0, gReg=0, gOther1=0, gOther2=0, gSupport=0;
  const bodyRows = sorted.map(r => {
    gTotal+=r.totalMD; gTcprep+=r.tcprep; gUat+=r.uat; gReg+=r.reg; gOther1+=r.other1; gOther2+=r.other2; gSupport+=r.support;
    return `<tr>
      <td class="col-app" title="${esc(r.app)}">${esc(r.app)}</td>
      <td class="proj-name" title="${esc(r.projectName)}">${esc(truncName(r.projectName))}</td>
      <td class="col-lead" title="${esc([r.lead, ...r.subLeads, ...r.executors].filter(Boolean).join(' / '))}">${leadCellHTML(r.lead, r.subLeads, r.executors)}</td>
      <td>${esc(r.uatPeriodDisp)}</td>
      <td class="right">${fmtMD(r.totalMD)}</td>
      <td class="right">${fmtMD(r.tcprep)}</td>
      <td class="right">${fmtMD(r.uat)}</td>
      <td class="right">${fmtMD(r.reg)}</td>
      <td class="right">${fmtMD(r.other1)}</td>
      <td class="right">${fmtMD(r.other2)}</td>
      <td class="right">${fmtMD(r.support)}</td>
    </tr>`;
  }).join('');

  container.innerHTML = `
    <div class="dash-table-wrap">
