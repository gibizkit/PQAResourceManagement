const ACTUAL_MD_HEADERS = ['YYYYMM', 'Nickname_Name', 'EN_Fullname', 'Project_Code', 'App_ID', 'Approver_Choice', 'Actual_MD'];

/* pivot ของ Excel เขียนคำว่า "(blank)" ลงมาเป็นข้อความจริงในช่องที่ไม่มีค่า — ต้องแปลงเป็น
   ค่าว่างทุกช่องข้อความ ไม่งั้น approver จะกลายเป็นอีเมลชื่อ (blank) */
function actualCellText(v){
  const s = String(v == null ? '' : v).trim();
  return s.toLowerCase() === '(blank)' ? '' : s;
}

/** Parse the "Data" sheet of an Actual MD import file — takes a plain AOA (array-of-arrays,
 *  e.g. from `XLSX.utils.sheet_to_json(worksheet, { header: 1 })`) rather than a workbook or
 *  a File, and an explicit `appCodeSet` (Set of valid pqa.app.app_code values) rather than
 *  reading S.appList itself — both deliberate so this stays a pure function a test can call
 *  directly with fabricated data, no real .xlsx file or live Supabase/S.* needed (per the
 *  orchestrating task's explicit instruction — the plan doc's original sketch of
 *  `parseActualFile(workbook)` is superseded by this signature for testability).
 *
 *  Row numbers in `errors`/`warnings` are the ACTUAL EXCEL ROW NUMBER a human editing the
 *  file would see (header row = 1, first data row = 2) — not the 0-based `aoa` index.
 *
 *  `leadEmailSet` (optional — Set of valid pqa_lead email addresses, lower-cased): when given,
 *  an `approver_choice` that isn't in it produces a non-blocking warning (import still goes
 *  through; it just means filtering by UAT Lead in the Compare view won't find the row). When
 *  omitted (null/undefined), the email check is skipped entirely — the real call site wires this
 *  in Task 3 once S.leadsAll carries emails; until then it can pass null safely.
 *
 *  Returns { rows, errors, warnings, byMonth }:
 *   - rows: [{ ym, app_code, project_code, nickname_name, en_fullname, approver_choice,
 *     actual_md }] — ready to pass straight through as `p_rows` to
 *     `supabase.rpc('fn_import_actual_md', { p_rows })`. Exact-duplicate rows (same
 *     ym+app_code+project_code+nickname_name+en_fullname+approver_choice) are merged into ONE
 *     row here with actual_md summed (§3.1 spec: "แถวที่ซ้ำเป๊ะจะถูกรวมยอดตอนอ่าน") — reported
 *     as a warning, not blocked. Rows that differ only by approver_choice are DIFFERENT rows
 *     (real file has the same person/month/project/app approved in pieces by different
 *     approvers) and are never merged together.
 *   - errors: [{ row, msg }] — blocking; caller must keep the confirm button disabled while
 *     this is non-empty.
 *   - warnings: [{ row, msg }] — non-blocking, informational only.
 *   - byMonth: { 'YYYYMM': { count, totalMD } } — per-month summary for the preview modal. */
function parseActualFile(aoa, appCodeSet, leadEmailSet){
  const errors = [];
  const warnings = [];

  if (!Array.isArray(aoa) || !aoa.length) {
    errors.push({ row: 1, msg: 'ไฟล์ว่างเปล่า หรืออ่านไฟล์ไม่ได้' });
    return { rows: [], errors, warnings, byMonth: {} };
  }

  const header = (aoa[0] || []).map(h => String(h == null ? '' : h).trim());
  const headerOk = ACTUAL_MD_HEADERS.every((h, i) => header[i] === h);
  if (!headerOk) {
    errors.push({ row: 1, msg: `ไฟล์ไม่ตรง template — หัวคอลัมน์ต้องเป็น ${ACTUAL_MD_HEADERS.join(', ')}` });
    return { rows: [], errors, warnings, byMonth: {} };
  }

  const dataLines = aoa.slice(1);
  const isBlankLine = line => !line || line.every(c => c === undefined || c === null || String(c).trim() === '');
  if (!dataLines.some(line => !isBlankLine(line))) {
    errors.push({ row: 2, msg: 'ไม่มีแถวข้อมูลเลย' });
    return { rows: [], errors, warnings, byMonth: {} };
  }

  const seen = new Map(); // dedupe key -> merged row object (still carries `row` for the warning message)
  const merged = [];
  dataLines.forEach((line, idx) => {
    const excelRow = idx + 2; // header = row 1, first data row = row 2
    if (isBlankLine(line)) return; // skip fully-blank rows silently (not an error)

    const [ymRaw, nickRaw, fullRaw, pcRaw, appRaw, approverRaw, mdRaw] = line;
    const ym = actualCellText(ymRaw);
    const appCode = actualCellText(appRaw);
    const nickname_name = actualCellText(nickRaw);
    const en_fullname = actualCellText(fullRaw);
    const project_code = actualCellText(pcRaw);
    const approver_choice = actualCellText(approverRaw).toLowerCase();

    if (!/^\d{6}$/.test(ym)) {
      errors.push({ row: excelRow, msg: `YYYYMM ไม่ถูกต้อง: "${ymRaw == null ? '' : ymRaw}" (ต้องเป็นตัวเลข 6 หลัก เช่น 202602)` });
    }
    if (appCodeSet && !appCodeSet.has(appCode)) {
      errors.push({ row: excelRow, msg: `App_ID ไม่มีใน master: "${appCode}"` });
    }
    if (approver_choice && leadEmailSet && !leadEmailSet.has(approver_choice)) {
      warnings.push({ row: excelRow, msg: `Approver_Choice ไม่ตรงกับ Lead คนไหน: "${approver_choice}" (import ได้ แต่กรอง UAT Lead จะไม่เจอแถวนี้)` });
    }
    const md = Number(mdRaw);
    const mdBlank = mdRaw === '' || mdRaw === undefined || mdRaw === null;
    if (mdBlank || isNaN(md) || md < 0) {
      errors.push({ row: excelRow, msg: `Actual_MD ไม่ถูกต้อง: "${mdRaw == null ? '' : mdRaw}" (ต้องเป็นตัวเลข ≥ 0)` });
    }

    const key = [ym, appCode, project_code, nickname_name, en_fullname, approver_choice].join('|');
    if (seen.has(key)) {
      const target = seen.get(key);
      warnings.push({ row: excelRow, msg: `แถวซ้ำกับแถวที่ ${target.row} (เดือน/App/Project/ชื่อ/Approver เดียวกัน) — รวมยอด MD เข้าด้วยกัน` });
      target.actual_md = (Number(target.actual_md) || 0) + (isNaN(md) ? 0 : md);
    } else {
      const rowObj = { ym, app_code: appCode, project_code, nickname_name, en_fullname, approver_choice, actual_md: isNaN(md) ? 0 : md, row: excelRow };
      seen.set(key, rowObj);
      merged.push(rowObj);
    }
  });

  const byMonth = {};
  merged.forEach(r => {
    byMonth[r.ym] = byMonth[r.ym] || { count: 0, totalMD: 0 };
    byMonth[r.ym].count += 1;
    byMonth[r.ym].totalMD += Number(r.actual_md) || 0;
  });

  const rows = merged.map(({ row, ...rest }) => rest); // strip the internal `row` bookkeeping field
  return { rows, errors, warnings, byMonth };
}

/** Row counts of EXISTING pqa.actual_md data for the months a just-parsed file touches —
 *  shown in the preview modal so an admin can see, before confirming, how many rows each
 *  month's "delete then insert" (fn_import_actual_md, §3.4) will remove. Queries the raw
 *  table (not the aggregated v_actual_md_app_month view) because it's specifically a ROW
 *  count, not an MD sum. `months` here are already 'YYYYMM' strings (parseActualFile()'s
 *  own `ym` format — no conversion needed, unlike S.actualByAppMonth's 'YYYY-MM' keys).
 *  Wrapped in fetchAllRows() per §5.49 even though this table is tiny in practice. */
async function fetchExistingActualRowCounts(months){
  if (!months || !months.length) return {};
  const { data, error } = await fetchAllRows((from, to) => supabase.from('actual_md')
    .select('ym')
    .in('ym', months)
    .order('ym', { ascending: true })
    .order('actual_id', { ascending: true })
    .range(from, to));
  if (error) { console.warn('fetchExistingActualRowCounts failed:', error); return {}; }
  const counts = {};
  (data || []).forEach(r => { counts[r.ym] = (counts[r.ym] || 0) + 1; });
  return counts;
}

/** Build the #actualImportBody innerHTML for the preview modal — per-month summary table
 *  (new row count / existing rows that will be deleted / total MD) + an errors table
 *  (blocking, capped at 50 rows + "และอีก N รายการ") + a warnings table (non-blocking,
 *  same cap). Pure-ish: takes `parsed` (parseActualFile()'s return) and `existingCounts`
 *  (fetchExistingActualRowCounts()'s return) as arguments. */
function buildActualImportModalBody(parsed, existingCounts){
  const months = Object.keys(parsed.byMonth).sort();
  const monthRows = months.map(ym => {
    const disp = monthLabel(ym.slice(0, 4) + '-' + ym.slice(4, 6));
    const info = parsed.byMonth[ym];
    return `<tr><td>${esc(disp)}</td><td class="right">${info.count}</td><td class="right">${existingCounts[ym] || 0}</td><td class="right">${fmtMD(info.totalMD)}</td></tr>`;
  }).join('');

  const errBlock = parsed.errors.length ? `
    <div class="actual-import-err-title">พบข้อผิดพลาด ${parsed.errors.length} รายการ (ต้องแก้ไฟล์แล้วอัปโหลดใหม่)</div>
    <table class="actual-import-table">
      <thead><tr><th>แถว</th><th>ข้อความ</th></tr></thead>
      <tbody>${parsed.errors.slice(0, 50).map(e => `<tr><td>${e.row}</td><td>${esc(e.msg)}</td></tr>`).join('')}</tbody>
    </table>
    ${parsed.errors.length > 50 ? `<div class="muted">และอีก ${parsed.errors.length - 50} รายการ</div>` : ''}
  ` : '';

  const warnBlock = parsed.warnings.length ? `
    <div class="actual-import-warn-title">คำเตือน ${parsed.warnings.length} รายการ (ไม่บล็อกการนำเข้า)</div>
    <table class="actual-import-table">
      <thead><tr><th>แถว</th><th>ข้อความ</th></tr></thead>
      <tbody>${parsed.warnings.slice(0, 50).map(w => `<tr><td>${w.row}</td><td>${esc(w.msg)}</td></tr>`).join('')}</tbody>
    </table>
    ${parsed.warnings.length > 50 ? `<div class="muted">และอีก ${parsed.warnings.length - 50} รายการ</div>` : ''}
  ` : '';

  return `
    <p>ไฟล์นี้มี <b>${parsed.rows.length}</b> แถว ครอบคลุม <b>${months.length}</b> เดือน — การนำเข้าจะ
    <b>ลบข้อมูลเดิมของเดือนที่มีในไฟล์ทั้งหมด แล้วใส่ใหม่ทั้งหมด</b> (เดือนอื่นที่ไม่อยู่ในไฟล์นี้จะไม่ถูกแตะ)</p>
    <table class="actual-import-table">
      <thead><tr><th>เดือน</th><th class="right">แถวใหม่</th><th class="right">แถวเดิมที่จะถูกลบ</th><th class="right">ยอด MD รวม</th></tr></thead>
      <tbody>${monthRows}</tbody>
    </table>
    ${errBlock}
    ${warnBlock}
  `;
}

let _actualImportParsed = null; // parseActualFile()'s result for the file currently in the preview modal

/** เปิด modal พรีวิว — เรียกหลังอ่านไฟล์+parseActualFile() เสร็จเสมอ (ไม่มีทางเขียนลง DB ตรงๆ
 *  โดยไม่ผ่านหน้าพรีวิวนี้ก่อน, §5.3). ปุ่มยืนยัน disabled ตราบใดที่ parsed.errors.length > 0. */
async function openActualImportModal(parsed){
  _actualImportParsed = parsed;
  const months = Object.keys(parsed.byMonth).sort();
  const existingCounts = await fetchExistingActualRowCounts(months);
  $('actualImportBody').innerHTML = buildActualImportModalBody(parsed, existingCounts);
  $('actualImportErr').textContent = '';
  $('actualImportConfirmBtn').disabled = parsed.errors.length > 0;
  $('actualImportOverlay').classList.remove('hidden');
}
window.closeActualImportModal = function(){
  $('actualImportOverlay').classList.add('hidden');
  _actualImportParsed = null;
};
/** ยืนยันนำเข้าจริง — เขียนผ่าน RPC เดียว `fn_import_actual_md` เท่านั้น (ไม่มีทาง
 *  `supabase.from('actual_md').insert(...)` ตรงๆ — delete+insert ต้องเป็น transaction เดียว
 *  ตามกติกา §3 ของโปรเจกต์). สำเร็จ → toast จำนวนแถวที่ลบ/เพิ่ม → ปิด modal → loadPeriod(true)
 *  โหลด v_actual_md_app_month (+ booking/leave) ใหม่จาก Supabase สดๆ แล้ว re-render — ล้มเหลว →
 *  โชว์ error ใน modal ไม่ปิด modal (ให้แก้/ลองใหม่ได้โดยไม่ต้องเลือกไฟล์ซ้ำ). */
window.confirmActualImport = async function(){
  if (!_actualImportParsed || _actualImportParsed.errors.length) return;
  const btn = $('actualImportConfirmBtn');
  btn.disabled = true;
  $('actualImportErr').textContent = '';
  try {
    const { data, error } = await supabase.rpc('fn_import_actual_md', { p_rows: _actualImportParsed.rows });
    if (error) throw error;
    toast(`นำเข้าสำเร็จ — ลบข้อมูลเดิม ${data.deleted} แถว / เพิ่มใหม่ ${data.inserted} แถว`);
    closeActualImportModal();
    await loadPeriod(true);
  } catch (err) {
    console.error(err);
    $('actualImportErr').textContent = 'นำเข้าไม่สำเร็จ: ' + (err.message || String(err));
    btn.disabled = false;
  }
};

/* =====================================================================
   PERIOD DEFAULTS + MONTH PICKER (§5.50, 2026-09-01)
   "ค้นหา Project" เดิมเป็น Start/End (2 input[type=date]) — เปลี่ยนเป็น month picker ช่องเดียว
   (mirrors calendar.html's ‹/เดือน/› + picker panel ปี+เดือน) 2026-09-09 (§5.60) เป็น
   **multi-select** แล้ว — ตัวเลือกเดือนเก็บเป็น S.months[]
   (เหมือน calendar.html) แล้ว derive S.overallRange = {s,e} จากเดือนนั้นเสมอผ่าน
   overallRangeFromMonths() — ทุกอย่างใต้ S.overallRange (projectMatchesRange()/
   recomputeAggregates()/matchProjectDiscovery(), §5.37/§5.39) อ่าน .s/.e เหมือนเดิมทุกประการ
   ไม่ถูกแตะเลยในงานนี้ ===================================================================== */
/** {s,e} ครอบเดือนแรกสุด..เดือนท้ายสุดของ `months` (array ของ 'YYYY-MM' จะเรียงมาหรือไม่ก็ได้)
 *  — จุดเดียวที่ S.overallRange ถูก derive จาก S.months เก็บเป็น pure helper (ไม่อ่าน S.*)
 *  ให้ unit-test ง่าย
 *  ⚠️ ค่านี้เป็นแค่ "ซอง" ใช้กับสิ่งที่ต้องการวันเริ่ม/วันจบจริงๆ (osRowVisible() เช็ควันลาออก)
 *  เท่านั้น — **ห้ามใช้เป็นตัวกรอง MD** เพราะเดือนที่เลือกไม่จำเป็นต้องติดกัน ตัวกรอง MD คือ
 *  monthSetOf() ด้านล่าง */
function overallRangeFromMonths(months){
  const ms = [...(months || [])].sort();
  if (!ms.length) return { s: '', e: '' };
  const y1 = Number(ms[0].slice(0, 4)), m1 = Number(ms[0].slice(5, 7));
  const y2 = Number(ms[ms.length - 1].slice(0, 4)), m2 = Number(ms[ms.length - 1].slice(5, 7));
  return { s: d2s(new Date(y1, m1 - 1, 1)), e: d2s(new Date(y2, m2, 0)) };
}
/** Set ของเดือนที่เลือก — ตัวกรอง MD ตัวจริง (ส่งเป็น opts.monthSet ให้ computeAgg()) */
function monthSetOf(months){ return new Set(months || []); }

/** ป้ายบนปุ่มกลางของ month picker — 1 เดือนโชว์ "Mmm-yyyy" (§4.5), หลายเดือนโชว์
 *  "Mmm-yyyy +N" และเก็บรายการเต็มไว้ใน title ให้ hover อ่านได้ */
function updateMonthBtnLabel(){
  const btn = $('dashMonthBtn');
  const ms = S.months || [];
  if (!ms.length) { btn.textContent = '—'; btn.title = ''; return; }
  const full = ms.map(mm => monthLabel(mm));
  btn.textContent = ms.length === 1 ? full[0] : `${full[0]} +${ms.length - 1}`;
  btn.title = full.join(', ');
}
/** เติม S.months (และ S.overallRange ที่ derive จากมัน) ด้วย default ตอนโหลดครั้งแรก —
 *  default ของ Dashboard คือ "เดือนปัจจุบันเดือนเดียว" (ต่างจากมาตรฐาน §4.2 ของ gantt/outsource
 *  โดยตั้งใจ, เหมือนเดิมตั้งแต่ §5.50) จะเติมก็ต่อเมื่อ showApp() + restoreDashPrefs() ไม่ได้
 *  ทิ้งเดือนที่ใช้ได้ไว้ให้แล้ว */
function ensureOverallRangeDefaults(){
  if (!Array.isArray(S.months) || !S.months.length) {
    const now = new Date();
    S.months = [`${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`];
  }
  S.months = [...new Set(S.months)].sort();
  S.overallRange = overallRangeFromMonths(S.months);
  updateMonthBtnLabel();
}
/** ปุ่ม ‹ / › เลื่อน **ทั้งชุด**ที่เลือกไว้ไปข้างหน้า/ถอยหลัง `delta` เดือน (รักษาช่องว่างระหว่าง
 *  เดือนที่ไม่ติดกันไว้เหมือนเดิม เช่น [ก.พ., เม.ย.] → [มี.ค., พ.ค.]) */
function changeMonth(delta){
  applyMonths((S.months || []).map(mm => {
    const y = Number(mm.slice(0, 4)), m = Number(mm.slice(5, 7));
    const d = new Date(y, m - 1 + delta, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }));
}
/** commit ชุดเดือนใหม่: sort + ตัดซ้ำ → S.months → S.overallRange → label → prefs → recompute
 *  จาก cache เดิม (loadPeriod(false) ไม่ยิง network ซ้ำ, §5.37)
 *  **ห้ามเหลือ 0 เดือน** — ส่ง array ว่างมาจะถูกเมิน (ไม่งั้นทั้งหน้าจะว่างโดยไม่มีทางกู้จาก UI) */
function applyMonths(months){
  const next = [...new Set((months || []).filter(Boolean))].sort();
  if (!next.length) return;
  S.months = next;
  S.overallRange = overallRangeFromMonths(next);
  updateMonthBtnLabel();
  savePrefs(PAGE, { months: S.months });
  loadPeriod(false);
}
/** panel เลือกปี+เดือน — ปุ่มเดือนเป็น **toggle** (คลิกติ๊ก/เอาออก) panel ไม่ปิดเองตอนคลิกเดือน
 *  เพื่อให้เลือกหลายเดือนรวดเดียวได้ ปิดด้วยปุ่ม "เสร็จ" / คลิกนอก panel / ESC */

};
/** ติ๊ก/เอาติ๊กออก 1 เดือน — เอาเดือนสุดท้ายออกไม่ได้ (applyMonths() เมิน array ว่าง อยู่แล้ว
 *  แต่กันไว้ตรงนี้ด้วยเพื่อไม่ให้ปุ่มดูเหมือนกดได้แล้วไม่มีอะไรเกิดขึ้น) */
window.dashToggleMonth = function(mm){
  const has = S.months.includes(mm);
  if (has && S.months.length === 1) return;
  applyMonths(has ? S.months.filter(x => x !== mm) : [...S.months, mm]);
  renderDashMonthPanel();
};
window.dashResetMonths = function(){
  const now = new Date();
  applyMonths([`${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`]);
  renderDashMonthPanel();
};
window.dashCloseMonthPanel = function(){
  $('dashMonthPanel').classList.add('hidden');
};
/** Wire the ‹ / เดือน / › controls + the year/month picker panel — called once from showApp()
 *  (mirrors wireToolbar()'s one-time-wiring pattern; DOM elements are static markup, not
 *  dynamically (re)created, so no need to re-wire on every render). */
function wireMonthPicker(){
  $('dashPrevBtn').addEventListener('click', () => changeMonth(-1));
  $('dashNextBtn').addEventListener('click', () => changeMonth(1));
  $('dashMonthBtn').addEventListener('click', e => {
    e.stopPropagation();
    const panel = $('dashMonthPanel');
    if (panel.classList.contains('hidden')) {
      dashPickerYear = Number((S.months[0] || '').slice(0, 4)) || new Date().getFullYear();
      renderDashMonthPanel();
      panel.classList.remove('hidden');
    } else {
      panel.classList.add('hidden');
    }
  });
  $('dashMonthPanel').addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', e => {
    const wrap = $('dashMonthPicker');
    if (wrap && !wrap.contains(e.target)) $('dashMonthPanel').classList.add('hidden');
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') $('dashMonthPanel').classList.add('hidden');
  });
}

/* =====================================================================
   MULTISELECT (Project/UAT Lead/App ตัวกรอง — เอา pattern เดียวกับ gantt.html/outsource.html
   มาใช้ทั้งดุ้น, 2026-08-14 ตามคำขอพี่กิ๊บ)
   ===================================================================== */
function makeMultiSelect(hostId, items, selectedSet, labelAll){
  const host = $(hostId);
  host.innerHTML = `
    <button class="ms-btn" type="button">${labelAll} <span class="ms-count">▾</span></button>
    <div class="ms-panel hidden">
      <div class="ms-search-wrap">
        <input type="text" class="ms-search" placeholder="พิมพ์เพื่อค้นหา...">
        <button type="button" class="ms-search-x" title="ล้างคำค้นหา">×</button>
      </div>
      <div class="ms-tools">
        <button type="button" data-act="none">ล้าง</button>
      </div>
      <div class="ms-list"></div>
    </div>`;
  const btn = host.querySelector('.ms-btn');
  const panel = host.querySelector('.ms-panel');
  const list = host.querySelector('.ms-list');
  const search = host.querySelector('.ms-search');
  const searchX = host.querySelector('.ms-search-x');
  list.innerHTML = items.map(it =>
    `<label class="ms-item" data-label="${esc(String(it.label).toLowerCase())}"><input type="checkbox" value="${esc(it.value)}"${selectedSet.has(it.value)?' checked':''}><span>${esc(it.label)}</span></label>`).join('');

  const applySearch = () => {
    const q = search.value.trim().toLowerCase();
    list.querySelectorAll('.ms-item').forEach(el => {
      el.style.display = (!q || (el.dataset.label||'').includes(q)) ? '' : 'none';
    });
  };
  search.oninput = applySearch;
  search.onclick = (e) => e.stopPropagation();
  searchX.onclick = (e) => { e.stopPropagation(); search.value=''; applySearch(); search.focus(); };

  // เปิด dropdown ตัวไหน → หุบตัวอื่นทั้งหมดก่อน (เปิดได้ทีละอันเท่านั้น)
  btn.onclick = (e) => {
    e.stopPropagation();
    const willOpen = panel.classList.contains('hidden');
    closeAllMsPanels();
    if (willOpen) { panel.classList.remove('hidden'); search.focus(); }
  };
  panel.onclick = (e) => { e.stopPropagation(); };
  list.onchange = () => {
    selectedSet.clear();
    list.querySelectorAll('input:checked').forEach(cb => selectedSet.add(cb.value));
    updateMsLabel(host, items, selectedSet, labelAll);
    onExtraFilterChange();
  };
  host.querySelector('[data-act=none]').onclick = () => {
    selectedSet.clear();
    list.querySelectorAll('input').forEach(cb => cb.checked=false);
    updateMsLabel(host, items, selectedSet, labelAll);
    onExtraFilterChange();
  };
  updateMsLabel(host, items, selectedSet, labelAll);
}
function updateMsLabel(host, items, selectedSet, labelAll){
  const btn = host.querySelector('.ms-btn');
  const n = selectedSet.size;
  let label;
  if (n === 0) {
    label = labelAll;
  } else if (n === 1) {
    const only = [...selectedSet][0];
    const it = items.find(x => x.value === only);
    label = it ? it.label : labelAll;
  } else {
    label = `${n} รายการ`;
  }
  btn.innerHTML = `${esc(String(label))} <span class="ms-count">▾</span>`;
}
function closeAllMsPanels(){
  document.querySelectorAll('.ms-panel').forEach(p => p.classList.add('hidden'));
}
document.addEventListener('click', closeAllMsPanels);
// ESC ก็หุบ dropdown ที่เปิดอยู่
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.querySelector('.ms-panel:not(.hidden)')) {
    closeAllMsPanels();
    e.stopPropagation();
  }
}, true);

/** Build the 3 multiselect widgets from master data — call once after loadMasterData()
 *  (needs S.activeProjects/S.leadsAll/S.appList populated) + restoreDashPrefs() (needs
 *  S.filter.* already restored so the widgets open with the right checkboxes pre-checked). */
function buildFilterMultiSelects(){
  makeMultiSelect('msProject',
    S.activeProjects.slice().sort((a,b)=>String(a.project_name).localeCompare(String(b.project_name)))
      .map(p => ({ value:p.project_key, label:p.project_name })),
    S.filter.projects, 'ทุก Project');
  makeMultiSelect('msLead',
    S.leadsAll.map(l => ({ value:l.emp_id, label:l.short_name || l.nickname || l.emp_id })),
    S.filter.leads, 'ทุก Lead');
  makeMultiSelect('msApp',
    S.appList.map(a => ({ value:a.app_code, label:a.app_code })),
    S.filter.apps, 'ทุก App');
}

// dump S.filter (Project/UAT Lead/App multiselect) ลง sessionStorage — เรียกทุกครั้งที่ตัวเลือก
// ใน multiselect เปลี่ยน (แยก key จาก rangeS/rangeE/panelOpen ที่มี savePrefs ของตัวเองอยู่แล้ว)
function saveFilterPrefs(){
  savePrefs(PAGE, {
    projects: [...S.filter.projects],
    leads: [...S.filter.leads],
    apps: [...S.filter.apps],
  });
}

/** Project/UAT Lead/App multiselect เปลี่ยน → มีผลทันที (ไม่ต้องกด "ค้นหา" เหมือน Start/End) —
 *  ต้อง recomputeAggregates() ใหม่ด้วย เพราะ matchProjectDiscovery() (ซึ่งเช็ค S.filter ด้วย
 *  ตั้งแต่ 2026-08-14) เป็นตัวตัดสิน projMap ที่ป้อนเข้า computeAgg(). */
function onExtraFilterChange(){
  saveFilterPrefs();
  showDashLoading();
  recomputeAggregates();
  renderAll();
  hideDashLoading();
}

/* =====================================================================
   TOOLBAR WIRING
   ===================================================================== */
function wireToolbar(){
  $('viewTabs').addEventListener('click', e => {
    const btn = e.target.closest('.view-tab');
    if (!btn) return;
    switchDashView(btn.dataset.view);
  });
  // ปุ่มตัวกรอง (2026-08-14, ตามคำขอพี่กิ๊บ) — pattern เดียวกับ gantt.html/outsource.html
  $('toggleFilterBtn').addEventListener('click', () => {
    $('filterPanel').classList.toggle('hidden');
    savePrefs(PAGE, { panelOpen: !$('filterPanel').classList.contains('hidden') });
  });
  $('leadRoleSelect').addEventListener('change', () => {
    S.leadRoleFilter = $('leadRoleSelect').value;
    savePrefs(PAGE, { leadRoleFilter: S.leadRoleFilter });
    // 2026-08-14: Type/Domain โชว์ทุก tab แล้ว (ไม่ใช่แค่ By Lead) — re-render Lead matrix เฉพาะ
    // ตอนที่ By Lead tab กำลังแสดงอยู่จริงเท่านั้น ไม่งั้น renderLeadView() จะไปทับ viewContainer
    // ที่ตอนนั้นแสดง By Project/By OS/Signoff อยู่โดยไม่ตั้งใจ
    if (S.dashView === 'lead') renderLeadView($('viewContainer'));
  });
  $('leadDomainSelect').addEventListener('change', () => {
    S.leadDomainFilter = $('leadDomainSelect').value;
    savePrefs(PAGE, { leadDomainFilter: S.leadDomainFilter });
    if (S.dashView === 'lead') renderLeadView($('viewContainer')); // เหตุผลเดียวกับด้านบน
  });
  // 2026-09-02 (ตามคำขอพี่กิ๊บ): dropdown View (All MD / Selected Month) — By Project tab
  // เท่านั้น มีผลทันที (ไม่ต้องกดรอ) เหมือน Project/UAT Lead/App multiselect — ต้อง
  // recomputeAggregates() ใหม่เพราะ S.periodAggProjectView (ที่ buildProjectRows() ใช้) ขึ้นกับ
  // S.projectViewMode โดยตรง
  $('projectViewSelect').addEventListener('change', () => {
    S.projectViewMode = $('projectViewSelect').value;
    savePrefs(PAGE, { projectViewMode: S.projectViewMode });
    showDashLoading();
    recomputeAggregates();
    renderAll();
    hideDashLoading();
  });
  $('downloadExcelBtn').addEventListener('click', downloadDashboardExcel);
  // 2026-09-02: ปุ่ม Refresh ใหม่ (ดู comment ที่ markup ของปุ่ม) — โหลด master data
  // (project/phase/lead/app ฯลฯ) + booking/leave ใหม่จาก Supabase สดๆ แล้ว recompute+render
  $('refreshDashBtn').addEventListener('click', async () => {
    showDashLoading();
    await loadMasterData();
    buildFilterMultiSelects();
    await loadPeriod(true);
  });
  // 2026-09-09 (§5.60, Task 4): Compare Actual — re-render เฉยๆ ไม่ยิง query ใหม่
  // (S.actualByAppMonth โหลดไว้ครบแล้วตั้งแต่ loadPeriod()) มีผลเฉพาะตอนกำลังดูแท็บ By App จริงๆ
  $('cmpActualChk').addEventListener('change', () => {
    S.compareActual = $('cmpActualChk').checked;
    savePrefs(PAGE, { compareActual: S.compareActual });
    if (S.dashView === 'app') renderAppView($('viewContainer'));
  });
  // §5.63 Task 5: ปุ่มโหมด Booked MD / Actual MD / Compare (By OS tab) — re-render เฉยๆ
  // ไม่ยิง query ใหม่ (S.actualPersonRows/S.periodAggActiveOnly โหลดไว้ครบแล้วตั้งแต่
  // loadPeriod()) เคลียร์ S.osExpanded ทุกครั้งที่สลับโหมด (view state ของโหมด Compare,
  // Task 6 — ไม่มีเหตุผลจะจำ expand ค้างข้ามโหมดที่ตารางหน้าตาไม่เหมือนกันเลย)
  $('osModeTools').addEventListener('click', e => {
    const btn = e.target.closest('.os-mode-btn');
    if (!btn) return;
    S.osMode = btn.dataset.mode;
    savePrefs(PAGE, { osMode: S.osMode });
    S.osExpanded = {};
    document.querySelectorAll('#osModeTools .os-mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === S.osMode));
    if (S.dashView === 'os') renderView();
  });
  // 2026-09-09 (§5.60, Task 5): Download Template / Import Actual MD — admin เท่านั้น (ปุ่มถูก
  // ซ่อนสำหรับ non-admin อยู่แล้วผ่าน updateAppAdminToolsVisibility() แต่ผูก listener ไว้เสมอ
  // เผื่อ role เปลี่ยนระหว่าง session — ด่านจริงคือ RLS + guard ใน fn_import_actual_md())
  $('downloadActualTemplateBtn').addEventListener('click', downloadActualTemplate);
  $('importActualBtn').addEventListener('click', () => $('importActualFile').click());
  $('importActualFile').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ''; // เคลียร์ทันที กันเลือกไฟล์เดิมซ้ำแล้ว change event ไม่ยิง
    if (!file) return;
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const sheetName = wb.SheetNames.includes('Data') ? 'Data' : wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      const aoa = XLSX.utils.sheet_to_json(ws, { header: 1 });
      const appCodeSet = new Set(S.appList.map(a => a.app_code));
      // leadEmailSet: S.leadsAll ('pqa_lead') carries `email` already (loadMasterData()) — wired
      // in during Fix round 1 of §5.63 Task 3 review (2026-09-10)
      const leadEmailSet = new Set((S.leadsAll || []).map(l => String(l.email || '').trim().toLowerCase()).filter(Boolean));
      const parsed = parseActualFile(aoa, appCodeSet, leadEmailSet);
      await openActualImportModal(parsed);
    } catch (err) {
      console.error(err);
      toast('อ่านไฟล์ไม่สำเร็จ: ' + (err.message || String(err)), true);
    }
  });
  // req (2026-08-25 ตามคำขอพี่กิ๊บ): ปุ่ม "ล้าง" — เคลียร์ตัวกรองทั้งหมด (Project/UAT
  // Lead/App/Type/Domain/เดือน) กลับเป็นค่า default เดียวกับตอนเพิ่งล็อกอิน ไม่ auto-collapse
  // panel เพราะมักเลือกตัวกรองใหม่ต่อทันทีหลังกดล้าง
  // 2026-09-01 (§5.50): ปุ่ม "ค้นหา" (#ovApplyBtn) ถูกลบทิ้งไปพร้อม Start/End — เปลี่ยนเดือนใน
  // month picker แล้ว apply ทันทีผ่าน applyMonths() (ดู wireMonthPicker()) ไม่มีอะไรให้กดรออีก
  $('clearFilterBtn').addEventListener('click', () => {
    S.filter.projects.clear();
    S.filter.leads.clear();
    S.filter.apps.clear();
    buildFilterMultiSelects();
    saveFilterPrefs();

    S.leadRoleFilter = 'main';
    S.leadDomainFilter = 'all';
    $('leadRoleSelect').value = S.leadRoleFilter;
    $('leadDomainSelect').value = S.leadDomainFilter;
    savePrefs(PAGE, { leadRoleFilter: S.leadRoleFilter, leadDomainFilter: S.leadDomainFilter });

    S.projectViewMode = 'all'; // 2026-09-02
    $('projectViewSelect').value = S.projectViewMode;
    savePrefs(PAGE, { projectViewMode: S.projectViewMode });

    // เดือนกลับเป็นเดือนปัจจุบัน — applyMonths() ครอบทั้ง state/label/prefs/recompute+render ให้
    // (force=false ภายใน ให้ loadPeriod แค่ recompute+render จาก cache เหมือนเดิม)
    const now = new Date();
    applyMonths([`${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`]);
  });
}

function switchDashView(view){
  if (S.dashView === view) return;
  S.dashView = view;
  savePrefs(PAGE, { dashView: S.dashView });
  document.querySelectorAll('#viewTabs .view-tab').forEach(b => b.classList.toggle('active', b.dataset.view===view));
  $('leadRoleFld').classList.toggle('hidden', view !== 'lead');   // By Lead tab เท่านั้น (round 4)
  $('leadDomainFld').classList.toggle('hidden', view !== 'lead');
  $('projectViewFld').classList.toggle('hidden', view !== 'project'); // 2026-09-02, By Project tab เท่านั้น
  $('cmpActualFld').classList.toggle('hidden', view !== 'app');   // 2026-09-09, By App tab เท่านั้น (§5.60)
  updateAppAdminToolsVisibility();
  updateOsModeVisibility(); // §5.63 Task 5 — ปุ่มโหมด Booked/Actual/Compare, By OS tab เท่านั้น
  // Download Excel — ทุกแท็บแล้ว (2026-08-25 ตามคำขอพี่กิ๊บ, เดิม By Lead tab เท่านั้น) ไม่ต้อง
  // toggle hidden อีกต่อไป — ปุ่มโชว์ตลอด downloadDashboardExcel() เลือก export ที่ถูกต้องเองจาก
  // S.dashView ตอนกดคลิก
  // switching tabs re-renders synchronously from already-cached S.periodAgg — the overlay
  // toggle here is defensive (keeps the same "hidden while (re)building, revealed only
  // after" contract as loadPeriod).
  showDashLoading();
  renderAll();
  hideDashLoading();
}
</script>
