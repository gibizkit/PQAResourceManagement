/* ---- By OS (pivot: OS x App) ---- */
function renderOsView(container){
  // §6: By OS counts MD only on bookings whose project is_active = true.
  const agg = S.periodAggActiveOnly || { byOsApp:{}, byOsTotal:{} };
  const appSet = new Set();
  Object.values(agg.byOsApp).forEach(m => Object.keys(m).forEach(a => appSet.add(a)));
  const apps = sortedApps([...appSet]);

  const osRows = Object.values(S.resourceMap)
    .filter(r => r.resource_type === 'outsource')
    .map(r => ({ ...r, total: agg.byOsTotal[r.resource_id] || 0 }))
    .sort((a,b) => (roleRank(a.role_code)-roleRank(b.role_code)) || String(a.nickname||a.full_name_en||'').localeCompare(String(b.nickname||b.full_name_en||'')));

  if (!apps.length) {
    container.innerHTML = '<div class="empty-state">ไม่มีข้อมูล Booking ในช่วงที่เลือก</div>';
    return;
  }

  const headApps = apps.map(a => `<th>${esc(a)}</th>`).join('');
  const colTotals = {}; apps.forEach(a => colTotals[a] = 0);
  let grandTotal = 0;

  const bodyRows = osRows.map(r => {
    const cells = apps.map(a => {
      const v = (agg.byOsApp[r.resource_id] || {})[a] || 0;
      colTotals[a] += v;
      return `<td class="td-md-cell">${v ? fmtMD(v) : '<span class="muted">—</span>'}</td>`;
    }).join('');
    grandTotal += r.total;
    return `<tr>
      <td class="td-os-name">${esc(resName(r.nickname, r.full_name_en))}</td>
      <td class="td-os-role">${esc(roleLabelFor(r.role_code))}</td>
      <td class="td-os-total">${fmtMD(r.total)}</td>
      ${cells}
    </tr>`;
  }).join('');

  const totalRow = `<tr class="dash-total-row">
    <td class="td-os-name">รวมทั้งหมด</td>
    <td class="td-os-role"></td>
    <td class="td-os-total">${fmtMD(grandTotal)}</td>
    ${apps.map(a => `<td class="td-md-cell">${fmtMD(colTotals[a])}</td>`).join('')}
  </tr>`;

  container.innerHTML = `
    <div class="dash-os-scroll">
      <table class="dash-os-table">
        <thead><tr>
          <th class="th-os-name">OS</th><th class="th-os-role">Role</th><th class="th-os-total">Total</th>
          ${headApps}
        </tr></thead>
        <tbody>${bodyRows || `<tr><td colspan="${3+apps.length}" class="empty-state">ไม่มีข้อมูล</td></tr>`}</tbody>
        <tfoot>${totalRow}</tfoot>
      </table>
    </div>`;
}
function roleLabelFor(code){
  return code==='SENIOR' ? '1.Senior Tester' : code==='TESTER' ? '2.Tester' : code==='JUNIOR' ? '3.Junior Tester' : (code||'');
}

/* ---- By Lead (matrix: Lead x App) ----
   Source of truth: project_lead + pqa_lead (both main & additional leads), scoped to
   projects that match the current "ค้นหา Project" search window (projectMatchesRange(),
   §5.37) — same matched-project set the By Project tab uses. (Before §5.37 this matrix
   was described as "NOT time/day-bound"; now it's filtered by the same search the other
   tabs use, for consistency — a Lead with zero matched projects simply gets no row.)
   2026-08-13: `projByKey` now comes from currentProjMap() = S.activeProjMap (active-only,
   §5.43) instead of S.allProjMap — an inactive project's leads/coverage no longer show up
   here, same as they already didn't on By Project.
   Each cell = COUNT of distinct matched projects that Lead owns under that App (not just
   a 0/1 coverage flag) — a Lead with 2 matched projects under the same App shows "2".

   Total MD column (task 3): sum of MD for every MATCHED project where this lead is the
   MAIN lead (project_lead.is_main = true). Reuses S.periodAgg.byProject — the same
   full-span Effective "Booked MD" aggregate (§5.37) that the By Project tab's "Total MD"
   column already uses, computed only over projects that matched the search — so the
   number is consistent with the rest of the page. Projects with no main lead simply
   never get added to any lead's total (no double counting, no orphan bucket). */
/* By Lead tab — one matrix table (Lead × App) at a time, for whichever role is picked
 * in #leadRoleSelect (S.leadRoleFilter). First shipped as 3 tables stacked vertically
 * (2026-08-13), then Gibb asked for a dropdown instead so only one table shows at a
 * time — the role-classification/coverage-building logic below is unchanged from that
 * version, only the rendering step (build 1 section instead of 3) changed.
 * Only the Main Lead table carries a Total MD column — MD is only ever summed from
 * projects where the lead is_main (see §5.18/§5.20), and Gibb confirmed Sub Lead /
 * Executor should show project counts only, no MD column, to avoid implying a
 * per-role MD split that doesn't exist. The App column set is still computed as the
 * union across all 3 roles (not just the selected one) so switching the dropdown
 * doesn't shuffle the columns around. */
const LEAD_ROLE_META = {
  main: { title: 'Main Lead', withMD: true },
  sub:  { title: 'Sub Lead', withMD: false },
  exec: { title: 'Executor', withMD: false },   // 2026-08-14: renamed from "Internal Executor" (ตามคำขอพี่กิ๊บ)
};
/** Classify a pqa_lead's email into the By Lead "Filter:" domain bucket (2026-08-13, Gibb).
 *  'infinitas' = @infinitaskt.com, 'arise' = @arise.tech, everything else (outsource
 *  vendors like @doppiotech.com, missing email, etc.) falls into 'other' — the dropdown
 *  stays exhaustive without needing to enumerate every vendor domain by name. */
function leadDomainBucket(email){
  const e = String(email || '').trim().toLowerCase();
  if (e.endsWith('@infinitaskt.com')) return 'infinitas';
  if (e.endsWith('@arise.tech')) return 'arise';
  return 'other';
}
/** Lead × App coverage for the currently matched project set (Project/UAT Lead/App +
 *  Start/End search, §5.37) — same logic as the inline block at the top of renderLeadView()
 *  (kept inline there on purpose, NOT refactored to call this: tests/run_tests.mjs vm-evals
 *  renderLeadView() as an isolated, self-contained function in several places, and a shared
 *  helper would break that). Added 2026-08-14 for downloadLeadExcel() so the "Download
 *  Excel" button computes from the same rules the on-screen matrix uses — if the coverage
 *  rules in renderLeadView() change, mirror the change here too. Returns
 *  { coverage: {main|sub|exec -> emp_id -> {app -> Set(project_key)}},
 *    mainProjectsByLead: emp_id -> Set(project_key) where is_main=true,
 *    apps: sorted app list (union across all 3 roles), agg: S.periodAgg }. */
function computeLeadCoverage(){
  const projByKey = currentProjMap();
  const agg = S.periodAgg || { byProject:{} };
  const rangeS = S.overallRange.s || '', rangeE = S.overallRange.e || '';

  const coverage = { main:{}, sub:{}, exec:{} }; // role -> emp_id -> { app -> Set(project_key) }
  const mainProjectsByLead = {};                 // emp_id -> Set(project_key) where is_main = true
  S.projectLeadRows.forEach(pl => {
    const proj = projByKey[pl.project_key];
    if (!proj) return;
    if (!matchProjectDiscovery(pl.project_key, rangeS, rangeE)) return;   // §5.37 + 2026-08-14 Project/UAT Lead/App
    const app = proj.app || proj.other_app || '— ไม่มี App —';
    const role = pl.is_main ? 'main' : (pl.is_executor ? 'exec' : 'sub');
    const byApp = (coverage[role][pl.pqa_emp_id] = coverage[role][pl.pqa_emp_id] || {});
    (byApp[app] = byApp[app] || new Set()).add(pl.project_key);
    if (pl.is_main) {
      (mainProjectsByLead[pl.pqa_emp_id] = mainProjectsByLead[pl.pqa_emp_id] || new Set()).add(pl.project_key);
    }
  });

  const appSet = new Set();
  ['main','sub','exec'].forEach(role => {
    Object.values(coverage[role]).forEach(byApp => Object.keys(byApp).forEach(a => appSet.add(a)));
  });
  return { coverage, mainProjectsByLead, apps: sortedApps([...appSet]), agg };
}

/** Row DATA (no HTML) for one role's By Lead table — one row per lead who has ≥1 matched
 *  project in that role, after the Type/Domain dropdowns (S.leadDomainFilter). Mirrors
 *  buildSection()'s row-building block inside renderLeadView() (kept separate on purpose,
 *  see computeLeadCoverage() comment above re: the vm-eval test harness) — added 2026-08-14
 *  so downloadLeadExcel()'s Summary sheet uses the same row set/numbers as the screen. */
function buildLeadRoleRows(roleCoverage, mainProjectsByLead, apps, agg, withMD){
  // domainFilter defaults to 'all' when S.leadDomainFilter is unset (e.g. older cached
  // prefs from before this dropdown existed) — never silently drops every lead.
  const domainFilter = S.leadDomainFilter || 'all';
  return S.leadsAll
    .filter(l => domainFilter === 'all' || leadDomainBucket(l.email) === domainFilter)
    .map(l => {
      const byApp = roleCoverage[l.emp_id] || {};
      const allProjects = new Set();
      Object.values(byApp).forEach(set => set.forEach(k => allProjects.add(k)));
      if (!allProjects.size) return null; // lead with no project in this role/set — skip row
      let totalMD = 0;
      if (withMD) {
        const mainProjects = mainProjectsByLead[l.emp_id] || new Set();
        mainProjects.forEach(pk => { totalMD += agg.byProject[pk] || 0; });
      }
      const cellsByApp = {};
      apps.forEach(a => { cellsByApp[a] = byApp[a] ? byApp[a].size : 0; });
      return {
        emp_id: l.emp_id, name: l.short_name || l.nickname || l.emp_id, email: l.email || '',
        totalMD, totalProject: allProjects.size, projectKeys: allProjects, cellsByApp,
      };
    }).filter(Boolean);
}

function renderLeadView(container){
  const projByKey = currentProjMap();
  const agg = S.periodAgg || { byProject:{} };
  const rangeS = S.overallRange.s || '', rangeE = S.overallRange.e || '';

  const coverage = { main:{}, sub:{}, exec:{} }; // role -> emp_id -> { app -> Set(project_key) }
  const mainProjectsByLead = {};                 // emp_id -> Set(project_key) where is_main = true
  S.projectLeadRows.forEach(pl => {
    const proj = projByKey[pl.project_key];
    if (!proj) return;
    if (!matchProjectDiscovery(pl.project_key, rangeS, rangeE)) return;   // §5.37 + 2026-08-14 Project/UAT Lead/App
    const app = proj.app || proj.other_app || '— ไม่มี App —';
    const role = pl.is_main ? 'main' : (pl.is_executor ? 'exec' : 'sub');
    const byApp = (coverage[role][pl.pqa_emp_id] = coverage[role][pl.pqa_emp_id] || {});
    (byApp[app] = byApp[app] || new Set()).add(pl.project_key);
    if (pl.is_main) {
      (mainProjectsByLead[pl.pqa_emp_id] = mainProjectsByLead[pl.pqa_emp_id] || new Set()).add(pl.project_key);
    }
  });

  const appSet = new Set();
  ['main','sub','exec'].forEach(role => {
    Object.values(coverage[role]).forEach(byApp => Object.keys(byApp).forEach(a => appSet.add(a)));
  });
  const apps = sortedApps([...appSet]);

  if (!apps.length) {
    container.innerHTML = '<div class="empty-state">ไม่พบข้อมูล Lead / App สำหรับ Project ชุดที่เลือก</div>';
    return;
  }

  function buildSection(title, roleCoverage, withMD){
    const colCount = {}; apps.forEach(a => colCount[a] = 0);
    let grandTotal = 0, grandTotalMD = 0;
    // domainFilter defaults to 'all' when S.leadDomainFilter is unset (e.g. older cached
    // prefs from before this dropdown existed) — never silently drops every lead.
    const domainFilter = S.leadDomainFilter || 'all';
    const bodyRows = S.leadsAll
      .filter(l => domainFilter === 'all' || leadDomainBucket(l.email) === domainFilter)
      .map(l => {
        const byApp = roleCoverage[l.emp_id] || {};
        const allProjects = new Set();
        Object.values(byApp).forEach(set => set.forEach(k => allProjects.add(k)));
        if (!allProjects.size) return ''; // lead with no project in this role/set — skip row
        let totalMD = 0;
        if (withMD) {
          const mainProjects = mainProjectsByLead[l.emp_id] || new Set();
          mainProjects.forEach(pk => { totalMD += agg.byProject[pk] || 0; });
        }
        const cells = apps.map(a => {
          const n = byApp[a] ? byApp[a].size : 0;
          if (n) colCount[a] += n;
          return `<td class="center">${n || '<span class="muted">—</span>'}</td>`;
        }).join('');
        grandTotal += allProjects.size;
        grandTotalMD += totalMD;
        const mdCell = withMD ? `<td class="right">${fmtMD(totalMD)}</td>` : '';
        return `<tr><td>${esc(l.short_name)}</td>${mdCell}<td class="right">${allProjects.size}</td>${cells}</tr>`;
      }).filter(Boolean);

    const mdTotalCell = withMD ? `<td class="right">${fmtMD(grandTotalMD)}</td>` : '';
    const totalRow = `<tr class="dash-total-row">
      <td>รวม (${bodyRows.length} Lead)</td>${mdTotalCell}<td class="right">${grandTotal}</td>
      ${apps.map(a => `<td class="center">${colCount[a]}</td>`).join('')}
    </tr>`;

    const mdHeader = withMD ? '<th class="right">Total MD</th>' : '';
    const colspan = (withMD ? 3 : 2) + apps.length;

    return `
      <div class="section-title">${esc(title)}</div>
      <div class="dash-table-wrap">
        <table class="dash-table" id="leadTable">
          <thead><tr><th>UAT Lead</th>${mdHeader}<th class="right">Total Project</th>${apps.map(a=>`<th class="center">${esc(a)}</th>`).join('')}</tr></thead>
          <tbody>${bodyRows.join('') || `<tr><td colspan="${colspan}" class="empty-state">ไม่พบข้อมูล</td></tr>`}</tbody>
          <tfoot>${totalRow}</tfoot>
        </table>
      </div>`;
  }

  // 2026-08-14 (ตามคำขอพี่กิ๊บ): เพิ่ม Type = "All" — สร้างทั้ง 3 section (Main Lead/Sub Lead/
  // Executor) ต่อกันแบบเดียวกับ layout เดิมก่อน 2026-08-13 (ตอนนั้นโชว์ตลอดแบบ stack 3 ตาราง,
  // ดูคอมเมนต์เหนือ LEAD_ROLE_META) — เลือก role เดียว (main/sub/exec) ยังโชว์แค่ 1 ตารางเหมือนเดิม.
  if (S.leadRoleFilter === 'all') {
    container.innerHTML = ['main', 'sub', 'exec']
      .map(k => buildSection(LEAD_ROLE_META[k].title, coverage[k], LEAD_ROLE_META[k].withMD))
      .join('');
    return;
  }
  const roleKey = Object.prototype.hasOwnProperty.call(LEAD_ROLE_META, S.leadRoleFilter) ? S.leadRoleFilter : 'main';
  const meta = LEAD_ROLE_META[roleKey];
  container.innerHTML = buildSection(meta.title, coverage[roleKey], meta.withMD);
}

/* =====================================================================
   DOWNLOAD EXCEL ("📥 Download Excel" button — เดิม 2026-08-14 By Lead tab เท่านั้น, 2026-08-25
   ตามคำขอพี่กิ๊บ ขยายให้มีปุ่มเดียวกันทุกแท็บของ Dashboard) แต่ละแท็บ export "สิ่งที่กำลังแสดงอยู่
   จริง" บนแท็บนั้น (ตัวกรอง Project/UAT Lead/App/Start-End เสมอ ทุกแท็บ, บวก Type/Domain เฉพาะ By
   Lead) — downloadDashboardExcel() (ผูกกับปุ่มใน wireToolbar()) เลือกฟังก์ชัน export ตาม
   S.dashView: downloadProjectExcel() / downloadOsExcel() / downloadLeadExcel() /
   downloadSignoffExcel(). ทุกฟังก์ชันแชร์ helper 4 ตัวด้านล่าง (buildDownloadFilterAoa/
   downloadFilename/writeWorkbookAndDownload/logExcelDownload) ให้ Filter sheet/ชื่อไฟล์/การสั่ง
   ดาวน์โหลด/การ log หน้าตาเหมือนกันทุกแท็บ — logExcelDownload() บันทึกลง pqa.download_log
   (sql/patch_2026-08-14_download_log.sql — ต้องรันบน Supabase ก่อน) เหมือนเดิม
   computeLeadCoverage()/buildLeadRoleRows() (By Lead) mirror the same matching rules
   renderLeadView() uses (§5.37); downloadOsExcel()/downloadSignoffExcel() mirror the inline
   row-building in renderOsView()/renderSignoffView() the same way — kept as separate
   functions rather than refactoring the render functions themselves, so tests/run_tests.mjs's
   isolated vm-eval of renderLeadView()/renderSignoffView()/buildProjectRows() keeps working
   unmodified (see the doc comments on computeLeadCoverage()/projectPeriodDisp() above).
   By Lead's export stays 3 sheets: Filter / Summary (เหมือน By Lead matrix แต่รวมทุก role ที่
   เลือกเป็นตารางเดียว) / Project (1 แถวต่อ Lead×Project×Phase, MD จาก S.periodAgg.byProjectPhase
   เหมือน By Project tab). By Project/By OS/Signoff are 2 sheets: Filter + 1 data sheet mirroring
   that tab's on-screen table (+ totals row where the table has one). ===== */
/** Human-readable label for a multiselect's current selection — used in the exported
 *  "Filter" sheet. Empty Set = "All" (same convention as makeMultiSelect() itself). */
function selectedLabelsText(selectedSet, items, valueKey, labelKey){
  if (!selectedSet.size) return 'All';
  const byValue = {};
  items.forEach(it => { byValue[it[valueKey]] = it[labelKey]; });
  return [...selectedSet].map(v => byValue[v] || v).join(', ');
}

const LEAD_DOMAIN_LABELS = { all:'All', infinitas:'Infinitas', arise:'Arise', other:'Other' };

/** yyyyMMddHHmmss ตามเวลาเครื่องผู้ใช้ (ทีมอยู่โซนไทยอยู่แล้ว) — ใช้ตั้งชื่อไฟล์ export ตาม
 *  pattern pqaResourceManagement_<pqa_emp_id>_<YYYYMMDDHHMMSS>.xlsx ที่ขอ */
function fileTimeStamp(d){
  const p2 = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}`;
}

/** Sheet1 "Filter" rows ที่เลือกอยู่ตอนนี้ — ใช้ร่วมกันทุก tab (2026-08-25). `includeLeadFields`
 *  = true เติม Type/Domain ต่อท้าย Project/UAT Lead/App (By Lead tab เท่านั้น — ตัวกรอง 2 อันนี้
 *  มีผลแค่แท็บนั้น เหมือนที่ #leadRoleFld/#leadDomainFld ซ่อน/โชว์ตามแท็บ). */
function buildDownloadFilterAoa(includeLeadFields){
  const projectLabel = selectedLabelsText(S.filter.projects, S.activeProjects, 'project_key', 'project_name');
  const leadItems = S.leadsAll.map(l => ({ emp_id: l.emp_id, label: l.short_name || l.nickname || l.emp_id }));
  const leadLabel = selectedLabelsText(S.filter.leads, leadItems, 'emp_id', 'label');
  const appLabel = S.filter.apps.size ? [...S.filter.apps].sort().join(', ') : 'All';
  const rows = [
    ['Project', projectLabel],
    ['UAT Lead', leadLabel],
    ['App', appLabel],
  ];
  if (includeLeadFields) {
    const roleKey = Object.prototype.hasOwnProperty.call(LEAD_ROLE_META, S.leadRoleFilter) ? S.leadRoleFilter : 'main';
    rows.push(['Type', S.leadRoleFilter === 'all' ? 'All' : LEAD_ROLE_META[roleKey].title]);
    rows.push(['Domain', LEAD_DOMAIN_LABELS[S.leadDomainFilter || 'all'] || 'All']);
  }
  // 2026-09-01 (§5.50): Start Date/End Date (2 แถว) → เดือน (1 แถว) ให้ตรงกับตัวกรอง month
  // picker บนจอ — ค่าเป็น monthLabel() (Mmm-yyyy, §4.5) ไม่ใช่ dDisp() ของวันแรก/วันสุดท้ายอีก
  // ต่อไป (S.overallRange.s ยังมีอยู่ใช้แปลงกลับเป็น 'yyyy-MM' ให้ monthLabel() พอ)
  rows.push(['เดือน', S.overallRange.s ? monthLabel(S.overallRange.s) : '']);
  return rows;
}

/** ชื่อไฟล์ export — เหมือนเดิมทุกประการ (pqaResourceManagement_<emp_id>_<timestamp>.xlsx) บวก
 *  ชื่อแท็บ (`viewTag`) คั่นกลาง เพื่อแยกไฟล์จากคนละแท็บออกจากกันได้เวลาดาวน์โหลดหลายรอบ
 *  (2026-08-25 ตามคำขอพี่กิ๊บ — เดิมมีแค่ By Lead แท็บเดียวเลยไม่ต้องแยก). */
function downloadFilename(viewTag){
  const empId = (S.user && S.user.pqaEmpId) || 'NA';
  return `pqaResourceManagement_${viewTag}_${empId}_${fileTimeStamp(new Date())}.xlsx`;
}

/** ประกอบ workbook → .xlsx ไฟล์ → สั่งดาวน์โหลดผ่าน temp <a download> — เหมือนเดิมทุกประการ
 *  (ย้ายมาเป็น helper เดียวใช้ร่วมกันทุก export function, 2026-08-25). */
function writeWorkbookAndDownload(wb, filename){
  const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([wbout], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);

/** 'yyyy-MM-dd' -> 'YYYYMM' text (Excel export: Start_YYYYMM/End_YYYYMM, 2026-08-25 ตามคำขอพี่กิ๊บ).
 *  ใช้ substring ตรงๆ (ไม่ผ่าน Date) เพื่อเลี่ยงปัญหา timezone shift เหมือน dDisp() ด้านบน */
function yyyymm(s){
  if (!s) return '';
  return s.slice(0, 4) + s.slice(5, 7);
}

/** Sheet3 "Project" rows for one role — 1 แถวต่อ (lead × matched project ที่ lead คนนั้นดูแล
 *  ในบทบาทนี้ × phase ของ project นั้น) — project set มาจาก roleRows (ผลลัพธ์
 *  buildLeadRoleRows() ตัวเดียวกับที่ตาราง/Summary sheet ใช้ ไม่มีชุดข้อมูลที่สอง) MD ต่อ phase
 *  มาจาก S.periodAgg.byProjectPhase เหมือน By Project tab (buildProjectRows()) ทุกประการ */
function buildLeadProjectPhaseRows(roleTitle, roleRows, agg){
  const projByKey = currentProjMap();
  const byProjectPhase = agg.byProjectPhase || {};
  const out = [];
  roleRows.forEach(r => {
    const domainLabel = LEAD_DOMAIN_LABELS[leadDomainBucket(r.email)] || 'Other';
    [...r.projectKeys].sort().forEach(pk => {
      const proj = projByKey[pk];
      if (!proj) return;
      const app = proj.app || proj.other_app || '— ไม่มี App —';
      const { disp: periodDisp } = projectPeriodDisp(pk);
      const phases = S.phasesByProject[pk] || [];
      const pAgg = byProjectPhase[pk] || {};
      if (!phases.length) {
        // edge case: project ไม่มี project_phase เลย — ยังคง 1 แถวไว้ไม่ให้ project นี้หายไปเงียบๆ
        out.push([r.name, r.email, roleTitle, domainLabel, app, pk, proj.project_name || '', periodDisp, '—', '', '', '', '', '', proj.project_note || '']);
        return;
      }
      phases.forEach(ph => {
        const md = pAgg[ph.phase_code];
        out.push([
          r.name, r.email, roleTitle, domainLabel, app, pk, proj.project_name || '', periodDisp,
          ph.phase_label || phaseName(ph.phase_code),
          ph.start_date ? dDisp(ph.start_date) : '',
          yyyymm(ph.start_date),
          ph.end_date ? dDisp(ph.end_date) : '',
          yyyymm(ph.end_date),
          md ? Number(fmtMD(md)) : 0,
          proj.project_note || '',
        ]);
      });
    });
  });
  return out;
}

    const roleKeys = S.leadRoleFilter === 'all' ? ['main', 'sub', 'exec']

/* =====================================================================
   PERIOD DEFAULTS + MONTH PICKER (§5.50, 2026-09-01)
   "ค้นหา Project" เดิมเป็น Start/End (2 input[type=date]) — เปลี่ยนเป็น month picker ช่องเดียว
   (mirrors calendar.html's ‹/เดือน/› + picker panel ปี+เดือน) ตัวเลือกเดือนเก็บเป็น S.y/S.m
   (เหมือน calendar.html) แล้ว derive S.overallRange = {s,e} จากเดือนนั้นเสมอผ่าน
   overallRangeFromYM() — ทุกอย่างใต้ S.overallRange (projectMatchesRange()/
   recomputeAggregates()/matchProjectDiscovery(), §5.37/§5.39) อ่าน .s/.e เหมือนเดิมทุกประการ
   ไม่ถูกแตะเลยในงานนี้ ===================================================================== */
/** yyyy-mm-dd first/last day of the given (y, 1-based m) month — the ONLY place S.overallRange
 *  is derived from S.y/S.m. Kept as a pure helper (no S.* reads) so it's easy to unit-test. */
function overallRangeFromYM(y, m){
  return { s: d2s(new Date(y, m - 1, 1)), e: d2s(new Date(y, m, 0)) };
}
/** Refresh the month-picker button label to "Mmm-yyyy" (§4.5) via common.js's monthLabel(). */
function updateMonthBtnLabel(){
  $('dashMonthBtn').textContent = monthLabel(`${S.y}-${String(S.m).padStart(2, '0')}`);
}
/** Populate S.y/S.m (and the derived S.overallRange) with sane defaults on first load —
 *  Dashboard-specific default (unchanged from before §5.50, differs from the §4.2
 *  gantt/outsource standard): current month. Only fills in S.y/S.m when showApp()'s own
 *  "today" default + restoreDashPrefs() didn't already leave a valid month set. */
function ensureOverallRangeDefaults(){
  if (!S.y || !S.m) {
    const now = new Date();
    S.y = now.getFullYear();
    S.m = now.getMonth() + 1;
  }
  S.overallRange = overallRangeFromYM(S.y, S.m);
  updateMonthBtnLabel();
}
/** Change the selected month by `delta` (±1) and apply it immediately (no "ค้นหา" button
 *  anymore, §5.50) — mirrors calendar.html's changeMonth(), including year rollover at the
 *  Jan/Dec boundary. */
function changeMonth(delta){
  let m = S.m + delta, y = S.y;
  if (m < 1) { m = 12; y -= 1; }
  else if (m > 12) { m = 1; y += 1; }
  applyMonth(y, m);
}
/** Commit a new (y, m) selection: update state + button label + prefs, then recompute/render
 *  from already-cached booking/leave data (loadPeriod(false) — no network round-trip, same
 *  as the old ovApplyBtn handler, §5.37). */
function applyMonth(y, m){
  S.y = y; S.m = m;
  S.overallRange = overallRangeFromYM(y, m);
  updateMonthBtnLabel();
  savePrefs(PAGE, { y: S.y, m: S.m });
  loadPeriod(false);
}
/** Year+month picker panel (#dashMonthPanel) — mirrors calendar.html's renderMonthPanel()/
 *  calPickerYear()/calPickMonth() exactly, using MONTH_ABBR from common.js for the grid. */
function renderDashMonthPanel(){
  $('dashMonthPanel').innerHTML = `
    <div class="dash-picker-year">
      <button type="button" class="btn sm" onclick="dashPickerYearNav(-1)">‹</button>
      <span>${dashPickerYear}</span>
      <button type="button" class="btn sm" onclick="dashPickerYearNav(1)">›</button>
    </div>
    <div class="dash-picker-grid">
      ${MONTH_ABBR.map((nm, i) => {
        const mm = i + 1;
        const active = dashPickerYear === S.y && mm === S.m;
        return `<button type="button" class="dash-picker-month${active ? ' active' : ''}" onclick="dashPickMonth(${dashPickerYear},${mm})">${nm}</button>`;
      }).join('')}
    </div>`;
}
window.dashPickerYearNav = function(delta){
  dashPickerYear += delta;
  renderDashMonthPanel();
};
window.dashPickMonth = function(y, m){
  $('dashMonthPanel').classList.add('hidden');
  applyMonth(y, m);
};
/** Wire the ‹ / เดือน / › controls + the year/month picker panel — called once from showApp()
 *  (mirrors wireToolbar()'s one-time-wiring pattern; DOM elements are static markup, not
 *  dynamically (re)created, so no need to re-wire on every render). */
function wireMonthPicker(){
  $('dashPrevBtn').addEventListener('click', () => changeMonth(-1));
  $('dashNextBtn').addEventListener('click', () => changeMonth(1));
  $('dashMonthBtn').addEventListener('click', e => {
    e.stopPropagation();
    const panel = $('dashMonthPanel');
    if (panel.classList.contains('hidden')) {
      dashPickerYear = S.y;
      renderDashMonthPanel();
      panel.classList.remove('hidden');
    } else {
      panel.classList.add('hidden');
    }
  });
  $('dashMonthPanel').addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', e => {
    const wrap = $('dashMonthPicker');
    if (wrap && !wrap.contains(e.target)) $('dashMonthPanel').classList.add('hidden');
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') $('dashMonthPanel').classList.add('hidden');
  });
}

/* =====================================================================
   MULTISELECT (Project/UAT Lead/App ตัวกรอง — เอา pattern เดียวกับ gantt.html/outsource.html
   มาใช้ทั้งดุ้น, 2026-08-14 ตามคำขอพี่กิ๊บ)
   ===================================================================== */
function makeMultiSelect(hostId, items, selectedSet, labelAll){
  const host = $(hostId);
  host.innerHTML = `
    <button class="ms-btn" type="button">${labelAll} <span class="ms-count">▾</span></button>
    <div class="ms-panel hidden">
      <div class="ms-search-wrap">
        <input type="text" class="ms-search" placeholder="พิมพ์เพื่อค้นหา...">
        <button type="button" class="ms-search-x" title="ล้างคำค้นหา">×</button>
      </div>
      <div class="ms-tools">
        <button type="button" data-act="none">ล้าง</button>
      </div>
      <div class="ms-list"></div>
    </div>`;
  const btn = host.querySelector('.ms-btn');
  const panel = host.querySelector('.ms-panel');
  const list = host.querySelector('.ms-list');
  const search = host.querySelector('.ms-search');
  const searchX = host.querySelector('.ms-search-x');
  list.innerHTML = items.map(it =>
    `<label class="ms-item" data-label="${esc(String(it.label).toLowerCase())}"><input type="checkbox" value="${esc(it.value)}"${selectedSet.has(it.value)?' checked':''}><span>${esc(it.label)}</span></label>`).join('');

  const applySearch = () => {
    const q = search.value.trim().toLowerCase();
    list.querySelectorAll('.ms-item').forEach(el => {
      el.style.display = (!q || (el.dataset.label||'').includes(q)) ? '' : 'none';
    });
  };
  search.oninput = applySearch;
  search.onclick = (e) => e.stopPropagation();
  searchX.onclick = (e) => { e.stopPropagation(); search.value=''; applySearch(); search.focus(); };

  // เปิด dropdown ตัวไหน → หุบตัวอื่นทั้งหมดก่อน (เปิดได้ทีละอันเท่านั้น)
  btn.onclick = (e) => {
    e.stopPropagation();
    const willOpen = panel.classList.contains('hidden');
    closeAllMsPanels();
    if (willOpen) { panel.classList.remove('hidden'); search.focus(); }
  };
  panel.onclick = (e) => { e.stopPropagation(); };
  list.onchange = () => {
    selectedSet.clear();
    list.querySelectorAll('input:checked').forEach(cb => selectedSet.add(cb.value));
    updateMsLabel(host, items, selectedSet, labelAll);
    onExtraFilterChange();
  };
  host.querySelector('[data-act=none]').onclick = () => {
    selectedSet.clear();
    list.querySelectorAll('input').forEach(cb => cb.checked=false);
    updateMsLabel(host, items, selectedSet, labelAll);
    onExtraFilterChange();
  };
  updateMsLabel(host, items, selectedSet, labelAll);
}
function updateMsLabel(host, items, selectedSet, labelAll){
  const btn = host.querySelector('.ms-btn');
  const n = selectedSet.size;
  let label;
  if (n === 0) {
    label = labelAll;
  } else if (n === 1) {
    const only = [...selectedSet][0];
    const it = items.find(x => x.value === only);
    label = it ? it.label : labelAll;
  } else {
    label = `${n} รายการ`;
  }
  btn.innerHTML = `${esc(String(label))} <span class="ms-count">▾</span>`;
}
function closeAllMsPanels(){
  document.querySelectorAll('.ms-panel').forEach(p => p.classList.add('hidden'));
}
document.addEventListener('click', closeAllMsPanels);
// ESC ก็หุบ dropdown ที่เปิดอยู่
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.querySelector('.ms-panel:not(.hidden)')) {
    closeAllMsPanels();
    e.stopPropagation();
  }
}, true);

/** Build the 3 multiselect widgets from master data — call once after loadMasterData()
 *  (needs S.activeProjects/S.leadsAll/S.appList populated) + restoreDashPrefs() (needs
 *  S.filter.* already restored so the widgets open with the right checkboxes pre-checked). */
function buildFilterMultiSelects(){
  makeMultiSelect('msProject',
    S.activeProjects.slice().sort((a,b)=>String(a.project_name).localeCompare(String(b.project_name)))
      .map(p => ({ value:p.project_key, label:p.project_name })),
    S.filter.projects, 'ทุก Project');
  makeMultiSelect('msLead',
    S.leadsAll.map(l => ({ value:l.emp_id, label:l.short_name || l.nickname || l.emp_id })),
    S.filter.leads, 'ทุก Lead');
  makeMultiSelect('msApp',
    S.appList.map(a => ({ value:a.app_code, label:a.app_code })),
    S.filter.apps, 'ทุก App');
}

// dump S.filter (Project/UAT Lead/App multiselect) ลง sessionStorage — เรียกทุกครั้งที่ตัวเลือก
// ใน multiselect เปลี่ยน (แยก key จาก rangeS/rangeE/panelOpen ที่มี savePrefs ของตัวเองอยู่แล้ว)
function saveFilterPrefs(){
  savePrefs(PAGE, {
    projects: [...S.filter.projects],
    leads: [...S.filter.leads],
    apps: [...S.filter.apps],
  });
}

/** Project/UAT Lead/App multiselect เปลี่ยน → มีผลทันที (ไม่ต้องกด "ค้นหา" เหมือน Start/End) —
 *  ต้อง recomputeAggregates() ใหม่ด้วย เพราะ matchProjectDiscovery() (ซึ่งเช็ค S.filter ด้วย
 *  ตั้งแต่ 2026-08-14) เป็นตัวตัดสิน projMap ที่ป้อนเข้า computeAgg(). */
function onExtraFilterChange(){
  saveFilterPrefs();
  showDashLoading();
  recomputeAggregates();
  renderAll();
  hideDashLoading();
}

/* =====================================================================
   TOOLBAR WIRING
   ===================================================================== */
function wireToolbar(){
  $('viewTabs').addEventListener('click', e => {
    const btn = e.target.closest('.view-tab');
    if (!btn) return;
    switchDashView(btn.dataset.view);
  });
  // ปุ่มตัวกรอง (2026-08-14, ตามคำขอพี่กิ๊บ) — pattern เดียวกับ gantt.html/outsource.html
  $('toggleFilterBtn').addEventListener('click', () => {
    $('filterPanel').classList.toggle('hidden');
    savePrefs(PAGE, { panelOpen: !$('filterPanel').classList.contains('hidden') });
  });
  $('leadRoleSelect').addEventListener('change', () => {
    S.leadRoleFilter = $('leadRoleSelect').value;
    savePrefs(PAGE, { leadRoleFilter: S.leadRoleFilter });
    // 2026-08-14: Type/Domain โชว์ทุก tab แล้ว (ไม่ใช่แค่ By Lead) — re-render Lead matrix เฉพาะ
    // ตอนที่ By Lead tab กำลังแสดงอยู่จริงเท่านั้น ไม่งั้น renderLeadView() จะไปทับ viewContainer
    // ที่ตอนนั้นแสดง By Project/By OS/Signoff อยู่โดยไม่ตั้งใจ
    if (S.dashView === 'lead') renderLeadView($('viewContainer'));
  });
  $('leadDomainSelect').addEventListener('change', () => {
    S.leadDomainFilter = $('leadDomainSelect').value;
    savePrefs(PAGE, { leadDomainFilter: S.leadDomainFilter });
    if (S.dashView === 'lead') renderLeadView($('viewContainer')); // เหตุผลเดียวกับด้านบน
  });
  $('downloadExcelBtn').addEventListener('click', downloadDashboardExcel);
  // req (2026-08-25 ตามคำขอพี่กิ๊บ): ปุ่ม "ล้าง" — เคลียร์ตัวกรองทั้งหมด (Project/UAT
  // Lead/App/Type/Domain/เดือน) กลับเป็นค่า default เดียวกับตอนเพิ่งล็อกอิน ไม่ auto-collapse
  // panel เพราะมักเลือกตัวกรองใหม่ต่อทันทีหลังกดล้าง
  // 2026-09-01 (§5.50): ปุ่ม "ค้นหา" (#ovApplyBtn) ถูกลบทิ้งไปพร้อม Start/End — เปลี่ยนเดือนใน
  // month picker แล้ว apply ทันทีผ่าน applyMonth() (ดู wireMonthPicker()) ไม่มีอะไรให้กดรออีก
  $('clearFilterBtn').addEventListener('click', () => {
    S.filter.projects.clear();
    S.filter.leads.clear();
    S.filter.apps.clear();
    buildFilterMultiSelects();
    saveFilterPrefs();

    S.leadRoleFilter = 'main';
    S.leadDomainFilter = 'all';
    $('leadRoleSelect').value = S.leadRoleFilter;
    $('leadDomainSelect').value = S.leadDomainFilter;
    savePrefs(PAGE, { leadRoleFilter: S.leadRoleFilter, leadDomainFilter: S.leadDomainFilter });

    // เดือนกลับเป็นเดือนปัจจุบัน — applyMonth() ครอบทั้ง state/label/prefs/recompute+render ให้
    // (force=false ภายใน ให้ loadPeriod แค่ recompute+render จาก cache เหมือนเดิม)
    const now = new Date();
    applyMonth(now.getFullYear(), now.getMonth() + 1);
  });
}

function switchDashView(view){
  if (S.dashView === view) return;
  S.dashView = view;
  savePrefs(PAGE, { dashView: S.dashView });
  document.querySelectorAll('#viewTabs .view-tab').forEach(b => b.classList.toggle('active', b.dataset.view===view));
  $('leadRoleFld').classList.toggle('hidden', view !== 'lead');   // By Lead tab เท่านั้น (round 4)
  $('leadDomainFld').classList.toggle('hidden', view !== 'lead');
  // Download Excel — ทุกแท็บแล้ว (2026-08-25 ตามคำขอพี่กิ๊บ, เดิม By Lead tab เท่านั้น) ไม่ต้อง
  // toggle hidden อีกต่อไป — ปุ่มโชว์ตลอด downloadDashboardExcel() เลือก export ที่ถูกต้องเองจาก
  // S.dashView ตอนกดคลิก
  // switching tabs re-renders synchronously from already-cached S.periodAgg — the overlay
  // toggle here is defensive (keeps the same "hidden while (re)building, revealed only
  // after" contract as loadPeriod).
  showDashLoading();
  renderAll();
  hideDashLoading();
}
</script>
