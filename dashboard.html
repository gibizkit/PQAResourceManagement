/* ---- By App (task 4, §5.60): App × month pivot, Booked MD vs imported Actual MD ----
   Source of truth for "Booked":
     S.periodAggActiveOnly.byAppMonth — the SAME aggregate By OS already reads (active
     project + Project/UAT Lead/App ตัวกรอง + monthSet clip to the exact months selected,
     §5.48) so Booked MD here always agrees with By OS's Total column for the same App —
     both come out of one computeAgg() call. This intentionally does NOT reuse S.periodAgg
     (By Project/By Lead/Signoff's full-Phase-span aggregate, §5.37/§5.39) — By App's whole
     point is comparing against Actual MD, which is inherently month-bucketed data, so
     Booked here has to be month-bucketed too or the comparison wouldn't mean anything.
   Source of truth for "Actual": S.actualByAppMonth (loaded in loadPeriod(), §5.60 Task 4
   Step 3) — 'app_code' -> 'YYYY-MM' -> md, from pqa.v_actual_md_app_month via
   fn_import_actual_md()'s writes (Task 5). */
/** Pure-ish aggregation step for the By App tab — reads S.periodAggActiveOnly/
 *  S.actualByAppMonth/S.months exactly the way buildProjectRows()/computeLeadCoverage() read
 *  their own S.* inputs (no args), so it stays a plain function tests/run_tests.mjs's vm
 *  harness can extract and run in isolation like every other build*Rows() helper here.
 *  Rows are the UNION of every App that has a nonzero number on EITHER side (not the
 *  intersection) — an App with Actual MD but zero Booked (or vice versa) still needs a row,
 *  otherwise an import mismatch would silently disappear instead of showing up as a big
 *  Booked − Actual diff. */
function buildAppRows(){
  const booked = (S.periodAggActiveOnly || {}).byAppMonth || {};
  const actual = S.actualByAppMonth || {};
  const apps = sortedApps([...new Set([...Object.keys(booked), ...Object.keys(actual)])]);
  return apps.map(app => {
    const bookedByMonth = {}, actualByMonth = {};
    let bookedTotal = 0, actualTotal = 0;
    (S.months || []).forEach(mm => {
      const b = (booked[app] || {})[mm] || 0;
      const a = (actual[app] || {})[mm] || 0;
      bookedByMonth[mm] = b; actualByMonth[mm] = a;
      bookedTotal += b; actualTotal += a;
    });
    return { app, bookedTotal, actualTotal, diff: bookedTotal - actualTotal, bookedByMonth, actualByMonth };
  });
}
/** keyFns ของตาราง By App — คอลัมน์ต่อเดือนสร้างดังค์ตามชุดเดือนที่เลือกอยู่ตอนนี้ (คีย์
 *  'b:<YYYY-MM>' / 'a:<YYYY-MM>' = Booked/Actual ของเดือนนั้น, ชื่อเดือนตรงๆ เหมือน osKeyFns()
 *  ใช้ชื่อ App ตรงๆ — เพื่อให้ prefs ที่จำไว้ (S.appSort) ยังชี้ถูกคอลัมน์เดิมแม้ชุดเดือนที่เลือก
 *  จะเปลี่ยนไป) — ใช้ร่วมกันทั้ง renderAppView() และ downloadAppExcel() ให้ผลลัพธ์ที่ดาวน์โหลด
 *  เรียงตรงกับตารางบนจอเสมอ */
function appKeyFns(months){
  const kf = {
    app: r => r.app,
    bookedTotal: r => r.bookedTotal,
    actualTotal: r => r.actualTotal,
    diff: r => r.diff,
  };
  (months || []).forEach(mm => {
    kf['b:' + mm] = r => r.bookedByMonth[mm] || 0;
    kf['a:' + mm] = r => r.actualByMonth[mm] || 0;
  });
  return kf;
}
/** ตัวเลขในคอลัมน์ต่อเดือน (ไม่ใช่ Total/Diff) — 0 โชว์ "—" จางๆ แทนเลข 0 ตรงๆ (แพตเทิร์นเดียวกับ
 *  renderOsView()'s pivot cells) กัน 28 App × หลายเดือนเต็มไปด้วยเลข 0 อ่านยาก */
function appMonthCellHTML(v){
  return v ? fmtMD(v) : '<span class="muted">—</span>';
}
function renderAppView(container){
  const rows = buildAppRows();
  if (!rows.length) {
    container.innerHTML = '<div class="empty-state">ไม่มีข้อมูล Booked/Actual MD สำหรับตัวกรองชุดนี้</div>';
    return;
  }
  const months = S.months || [];
  const compareActual = S.compareActual;
  const sorted = genericSort(rows, S.appSort, appKeyFns(months));

  const appHeadActive = S.appSort.key === 'app' && !!S.appSort.dir;
  const appHeadCls = ['sortable', appHeadActive ? 'sort-active' : '', 'col-app-freeze'].join(' ').trim();
  const theadRow1 = `<tr>
    <th class="${appHeadCls}" rowspan="2" data-sort-key="app">App${sortIco(S.appSort,'app')}</th>
    <th colspan="${compareActual ? 3 : 1}">Total</th>
    <th colspan="${months.length}">Booked MD</th>
    ${compareActual ? `<th colspan="${months.length}">Actual MD</th>` : ''}
  </tr>`;
  const theadRow2 = `<tr>
    ${thSort('Booked','bookedTotal',S.appSort,'right')}
    ${compareActual ? thSort('Actual','actualTotal',S.appSort,'right') : ''}
    ${compareActual ? thSort('Booked − Actual','diff',S.appSort,'right') : ''}
    ${months.map(mm => thSort(monthLabel(mm), 'b:' + mm, S.appSort, 'right')).join('')}
    ${compareActual ? months.map(mm => thSort(monthLabel(mm), 'a:' + mm, S.appSort, 'right')).join('') : ''}
  </tr>`;

  let gBookedTotal = 0, gActualTotal = 0, gDiff = 0;
  const gBookedByMonth = {}, gActualByMonth = {};
  months.forEach(mm => { gBookedByMonth[mm] = 0; gActualByMonth[mm] = 0; });

  const bodyRows = sorted.map(r => {
    gBookedTotal += r.bookedTotal; gActualTotal += r.actualTotal; gDiff += r.diff;
    months.forEach(mm => { gBookedByMonth[mm] += r.bookedByMonth[mm]; gActualByMonth[mm] += r.actualByMonth[mm]; });
    const diffCls = r.diff > 0 ? 'md-over' : (r.diff < 0 ? 'md-under' : '');
    return `<tr>
      <td class="col-app-freeze" title="${esc(r.app)}">${esc(r.app)}</td>
      <td class="right">${fmtMD(r.bookedTotal)}</td>
      ${compareActual ? `<td class="right">${fmtMD(r.actualTotal)}</td>` : ''}
      ${compareActual ? `<td class="right ${diffCls}">${fmtMD(r.diff)}</td>` : ''}
      ${months.map(mm => `<td class="right">${appMonthCellHTML(r.bookedByMonth[mm])}</td>`).join('')}
      ${compareActual ? months.map(mm => `<td class="right">${appMonthCellHTML(r.actualByMonth[mm])}</td>`).join('') : ''}
    </tr>`;
  }).join('');

  const gDiffCls = gDiff > 0 ? 'md-over' : (gDiff < 0 ? 'md-under' : '');
  const totalRow = `<tr class="dash-total-row">
    <td class="col-app-freeze">รวมทั้งหมด (${rows.length} apps)</td>
    <td class="right">${fmtMD(gBookedTotal)}</td>
    ${compareActual ? `<td class="right">${fmtMD(gActualTotal)}</td>` : ''}
    ${compareActual ? `<td class="right ${gDiffCls}">${fmtMD(gDiff)}</td>` : ''}
    ${months.map(mm => `<td class="right">${fmtMD(gBookedByMonth[mm])}</td>`).join('')}
    ${compareActual ? months.map(mm => `<td class="right">${fmtMD(gActualByMonth[mm])}</td>`).join('') : ''}
  </tr>`;

  container.innerHTML = `
    <div class="dash-app-scroll">
      <table class="dash-app-table" id="appTable">
        <thead>${theadRow1}${theadRow2}</thead>
        <tbody>${bodyRows}</tbody>
        <tfoot>${totalRow}</tfoot>
      </table>
    </div>`;

  wireSortHeader(container.querySelector('#appTable thead'), S.appSort, () => {
    savePrefs(PAGE, { appSort: S.appSort });
    renderAppView(container);
  });
}

/* normalize ชื่อสำหรับจับคู่ Actual (ไฟล์ Excel) กับ v_resource — view ทำ lower(btrim())
   มาแล้ว ฝั่งนี้ยังต้องยุบช่องว่างซ้ำกลางชื่อเพิ่มอีกชั้น (2026-09-10, §5.63 Task 3) */
function normNameKey(s){
  return String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g, ' ');
}

/* Actual MD ต่อ resource x app x เดือน — pure function (เทสต์เรียกตรงได้ ไม่อ่าน S.* เอง)
   `months` = S.months ('YYYY-MM'), `filter` = { apps:Set, leads:Set }
   ⚠️ กรองเดือนด้วยเซ็ตเดือนที่เลือกจริง ห้ามใช้ซองวันที่ (§5.60) — 2026-09-10, §5.63 Task 3 */
function buildActualOsAgg(rows, resources, months, filter){
  const monthSet = new Set(months || []);
  const byName = new Map();
  (resources || []).forEach(r => {
    if (r.resource_type !== 'outsource') return;   // insource → ปล่อยให้ตกไป unmatched แทน (C1 fix, 2026-09-10)
    const k = normNameKey(r.full_name_en);
    if (!k) return;
    if (byName.has(k)) {
      // spec §4: ชื่อ full_name_en ซ้ำกัน 2 คนขึ้นไป — ยังผูกคนแรกเหมือนเดิม (ไม่เปลี่ยนพฤติกรรม
      // จับคู่) แค่เตือนให้รู้ตัว (2026-09-10, Fix round 1 ของ §5.63 Task 3 review)
      console.warn('buildActualOsAgg: duplicate full_name_en key "' + k + '" — binding to first resource', r.resource_id);
      return;
    }
    byName.set(k, r.resource_id);
  });
  const byResAppMonth = {}, byResTotal = {}, unmatchedMap = {}, appSet = new Set();
  (rows || []).forEach(row => {
    const ym = String(row.ym || '');
    if (!/^\d{6}$/.test(ym)) return;
    const mk = ym.slice(0, 4) + '-' + ym.slice(4, 6);
    if (!monthSet.has(mk)) return;
    const app = row.app_code || '';
    if (filter && filter.apps && filter.apps.size && !filter.apps.has(app)) return;
    if (filter && filter.leads && filter.leads.size
        && !(row.approver_emp_id && filter.leads.has(row.approver_emp_id))) return;
    const md = Number(row.actual_md) || 0;
    appSet.add(app);
    const rid = byName.get(normNameKey(row.name_key || row.en_fullname));
    if (rid) {
      byResAppMonth[rid] = byResAppMonth[rid] || {};
      byResAppMonth[rid][app] = byResAppMonth[rid][app] || {};
      byResAppMonth[rid][app][mk] = (byResAppMonth[rid][app][mk] || 0) + md;
      byResTotal[rid] = (byResTotal[rid] || 0) + md;
    } else {
      const key = normNameKey(row.name_key || row.en_fullname);
      const u = unmatchedMap[key] = unmatchedMap[key]
        || { key, name: row.nickname_name || row.en_fullname || key, byAppMonth: {}, total: 0 };
      u.byAppMonth[app] = u.byAppMonth[app] || {};
      u.byAppMonth[app][mk] = (u.byAppMonth[app][mk] || 0) + md;
      u.total += md;
    }
  });
  const unmatched = Object.values(unmatchedMap)
    .sort((a, b) => String(a.name).localeCompare(String(b.name)));
  return { byResAppMonth, byResTotal, unmatched, apps: [...appSet] };
}

/* ---- By OS (pivot: OS x App) ---- */
/** §5.59 (2026-09-03, Gibb): ซ่อน OS ที่ "ลาออกแล้ว **และ** ไม่มี MD ในเดือนที่เลือก"
 *  ออกจากตาราง By OS — เกณฑ์ลาออกใช้ตัวเดียวกับหน้า Outsource (matchesFilters():
 *  last working day = outsource_staff.end_date < วันเริ่มของช่วงที่เลือก) บวกกรณี
 *  resource ถูกปิดใช้งาน (is_active=false) ที่ไม่มี end_date กรอกไว้
 *  ⚠️ เงื่อนไข `total > 0 ให้แสดงเสมอ` สำคัญ (ยืนยันโดย Gibb): คนที่ลาออกไปแล้วแต่ยังมี
 *  booking ค้างอยู่ในเดือนนั้นต้องยังโชว์ ไม่งั้น MD ของเขาจะหายจากตารางแต่ยังอยู่ในระบบ
 *  ⇒ ผลรวมท้ายตาราง (คิดจากแถวที่ render จริง) เพี้ยนไปจาก MD จริงเงียบๆ
 *  (mirror ใน downloadOsExcel() ด้วย — export ต้องได้แถวชุดเดียวกับบนจอ) */
function osRowVisible(r, rangeStart){
  if (r.total > 0) return true;
  if (r.end_date && rangeStart && r.end_date < rangeStart) return false;   // ลาออกก่อนเดือนที่เลือก
  if (r.is_active === false) return false;                                 // ปิดใช้งาน (ไม่ได้กรอก end_date)
  return true;
}
// ใช้ร่วมกันทั้งโหมด Actual (renderOsView) และ Compare (renderOsCompare) — spec §5 บังคับ
// ว่า hint นี้ต้องขึ้นทั้ง 2 โหมด เพราะตัวเลข Actual (import จาก Excel) ไม่มี Project เลย
// ตัวกรอง Project บน panel จึงไม่มีผลกับมันในทั้ง 2 โหมด (ทำเป็น helper กันโค้ดซ้ำ)
function projectFilterHintHTML(){
  return (S.filter && S.filter.projects && S.filter.projects.size)
    ? '<div class="dash-hint">ตัวกรอง Project ไม่มีผลกับตัวเลข Actual (ข้อมูล Actual ไม่มี Project)</div>'
    : '';
}
/** keyFns ของตาราง By OS — คอลัมน์ App สร้างดังค์ตามชุด app ที่มีจริงในรอบนั้น
 *  (key = `app:<ชื่อแอป>` ใช้ชื่อแอปตรงๆ เพื่อให้ prefs ที่จำไว้ยังชี้ถูกคอลัมน์เดิม
 *  แม้ชุด/ลำดับคอลัมน์จะเปลี่ยนไป — index-based จะเลื่อนไปคนละคอลัมน์) */
function osKeyFns(apps, agg){
  const kf = {
    osName: r => resName(r.nickname, r.full_name_en),
    role: r => roleRank(r.role_code),
    total: r => r.total,
  };
  apps.forEach(a => { kf['app:' + a] = r => (agg.byOsApp[r.resource_id] || {})[a] || 0; });
  return kf;
}
/** By OS — §5.63 Task 5: แตก 3 โหมดตาม S.osMode ('booked' | 'actual' | 'compare')
 *  - 'compare' implement เต็มแล้ว (Task 6) — ส่งต่อให้ renderOsCompare()
 *  - 'booked' (default): โค้ดเดิมทุกบรรทัดตั้งแต่ก่อน Task 5 — นับ MD จาก S.periodAggActiveOnly
 *    (booking/leave จริง, active project เท่านั้น, §5.48/§5.59)
 *  - 'actual': นับจาก buildActualOsAgg() (S.actualPersonRows, กรองเดือนด้วย S.months ไม่ใช่
 *    S.overallRange — ข้อมูล Actual import จาก Excel ไม่มี Project เลย จึงไม่ผูกกับ
 *    matchProjectDiscovery()/S.filter.projects เหมือนโหมด booked — ตัวกรอง Project บน panel
 *    จึงไม่มีผลกับตัวเลขนี้ มี .dash-hint เตือนไว้) ชื่อที่ import มาแต่จับคู่กับ resource
 *    ไม่ได้เลย (buildActualOsAgg()'s unmatchedMap) โผล่เป็นกลุ่มท้ายตาราง "ไม่พบใน OS master"
 *    — ยอดรวมท้ายตารางนับรวมกลุ่มนี้ด้วยเสมอ (ไม่งั้น MD ของคนกลุ่มนี้หายไปเงียบๆ) */
function renderOsView(container){
  if (S.osMode === 'compare') return renderOsCompare(container);

  const rangeStart = S.overallRange.s || '';

  if (S.osMode === 'actual') {
    const aAgg = buildActualOsAgg(S.actualPersonRows, Object.values(S.resourceMap), S.months, S.filter);
    const apps = sortedApps(aAgg.apps);

    // แปลงเป็นทรงเดียวกับ periodAggActiveOnly ({byOsApp, byOsTotal}) เพื่อใช้ osKeyFns()/
    // โครงตารางเดิมตัวเดียวกับโหมด booked ตรงๆ ได้ — เซลล์ = ผลรวมทุกเดือนของ app นั้น
    // (buildActualOsAgg() เก็บแยกรายเดือนไว้เผื่อ caller อื่นในอนาคตต้องการ breakdown)
    const shaped = { byOsApp: {}, byOsTotal: aAgg.byResTotal };
    Object.keys(aAgg.byResAppMonth).forEach(rid => {
      shaped.byOsApp[rid] = {};
      Object.keys(aAgg.byResAppMonth[rid]).forEach(app => {
        shaped.byOsApp[rid][app] = Object.values(aAgg.byResAppMonth[rid][app]).reduce((s, v) => s + v, 0);
      });
    });

    const osRows = genericSort(Object.values(S.resourceMap)
      .filter(r => r.resource_type === 'outsource')
      .map(r => ({ ...r, total: shaped.byOsTotal[r.resource_id] || 0 }))
      .filter(r => osRowVisible(r, rangeStart))
      .sort((a,b) => (roleRank(a.role_code)-roleRank(b.role_code)) || String(a.nickname||a.full_name_en||'').localeCompare(String(b.nickname||b.full_name_en||''))),
      S.osSort, osKeyFns(apps, shaped));

    const hintHTML = projectFilterHintHTML();

    if (!apps.length && !aAgg.unmatched.length) {
      container.innerHTML = hintHTML + '<div class="empty-state">ไม่มีข้อมูล Actual MD ในเดือนที่เลือก</div>';
      return;
    }

    const headApps = apps.map(a => thSort(a, 'app:' + a, S.osSort)).join('');
    const colTotals = {}; apps.forEach(a => colTotals[a] = 0);
    let grandTotal = 0;

    const bodyRows = osRows.map(r => {
      const cells = apps.map(a => {
        const v = (shaped.byOsApp[r.resource_id] || {})[a] || 0;
        colTotals[a] += v;
        return `<td class="td-md-cell">${v ? fmtMD(v) : '<span class="muted">—</span>'}</td>`;
      }).join('');
      grandTotal += r.total;
      return `<tr>
        <td class="td-os-name">${esc(resName(r.nickname, r.full_name_en))}</td>
        <td class="td-os-role">${esc(roleLabelFor(r.role_code))}</td>
        <td class="td-os-total">${fmtMD(r.total)}</td>
        ${cells}
      </tr>`;
    }).join('');

    // กลุ่ม "ไม่พบใน OS master" — ยอดรวมท้ายตารางต้องนับรวมด้วยเสมอ (colTotals/grandTotal
    // ตัวเดียวกับแถวที่ match ได้ข้างบน — ไม่ใช่ผลรวมแยกต่างหาก)
    let unmatchedRowsHTML = '';
    if (aAgg.unmatched.length) {
      const headRow = `<tr class="os-unmatched-row"><td colspan="${3 + apps.length}" class="os-unmatched-head">ไม่พบใน OS master (${aAgg.unmatched.length} คน)</td></tr>`;
      const rows = aAgg.unmatched.map(u => {
        const cells = apps.map(a => {
          const v = Object.values(u.byAppMonth[a] || {}).reduce((s, v2) => s + v2, 0);
          colTotals[a] += v;
          return `<td class="td-md-cell">${v ? fmtMD(v) : '<span class="muted">—</span>'}</td>`;
        }).join('');
        grandTotal += u.total;
        return `<tr class="os-unmatched-row">
          <td class="td-os-name">${esc(u.name)}</td>
          <td class="td-os-role"></td>
          <td class="td-os-total">${fmtMD(u.total)}</td>
          ${cells}
        </tr>`;
      }).join('');
      unmatchedRowsHTML = headRow + rows;
    }

    const totalRow = `<tr class="dash-total-row">
      <td class="td-os-name">รวมทั้งหมด</td>
      <td class="td-os-role"></td>
      <td class="td-os-total">${fmtMD(grandTotal)}</td>
      ${apps.map(a => `<td class="td-md-cell">${fmtMD(colTotals[a])}</td>`).join('')}
    </tr>`;

    container.innerHTML = hintHTML + `
      <div class="dash-os-scroll">
        <table class="dash-os-table">
          <thead><tr>
            ${thSort('OS','osName',S.osSort,'th-os-name')}
            ${thSort('Role','role',S.osSort,'th-os-role')}
            ${thSort('Total','total',S.osSort,'th-os-total')}
            ${headApps}
          </tr></thead>
          <tbody>${bodyRows}${unmatchedRowsHTML || (bodyRows ? '' : `<tr><td colspan="${3+apps.length}" class="empty-state">ไม่มีข้อมูล</td></tr>`)}</tbody>
          <tfoot>${totalRow}</tfoot>
        </table>
      </div>`;

    wireSortHeader(container.querySelector('.dash-os-table thead'), S.osSort, () => {
      savePrefs(PAGE, { osSort: S.osSort });
      renderOsView(container);
    });
    return;
  }

  // โหมด 'booked' (default) — §6: By OS counts MD only on bookings whose project is_active = true.
  const agg = S.periodAggActiveOnly || { byOsApp:{}, byOsTotal:{} };
  const appSet = new Set();
  Object.values(agg.byOsApp).forEach(m => Object.keys(m).forEach(a => appSet.add(a)));
  const apps = sortedApps([...appSet]);

  // ลำดับตั้งต้น (สถานะ unsort) = role → ชื่อเล่น เหมือนเดิมทุกประการ แล้วค่อยให้ genericSort()
  // เรียงทับตาม S.osSort ถ้าผู้ใช้กดหัวคอลัมน์ไว้
  const osRows = genericSort(Object.values(S.resourceMap)
    .filter(r => r.resource_type === 'outsource')
    .map(r => ({ ...r, total: agg.byOsTotal[r.resource_id] || 0 }))
    .filter(r => osRowVisible(r, rangeStart))
    .sort((a,b) => (roleRank(a.role_code)-roleRank(b.role_code)) || String(a.nickname||a.full_name_en||'').localeCompare(String(b.nickname||b.full_name_en||''))),
    S.osSort, osKeyFns(apps, agg));

  if (!apps.length) {
    container.innerHTML = '<div class="empty-state">ไม่มีข้อมูล Booking ในช่วงที่เลือก</div>';
    return;
  }

  const headApps = apps.map(a => thSort(a, 'app:' + a, S.osSort)).join('');
  const colTotals = {}; apps.forEach(a => colTotals[a] = 0);
  let grandTotal = 0;

  const bodyRows = osRows.map(r => {
    const cells = apps.map(a => {
      const v = (agg.byOsApp[r.resource_id] || {})[a] || 0;
      colTotals[a] += v;
      return `<td class="td-md-cell">${v ? fmtMD(v) : '<span class="muted">—</span>'}</td>`;
    }).join('');
    grandTotal += r.total;
    return `<tr>
      <td class="td-os-name">${esc(resName(r.nickname, r.full_name_en))}</td>
      <td class="td-os-role">${esc(roleLabelFor(r.role_code))}</td>
      <td class="td-os-total">${fmtMD(r.total)}</td>
      ${cells}
    </tr>`;
  }).join('');

  const totalRow = `<tr class="dash-total-row">
    <td class="td-os-name">รวมทั้งหมด</td>
    <td class="td-os-role"></td>
    <td class="td-os-total">${fmtMD(grandTotal)}</td>
    ${apps.map(a => `<td class="td-md-cell">${fmtMD(colTotals[a])}</td>`).join('')}
  </tr>`;

  container.innerHTML = `
    <div class="dash-os-scroll">
      <table class="dash-os-table">
        <thead><tr>
          ${thSort('OS','osName',S.osSort,'th-os-name')}
          ${thSort('Role','role',S.osSort,'th-os-role')}
          ${thSort('Total','total',S.osSort,'th-os-total')}
          ${headApps}
        </tr></thead>
        <tbody>${bodyRows || `<tr><td colspan="${3+apps.length}" class="empty-state">ไม่มีข้อมูล</td></tr>`}</tbody>
        <tfoot>${totalRow}</tfoot>
      </table>
    </div>`;

  wireSortHeader(container.querySelector('.dash-os-table thead'), S.osSort, () => {
    savePrefs(PAGE, { osSort: S.osSort });
    renderOsView(container);
  });
}
/* ---- By OS โหมด Compare (Task 6, §5.63, 2026-09-10) ----
   ผสาน Booked (computeAgg().byOsAppMonth, Task 4) กับ Actual (buildActualOsAgg(), Task 3)
   เป็นแถวเดียวต่อคน 1 คนอาจมีได้หลาย App (แถวย่อยกางดูได้) — แยกเป็น helper เล็กๆ ที่ pure
   ล้วนๆ (ไม่อ่าน S.* เลยสักตัว) เพื่อไม่ให้ renderOsCompare() ต้อง copy ตรรกะรวมยอดซ้ำจาก
   ที่อื่น (reviewer ของ Task 5 เตือนเรื่อง copy-paste ระหว่าง booked/actual branch ไว้แล้ว —
   งานนี้จึงตั้งใจแยกให้ buildCompareRows()/buildCompareCells()/sumCompareCells() เทสต์ตรง
   ผ่าน vm ได้โดยไม่ต้องพึ่ง DOM/S เลย) ส่วนต่าง d = Booked − Actual เสมอ (ตรงกับ §5.62) */

/** เซลล์ของ 1 (resource, app) ต่อเดือนที่เลือก — bByMonth/aByMonth = 'YYYY-MM' -> md (ไม่มี
 *  key นั้นแปลว่า 0) คืน { total:{b,a,d}, 'YYYY-MM':{b,a,d} } ตามสัญญาที่ brief กำหนด */
function buildCompareCells(bByMonth, aByMonth, months){
  bByMonth = bByMonth || {}; aByMonth = aByMonth || {};
  const cells = { total: { b: 0, a: 0, d: 0 } };
  (months || []).forEach(mk => {
    const b = bByMonth[mk] || 0, a = aByMonth[mk] || 0;
    cells[mk] = { b, a, d: b - a };
    cells.total.b += b; cells.total.a += a;
  });
  cells.total.d = cells.total.b - cells.total.a;
  return cells;
}
/** รวมเซลล์ของหลาย App (หรือหลายคน สำหรับ tfoot) เป็นก้อนเดียว — ใช้ทั้งตอนคำนวณผลรวม
 *  ระดับ parent (รวม App ของคนคนเดียว) และตอนคำนวณ tfoot (รวมทุกแถว parent ที่แสดงจริง)
 *  จุดเดียวกัน ไม่ copy สูตรรวมยอดซ้ำที่ 2 จุด */
function sumCompareCells(cellsList, months){
  const out = { total: { b: 0, a: 0, d: 0 } };
  (months || []).forEach(mk => { out[mk] = { b: 0, a: 0, d: 0 }; });
  (cellsList || []).forEach(c => {
    out.total.b += c.total.b; out.total.a += c.total.a;
    (months || []).forEach(mk => {
      const cm = c[mk] || {};
      out[mk].b += cm.b || 0; out[mk].a += cm.a || 0;
    });
  });
  out.total.d = out.total.b - out.total.a;
  (months || []).forEach(mk => { out[mk].d = out[mk].b - out[mk].a; });
  return out;
}
/** ⚠️ pure function ตามสัญญาใน brief — รับพารามิเตอร์ครบ ไม่อ่าน S.* ข้างในเลย เทสต์เรียก
 *  ตรงผ่าน vm ได้ทันที
 *  - bAgg: computeAgg().byOsAppMonth ตรงๆ (resource_id -> app -> 'YYYY-MM' -> md)
 *  - aAgg: ผลลัพธ์เต็มของ buildActualOsAgg() ({byResAppMonth, unmatched, ...})
 *  - resources: Object.values(S.resourceMap) — กรองเฉพาะ resource_type==='outsource' เอง
 *  - rangeStart: S.overallRange.s — ส่งต่อให้ osRowVisible() เช็คเกณฑ์ "ลาออกแล้ว" เดิม
 *  คืน [{ resource_id, name, role_code, apps:[{app, cells}], cells, unmatched? }] — แถว
 *  unmatched (จาก aAgg.unmatched, Booked เป็น 0 เสมอเพราะไม่มี Project ให้ผูก) อยู่ท้ายสุด
 *  เสมอ ไม่ผ่าน osRowVisible() (ไม่มีแนวคิด "ลาออก" สำหรับคนที่จับคู่กับ OS master ไม่ได้เลย) */
function buildCompareRows(bAgg, aAgg, resources, months, rangeStart){
  bAgg = bAgg || {};
  months = months || [];
  const aByResAppMonth = (aAgg && aAgg.byResAppMonth) || {};
  const unmatchedList = (aAgg && aAgg.unmatched) || [];

  const matched = (resources || [])
    .filter(r => r.resource_type === 'outsource')
    .map(r => {
      const rid = r.resource_id;
      const bByApp = bAgg[rid] || {};
      const aByApp = aByResAppMonth[rid] || {};
      const appNames = [...new Set([...Object.keys(bByApp), ...Object.keys(aByApp)])]
        .sort((x, y) => x.localeCompare(y));
      const apps = appNames.map(app => ({ app, cells: buildCompareCells(bByApp[app], aByApp[app], months) }));
      const cells = sumCompareCells(apps.map(a => a.cells), months);
      return {
        resource_id: rid,
        name: resName(r.nickname, r.full_name_en),
        role_code: r.role_code,
        end_date: r.end_date,
        is_active: r.is_active,
        apps,
        cells,
      };
    })
    .filter(r => osRowVisible({ total: r.cells.total.b + r.cells.total.a, end_date: r.end_date, is_active: r.is_active }, rangeStart));

  const unmatched = unmatchedList.map(u => {
    const appNames = Object.keys(u.byAppMonth || {}).sort((x, y) => x.localeCompare(y));
    const apps = appNames.map(app => ({ app, cells: buildCompareCells(null, u.byAppMonth[app], months) }));
    const cells = sumCompareCells(apps.map(a => a.cells), months);
    return { resource_id: 'unmatched:' + u.key, name: u.name, role_code: '', apps, cells, unmatched: true };
  });

  return [...matched, ...unmatched];
}
/** keyFns ของตาราง Compare ระดับ parent — คีย์ 'b:total'/'a:total'/'d:total' สำหรับกลุ่ม
 *  Total, 'b:<YYYY-MM>'/'a:<YYYY-MM>'/'d:<YYYY-MM>' ต่อเดือน (ชื่อคีย์คนละชุดกับ osKeyFns()
 *  ของโหมด booked/actual ('total'/'app:<ชื่อ>') โดยตั้งใจ — ตารางหน้าตาไม่เหมือนกันเลย ไม่มี
 *  เหตุผลต้องใช้คีย์ร่วมกัน) */
function compareKeyFns(months){
  const kf = {
    osName: r => r.name,
    role: r => roleRank(r.role_code),
    'b:total': r => r.cells.total.b,
    'a:total': r => r.cells.total.a,
    'd:total': r => r.cells.total.d,
  };
  (months || []).forEach(mk => {
    kf['b:' + mk] = r => r.cells[mk].b;
    kf['a:' + mk] = r => r.cells[mk].a;
    kf['d:' + mk] = r => r.cells[mk].d;
  });
  return kf;
}
/* เซลล์ Booked/Actual ธรรมดา — 0 โชว์ "—" จางๆ เหมือน appMonthCellHTML() ของแท็บ By App
   (กัน OS × App × เดือน หลายสิบคอลัมน์เต็มไปด้วยเลข 0 อ่านยาก) */
function cmpCellHTML(v){ return v ? fmtMD(v) : '<span class="muted">—</span>'; }
/* เซลล์ส่วนต่าง (Booked − Actual) — โชว์ตัวเลขเสมอแม้เป็น 0 (ต่างจาก cmpCellHTML) เพราะเป็น
   จุดสำคัญของมุมมอง Compare เอง ไม่อยากให้ผู้ใช้เข้าใจผิดว่า "ไม่มีข้อมูล" — สีตาม §5.62:
   บวก (จองไว้มากกว่าที่ใช้จริง) = md-over (เขียว), ลบ (ใช้จริงเกินที่จอง) = md-under (แดง) */
function cmpDiffTd(d){
  const cls = d > 0 ? 'md-over' : (d < 0 ? 'md-under' : '');
  return `<td class="right ${cls}">${fmtMD(d)}</td>`;
}
/* ก้อน <td> ของ Total + ทุกเดือนที่เลือก (Booked | Actual | B−A ซ้ำทุกกลุ่ม) — ใช้ร่วมทั้ง
   แถว parent, แถวย่อย (.os-sub-row) และ tfoot จุดเดียว กัน copy โครง <td> ซ้ำ 3 ที่ */
function cmpTotalCells(cells, months){
  let html = `<td class="right">${cmpCellHTML(cells.total.b)}</td><td class="right">${cmpCellHTML(cells.total.a)}</td>${cmpDiffTd(cells.total.d)}`;
  (months || []).forEach(mk => {
    const c = cells[mk] || { b: 0, a: 0, d: 0 };
    html += `<td class="right">${cmpCellHTML(c.b)}</td><td class="right">${cmpCellHTML(c.a)}</td>${cmpDiffTd(c.d)}`;
  });
  return html;
}
/** โหมด Compare (By OS) — Task 6: ตาราง OS x App x เดือน เทียบ Booked vs Actual พร้อม
 *  ส่วนต่าง ระดับคนแบบกางดู App รายตัวได้ (parent = ผลรวมทุก App, .os-sub-row = ต่อ 1 App)
 *  กางเฉพาะ resource_id ที่มีอยู่ใน S.osExpanded (view state ล้วนๆ — ไม่เขียนลง prefs ตามที่
 *  ระบุใน brief ข้อ 4 — สลับโหมด/แท็บแล้วสถานะกาง/หุบหายไปเป็นเรื่องปกติ) แถว unmatched
 *  ตัดออกก่อน sort เสมอแล้วต่อท้ายทีหลัง ไม่ว่าจะเรียงคอลัมน์ไหน (brief ข้อ 5) */
function renderOsCompare(container){
  const rangeStart = S.overallRange.s || '';
  const months = S.months || [];
  const bAgg = (S.periodAggActiveOnly || {}).byOsAppMonth || {};
  const aAgg = buildActualOsAgg(S.actualPersonRows, Object.values(S.resourceMap), months, S.filter);
  const resources = Object.values(S.resourceMap);
  const allRows = buildCompareRows(bAgg, aAgg, resources, months, rangeStart);
  const hintHTML = projectFilterHintHTML();

  if (!allRows.length) {
    container.innerHTML = hintHTML + '<div class="empty-state">ไม่มีข้อมูล Booked/Actual MD สำหรับตัวกรองชุดนี้</div>';
    return;
  }

  // unmatched ตัดออกก่อน sort แล้วต่อท้ายทีหลังเสมอ (brief ข้อ 5) — ไม่ว่า S.osSort จะชี้
  // ไปคอลัมน์ไหน แถวกลุ่มนี้ต้องอยู่ท้ายสุดตลอด
  const matchedRows = allRows.filter(r => !r.unmatched);
  const unmatchedRows = allRows.filter(r => r.unmatched);
  const sortedMatched = genericSort(matchedRows, S.osSort, compareKeyFns(months));
  const finalRows = [...sortedMatched, ...unmatchedRows];

  const monthHeads = months.map(mk => `<th colspan="3">${esc(monthLabel(mk))}</th>`).join('');
  const monthSubHeads = months.map(mk => `
    ${thSort('Booked', 'b:' + mk, S.osSort, 'right')}
    ${thSort('Actual', 'a:' + mk, S.osSort, 'right')}
    ${thSort('B − A', 'd:' + mk, S.osSort, 'right')}
  `).join('');

  const theadRow1 = `<tr>
    ${thSort('OS', 'osName', S.osSort, 'col-cmp-name', 'rowspan="2"')}
    ${thSort('Role', 'role', S.osSort, 'col-cmp-role', 'rowspan="2"')}
    <th class="col-cmp-app" rowspan="2"><div class="os-app-head"><span>App</span>
      <span class="os-app-head-actions">
        <button class="os-ico" type="button" id="osCollapseAll" title="หุบทั้งหมด">⊟</button>
        <button class="os-ico" type="button" id="osExpandAll" title="กางทั้งหมด">⊞</button>
      </span></div></th>
    <th colspan="3">Total</th>
    ${monthHeads}
  </tr>`;
  const theadRow2 = `<tr>
    ${thSort('Booked', 'b:total', S.osSort, 'right')}
    ${thSort('Actual', 'a:total', S.osSort, 'right')}
    ${thSort('B − A', 'd:total', S.osSort, 'right')}
    ${monthSubHeads}
  </tr>`;

  const bodyRows = finalRows.map(r => {
    const expanded = !!S.osExpanded[r.resource_id];
    const appCell = r.apps.length >= 2
      ? `<button class="os-expand" data-rid="${esc(r.resource_id)}">${expanded ? '▾' : '▸'} ${r.apps.length} Apps</button>`
      : (r.apps.length === 1 ? esc(r.apps[0].app) : '<span class="muted">—</span>');
    const parentTr = `<tr${r.unmatched ? ' class="os-unmatched-row"' : ''}>
      <td class="col-cmp-name">${esc(r.name)}</td>
      <td class="col-cmp-role">${esc(roleLabelFor(r.role_code))}</td>
      <td class="col-cmp-app">${appCell}</td>
      ${cmpTotalCells(r.cells, months)}
    </tr>`;
    const subTrs = (r.apps.length >= 2 && expanded)
      ? r.apps.map(ap => `<tr class="os-sub-row">
          <td class="col-cmp-name"></td>
          <td class="col-cmp-role"></td>
          <td class="col-cmp-app">${esc(ap.app)}</td>
          ${cmpTotalCells(ap.cells, months)}
        </tr>`).join('')
      : '';
    return parentTr + subTrs;
  }).join('');

  // tfoot = ผลรวมของแถว parent ที่แสดงจริง (รวม unmatched, brief ข้อ 6) — ไม่รวมแถวย่อย
  // (จะรวมซ้ำ 2 ชั้น เพราะแถวย่อยเป็นแค่ breakdown ของ parent ตัวเดียวกัน)
  const grandCells = sumCompareCells(finalRows.map(r => r.cells), months);
  const totalRow = `<tr class="dash-total-row">
    <td class="col-cmp-name">รวมทั้งหมด (${finalRows.length} คน)</td>
    <td class="col-cmp-role"></td>
    <td class="col-cmp-app"></td>
    ${cmpTotalCells(grandCells, months)}
  </tr>`;

  container.innerHTML = `
    ${hintHTML}
    <div class="dash-os-scroll">
      <table class="dash-compare-table" id="compareTable">
        <thead>${theadRow1}${theadRow2}</thead>
        <tbody>${bodyRows}</tbody>
        <tfoot>${totalRow}</tfoot>
      </table>
    </div>`;

  wireSortHeader(container.querySelector('#compareTable thead'), S.osSort, () => {
    savePrefs(PAGE, { osSort: S.osSort });
    renderOsCompare(container);
  });
  // delegated click listener ตัวเดียว (brief ข้อ: "delegated click listener ตัวเดียวบน
  // container") จับ .os-expand ของทุกแถว แทนการผูก listener แยกทีละปุ่ม (อาจมีเป็นร้อยแถว)
  container.querySelector('.dash-os-scroll').addEventListener('click', e => {
    const btn = e.target.closest('.os-expand');
    if (!btn) return;
    S.osExpanded[btn.dataset.rid] = !S.osExpanded[btn.dataset.rid];
    renderOsCompare(container);
  });
  // ปุ่มกาง/หุบทั้งหมด — set S.osExpanded แล้ว re-render เฉยๆ ห้ามเขียนลง prefs (brief ข้อ 4)
  container.querySelector('#osExpandAll').addEventListener('click', () => {
    finalRows.forEach(r => { if (r.apps.length >= 2) S.osExpanded[r.resource_id] = true; });
    renderOsCompare(container);
  });
  container.querySelector('#osCollapseAll').addEventListener('click', () => {
    S.osExpanded = {};
    renderOsCompare(container);
  });
}
function roleLabelFor(code){
  return code==='SENIOR' ? '1.Senior Tester' : code==='TESTER' ? '2.Tester' : code==='JUNIOR' ? '3.Junior Tester' : (code||'');
}

/* ---- By Lead (matrix: Lead x App) ----
   Source of truth: project_lead + pqa_lead (both main & additional leads), scoped to
   projects that match the current "ค้นหา Project" search window (projectMatchesRange(),
   §5.37) — same matched-project set the By Project tab uses. (Before §5.37 this matrix
   was described as "NOT time/day-bound"; now it's filtered by the same search the other
   tabs use, for consistency — a Lead with zero matched projects simply gets no row.)
   2026-08-13: `projByKey` now comes from currentProjMap() = S.activeProjMap (active-only,
   §5.43) instead of S.allProjMap — an inactive project's leads/coverage no longer show up
   here, same as they already didn't on By Project.
   Each cell = COUNT of distinct matched projects that Lead owns under that App (not just
   a 0/1 coverage flag) — a Lead with 2 matched projects under the same App shows "2".

   Total MD column (task 3): sum of MD for every MATCHED project where this lead is the
   MAIN lead (project_lead.is_main = true). Reuses S.periodAgg.byProject — the same
   full-span Effective "Booked MD" aggregate (§5.37) that the By Project tab's "Total MD"
   column already uses, computed only over projects that matched the search — so the
   number is consistent with the rest of the page. Projects with no main lead simply
   never get added to any lead's total (no double counting, no orphan bucket). */
/* By Lead tab — one matrix table (Lead × App) at a time, for whichever role is picked
 * in #leadRoleSelect (S.leadRoleFilter). First shipped as 3 tables stacked vertically
 * (2026-08-13), then Gibb asked for a dropdown instead so only one table shows at a
 * time — the role-classification/coverage-building logic below is unchanged from that
 * version, only the rendering step (build 1 section instead of 3) changed.
 * Only the Main Lead table carries a Total MD column — MD is only ever summed from
 * projects where the lead is_main (see §5.18/§5.20), and Gibb confirmed Sub Lead /
 * Executor should show project counts only, no MD column, to avoid implying a
 * per-role MD split that doesn't exist. The App column set is still computed as the
 * union across all 3 roles (not just the selected one) so switching the dropdown
 * doesn't shuffle the columns around. */
const LEAD_ROLE_META = {
  main: { title: 'Main Lead', withMD: true },
  sub:  { title: 'Sub Lead', withMD: false },
  exec: { title: 'Executor', withMD: false },   // 2026-08-14: renamed from "Internal Executor" (ตามคำขอพี่กิ๊บ)
};
/** Classify a pqa_lead's email into the By Lead "Filter:" domain bucket (2026-08-13, Gibb).
 *  'infinitas' = @infinitaskt.com, 'arise' = @arise.tech, everything else (outsource
 *  vendors like @doppiotech.com, missing email, etc.) falls into 'other' — the dropdown
 *  stays exhaustive without needing to enumerate every vendor domain by name. */
function leadDomainBucket(email){
  const e = String(email || '').trim().toLowerCase();
  if (e.endsWith('@infinitaskt.com')) return 'infinitas';
  if (e.endsWith('@arise.tech')) return 'arise';
  return 'other';
}
/** Lead × App coverage for the currently matched project set (Project/UAT Lead/App +
 *  Start/End search, §5.37) — same logic as the inline block at the top of renderLeadView()
 *  (kept inline there on purpose, NOT refactored to call this: tests/run_tests.mjs vm-evals
 *  renderLeadView() as an isolated, self-contained function in several places, and a shared
 *  helper would break that). Added 2026-08-14 for downloadLeadExcel() so the "Download
 *  Excel" button computes from the same rules the on-screen matrix uses — if the coverage
 *  rules in renderLeadView() change, mirror the change here too. Returns
 *  { coverage: {main|sub|exec -> emp_id -> {app -> Set(project_key)}},
 *    mainProjectsByLead: emp_id -> Set(project_key) where is_main=true,
 *    apps: sorted app list (union across all 3 roles), agg: S.periodAgg }. */
function computeLeadCoverage(){
  const projByKey = currentProjMap();
  const agg = S.periodAgg || { byProject:{} };
  const months = S.months;

  const coverage = { main:{}, sub:{}, exec:{} }; // role -> emp_id -> { app -> Set(project_key) }
  const mainProjectsByLead = {};                 // emp_id -> Set(project_key) where is_main = true
  S.projectLeadRows.forEach(pl => {
    const proj = projByKey[pl.project_key];
    if (!proj) return;
    if (!matchProjectDiscovery(pl.project_key, months)) return;   // §5.37 + 2026-08-14 Project/UAT Lead/App
    const app = proj.app || proj.other_app || '— ไม่มี App —';
    const role = pl.is_main ? 'main' : (pl.is_executor ? 'exec' : 'sub');
    const byApp = (coverage[role][pl.pqa_emp_id] = coverage[role][pl.pqa_emp_id] || {});
    (byApp[app] = byApp[app] || new Set()).add(pl.project_key);
    if (pl.is_main) {
      (mainProjectsByLead[pl.pqa_emp_id] = mainProjectsByLead[pl.pqa_emp_id] || new Set()).add(pl.project_key);
    }
  });

  const appSet = new Set();
  ['main','sub','exec'].forEach(role => {
    Object.values(coverage[role]).forEach(byApp => Object.keys(byApp).forEach(a => appSet.add(a)));
  });
  return { coverage, mainProjectsByLead, apps: sortedApps([...appSet]), agg };
}

/** Row DATA (no HTML) for one role's By Lead table — one row per lead who has ≥1 matched
 *  project in that role, after the Type/Domain dropdowns (S.leadDomainFilter). Mirrors
 *  buildSection()'s row-building block inside renderLeadView() (kept separate on purpose,
 *  see computeLeadCoverage() comment above re: the vm-eval test harness) — added 2026-08-14
 *  so downloadLeadExcel()'s Summary sheet uses the same row set/numbers as the screen. */
function buildLeadRoleRows(roleCoverage, mainProjectsByLead, apps, agg, withMD){
  // domainFilter defaults to 'all' when S.leadDomainFilter is unset (e.g. older cached
  // prefs from before this dropdown existed) — never silently drops every lead.
  const domainFilter = S.leadDomainFilter || 'all';
  return S.leadsAll
    .filter(l => domainFilter === 'all' || leadDomainBucket(l.email) === domainFilter)
    .map(l => {
      const byApp = roleCoverage[l.emp_id] || {};
      const allProjects = new Set();
      Object.values(byApp).forEach(set => set.forEach(k => allProjects.add(k)));
      if (!allProjects.size) return null; // lead with no project in this role/set — skip row
      let totalMD = 0;
      if (withMD) {
        const mainProjects = mainProjectsByLead[l.emp_id] || new Set();
        mainProjects.forEach(pk => { totalMD += agg.byProject[pk] || 0; });
      }
      const cellsByApp = {};
      apps.forEach(a => { cellsByApp[a] = byApp[a] ? byApp[a].size : 0; });
      return {
        emp_id: l.emp_id, name: l.short_name || l.nickname || l.emp_id, email: l.email || '',
        totalMD, totalProject: allProjects.size, projectKeys: allProjects, cellsByApp,
      };
    }).filter(Boolean);
}

function renderLeadView(container){
  const projByKey = currentProjMap();
  const agg = S.periodAgg || { byProject:{} };
  const months = S.months;

  const coverage = { main:{}, sub:{}, exec:{} }; // role -> emp_id -> { app -> Set(project_key) }
  const mainProjectsByLead = {};                 // emp_id -> Set(project_key) where is_main = true
  S.projectLeadRows.forEach(pl => {
    const proj = projByKey[pl.project_key];
    if (!proj) return;
    if (!matchProjectDiscovery(pl.project_key, months)) return;   // §5.37 + 2026-08-14 Project/UAT Lead/App
    const app = proj.app || proj.other_app || '— ไม่มี App —';
    const role = pl.is_main ? 'main' : (pl.is_executor ? 'exec' : 'sub');
    const byApp = (coverage[role][pl.pqa_emp_id] = coverage[role][pl.pqa_emp_id] || {});
    (byApp[app] = byApp[app] || new Set()).add(pl.project_key);
    if (pl.is_main) {
      (mainProjectsByLead[pl.pqa_emp_id] = mainProjectsByLead[pl.pqa_emp_id] || new Set()).add(pl.project_key);
    }
  });

  const appSet = new Set();
  ['main','sub','exec'].forEach(role => {
    Object.values(coverage[role]).forEach(byApp => Object.keys(byApp).forEach(a => appSet.add(a)));
  });
  const apps = sortedApps([...appSet]);

  if (!apps.length) {
    container.innerHTML = '<div class="empty-state">ไม่พบข้อมูล Lead / App สำหรับ Project ชุดที่เลือก</div>';
    return;
  }

  /* §5.59 (2026-09-03): แถวถูกสร้างเป็น "ข้อมูล" ก่อน แล้วค่อยเรียงตาม S.leadSort แล้วจึง
     render เป็น HTML (เดิม map เป็น HTML string ตรงๆ พร้อมบวกยอดรวมไปในตัว) — ยอดรวมท้าย
     ตาราง/colCount จึงย้ายมาคำนวณจากแถวที่ผ่านการกรองแล้วอีกรอบ ค่าที่ได้เท่าเดิมทุกประการ
     (การเรียงไม่เปลี่ยนผลบวก) ลำดับตั้งต้น (unsort) = ลำดับของ S.leadsAll เหมือนเดิม
     S.leadSort ใช้ร่วมกันทุก section ตอน Type = All (3 ตารางหน้าตาเดียวกัน) */
  const leadKeyFns = { name: r => r.name, totalMD: r => r.totalMD, totalProject: r => r.totalProject };
  apps.forEach(a => { leadKeyFns['app:' + a] = r => r.cellsByApp[a] || 0; });

  function buildSection(title, roleCoverage, withMD){
    // domainFilter defaults to 'all' when S.leadDomainFilter is unset (e.g. older cached
    // prefs from before this dropdown existed) — never silently drops every lead.
    const domainFilter = S.leadDomainFilter || 'all';
    const rowData = S.leadsAll
      .filter(l => domainFilter === 'all' || leadDomainBucket(l.email) === domainFilter)
      .map(l => {
        const byApp = roleCoverage[l.emp_id] || {};
        const allProjects = new Set();
        Object.values(byApp).forEach(set => set.forEach(k => allProjects.add(k)));
        if (!allProjects.size) return null; // lead with no project in this role/set — skip row
        let totalMD = 0;
        if (withMD) {
          const mainProjects = mainProjectsByLead[l.emp_id] || new Set();
          mainProjects.forEach(pk => { totalMD += agg.byProject[pk] || 0; });
        }
        const cellsByApp = {};
        apps.forEach(a => { cellsByApp[a] = byApp[a] ? byApp[a].size : 0; });
        return { name: l.short_name, totalMD, totalProject: allProjects.size, cellsByApp };
      }).filter(Boolean);

    const colCount = {}; apps.forEach(a => colCount[a] = 0);
    let grandTotal = 0, grandTotalMD = 0;
    rowData.forEach(r => {
      grandTotal += r.totalProject;
      grandTotalMD += r.totalMD;
      apps.forEach(a => { colCount[a] += r.cellsByApp[a] || 0; });
    });

    const bodyRows = genericSort(rowData, S.leadSort, leadKeyFns).map(r => {
      const cells = apps.map(a => `<td class="center">${r.cellsByApp[a] || '<span class="muted">—</span>'}</td>`).join('');
      const mdCell = withMD ? `<td class="right">${fmtMD(r.totalMD)}</td>` : '';
      return `<tr><td>${esc(r.name)}</td>${mdCell}<td class="right">${r.totalProject}</td>${cells}</tr>`;
    });

    const mdTotalCell = withMD ? `<td class="right">${fmtMD(grandTotalMD)}</td>` : '';
    const totalRow = `<tr class="dash-total-row">
      <td>รวม (${bodyRows.length} Lead)</td>${mdTotalCell}<td class="right">${grandTotal}</td>
      ${apps.map(a => `<td class="center">${colCount[a]}</td>`).join('')}
    </tr>`;

    const mdHeader = withMD ? thSort('Total MD','totalMD',S.leadSort,'right') : '';
    const colspan = (withMD ? 3 : 2) + apps.length;

    return `
      <div class="section-title">${esc(title)}</div>
      <div class="dash-table-wrap">
        <table class="dash-table" id="leadTable">
          <thead><tr>${thSort('UAT Lead','name',S.leadSort)}${mdHeader}${thSort('Total Project','totalProject',S.leadSort,'right')}${apps.map(a=>thSort(a,'app:'+a,S.leadSort,'center')).join('')}</tr></thead>
          <tbody>${bodyRows.join('') || `<tr><td colspan="${colspan}" class="empty-state">ไม่พบข้อมูล</td></tr>`}</tbody>
          <tfoot>${totalRow}</tfoot>
        </table>
      </div>`;
  }
  /* Type = All render 3 ตารางพร้อมกัน (id="leadTable" ซ้ำกันตามของเดิม) — ผูก listener
     ทุก thead ที่ render ออกมา ไม่ใช่แค่ตัวแรก */
  function wireLeadSortHeaders(){
    container.querySelectorAll('table.dash-table thead').forEach(thead => {
      wireSortHeader(thead, S.leadSort, () => {
        savePrefs(PAGE, { leadSort: S.leadSort });
        renderLeadView(container);
      });
    });
  }

  // 2026-08-14 (ตามคำขอพี่กิ๊บ): เพิ่ม Type = "All" — สร้างทั้ง 3 section (Main Lead/Sub Lead/
  // Executor) ต่อกันแบบเดียวกับ layout เดิมก่อน 2026-08-13 (ตอนนั้นโชว์ตลอดแบบ stack 3 ตาราง,
  // ดูคอมเมนต์เหนือ LEAD_ROLE_META) — เลือก role เดียว (main/sub/exec) ยังโชว์แค่ 1 ตารางเหมือนเดิม.
  if (S.leadRoleFilter === 'all') {
    container.innerHTML = ['main', 'sub', 'exec']
      .map(k => buildSection(LEAD_ROLE_META[k].title, coverage[k], LEAD_ROLE_META[k].withMD))
      .join('');
    wireLeadSortHeaders();
    return;
  }
  const roleKey = Object.prototype.hasOwnProperty.call(LEAD_ROLE_META, S.leadRoleFilter) ? S.leadRoleFilter : 'main';
  const meta = LEAD_ROLE_META[roleKey];
  container.innerHTML = buildSection(meta.title, coverage[roleKey], meta.withMD);
  wireLeadSortHeaders();
}

/* =====================================================================
   DOWNLOAD EXCEL ("📥 Download Excel" button — เดิม 2026-08-14 By Lead tab เท่านั้น, 2026-08-25
   ตามคำขอพี่กิ๊บ ขยายให้มีปุ่มเดียวกันทุกแท็บของ Dashboard) แต่ละแท็บ export "สิ่งที่กำลังแสดงอยู่
   จริง" บนแท็บนั้น (ตัวกรอง Project/UAT Lead/App/Start-End เสมอ ทุกแท็บ, บวก Type/Domain เฉพาะ By
   Lead) — downloadDashboardExcel() (ผูกกับปุ่มใน wireToolbar()) เลือกฟังก์ชัน export ตาม
   S.dashView: downloadProjectExcel() / downloadOsExcel() / downloadLeadExcel() /
   downloadSignoffExcel(). ทุกฟังก์ชันแชร์ helper 4 ตัวด้านล่าง (buildDownloadFilterAoa/
   downloadFilename/writeWorkbookAndDownload/logExcelDownload) ให้ Filter sheet/ชื่อไฟล์/การสั่ง
   ดาวน์โหลด/การ log หน้าตาเหมือนกันทุกแท็บ — logExcelDownload() บันทึกลง pqa.download_log
   (sql/patch_2026-08-14_download_log.sql — ต้องรันบน Supabase ก่อน) เหมือนเดิม
   computeLeadCoverage()/buildLeadRoleRows() (By Lead) mirror the same matching rules
   renderLeadView() uses (§5.37); downloadOsExcel()/downloadSignoffExcel() mirror the inline
   row-building in renderOsView()/renderSignoffView() the same way — kept as separate
   functions rather than refactoring the render functions themselves, so tests/run_tests.mjs's
   isolated vm-eval of renderLeadView()/renderSignoffView()/buildProjectRows() keeps working
   unmodified (see the doc comments on computeLeadCoverage()/projectPeriodDisp() above).
   By Lead's export stays 3 sheets: Filter / Summary (เหมือน By Lead matrix แต่รวมทุก role ที่
   เลือกเป็นตารางเดียว) / Project (1 แถวต่อ Lead×Project×Phase, MD จาก S.periodAgg.byProjectPhase
   เหมือน By Project tab). By Project/By OS/Signoff are 2 sheets: Filter + 1 data sheet mirroring
   that tab's on-screen table (+ totals row where the table has one). ===== */
/** Human-readable label for a multiselect's current selection — used in the exported
 *  "Filter" sheet. Empty Set = "All" (same convention as makeMultiSelect() itself). */
function selectedLabelsText(selectedSet, items, valueKey, labelKey){
  if (!selectedSet.size) return 'All';
  const byValue = {};
  items.forEach(it => { byValue[it[valueKey]] = it[labelKey]; });
  return [...selectedSet].map(v => byValue[v] || v).join(', ');
}

const LEAD_DOMAIN_LABELS = { all:'All', infinitas:'Infinitas', arise:'Arise', other:'Other' };

/** yyyyMMddHHmmss ตามเวลาเครื่องผู้ใช้ (ทีมอยู่โซนไทยอยู่แล้ว) — ใช้ตั้งชื่อไฟล์ export ตาม
 *  pattern pqaResourceManagement_<pqa_emp_id>_<YYYYMMDDHHMMSS>.xlsx ที่ขอ */
function fileTimeStamp(d){
  const p2 = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}`;
}

/** Sheet1 "Filter" rows ที่เลือกอยู่ตอนนี้ — ใช้ร่วมกันทุก tab (2026-08-25). `includeLeadFields`
 *  = true เติม Type/Domain ต่อท้าย Project/UAT Lead/App (By Lead tab เท่านั้น — ตัวกรอง 2 อันนี้
 *  มีผลแค่แท็บนั้น เหมือนที่ #leadRoleFld/#leadDomainFld ซ่อน/โชว์ตามแท็บ). */
function buildDownloadFilterAoa(includeLeadFields){
  const projectLabel = selectedLabelsText(S.filter.projects, S.activeProjects, 'project_key', 'project_name');
  const leadItems = S.leadsAll.map(l => ({ emp_id: l.emp_id, label: l.short_name || l.nickname || l.emp_id }));
  const leadLabel = selectedLabelsText(S.filter.leads, leadItems, 'emp_id', 'label');
  const appLabel = S.filter.apps.size ? [...S.filter.apps].sort().join(', ') : 'All';
  const rows = [
    ['Project', projectLabel],
    ['UAT Lead', leadLabel],
    ['App', appLabel],
  ];
  if (includeLeadFields) {
    const roleKey = Object.prototype.hasOwnProperty.call(LEAD_ROLE_META, S.leadRoleFilter) ? S.leadRoleFilter : 'main';
    rows.push(['Type', S.leadRoleFilter === 'all' ? 'All' : LEAD_ROLE_META[roleKey].title]);
    rows.push(['Domain', LEAD_DOMAIN_LABELS[S.leadDomainFilter || 'all'] || 'All']);
  }
  // 2026-09-01 (§5.50): Start Date/End Date (2 แถว) → เดือน (1 แถว) ให้ตรงกับตัวกรอง month
  // picker บนจอ — ค่าเป็น monthLabel() (Mmm-yyyy, §4.5) ไม่ใช่ dDisp() ของวันแรก/วันสุดท้ายอีก
  // ต่อไป (S.overallRange.s ยังมีอยู่ใช้แปลงกลับเป็น 'yyyy-MM' ให้ monthLabel() พอ)
  rows.push(['เดือน', (S.months || []).map(mm => monthLabel(mm)).join(', ')]);
  // 2026-09-02: View (All MD / Selected Month) — By Project tab เท่านั้น (มีผลแค่แท็บนั้น
  // เหมือน Type/Domain ที่มีผลแค่ By Lead — ดู #projectViewFld/switchDashView())
  if (S.dashView === 'project') {
    rows.push(['View', S.projectViewMode === 'month' ? 'Selected Month' : 'All MD']);
  }
  return rows;
}

/** ชื่อไฟล์ export — เหมือนเดิมทุกประการ (pqaResourceManagement_<emp_id>_<timestamp>.xlsx) บวก
 *  ชื่อแท็บ (`viewTag`) คั่นกลาง เพื่อแยกไฟล์จากคนละแท็บออกจากกันได้เวลาดาวน์โหลดหลายรอบ
 *  (2026-08-25 ตามคำขอพี่กิ๊บ — เดิมมีแค่ By Lead แท็บเดียวเลยไม่ต้องแยก). */
function downloadFilename(viewTag){
  const empId = (S.user && S.user.pqaEmpId) || 'NA';
  return `pqaResourceManagement_${viewTag}_${empId}_${fileTimeStamp(new Date())}.xlsx`;
}

/** ประกอบ workbook → .xlsx ไฟล์ → สั่งดาวน์โหลดผ่าน temp <a download> — เหมือนเดิมทุกประการ
 *  (ย้ายมาเป็น helper เดียวใช้ร่วมกันทุก export function, 2026-08-25). */
function writeWorkbookAndDownload(wb, filename){
  const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([wbout], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/** บันทึกลง pqa.download_log — best-effort, fire-and-forget เหมือน logLogin() ใน common.js ไม่
 *  block การดาวน์โหลด (ไฟล์ดาวน์โหลดไปแล้วก่อนเรียกอันนี้เสมอไม่ว่า insert จะสำเร็จหรือไม่) ต้องรัน
 *  sql/patch_2026-08-14_download_log.sql บน Supabase ก่อนถึงจะบันทึกได้ (เหมือนเดิม). */
function logExcelDownload(){
  if (S.user && S.user.userId) {
    supabase.from('download_log').insert({
      user_id: S.user.userId,
      pqa_emp_id: S.user.pqaEmpId,
    }).then(({ error }) => {
      if (error) console.warn('download_log insert failed:', error.message);
    });
  }
}

/** 'yyyy-MM-dd' -> 'YYYYMM' text (Excel export: Start_YYYYMM/End_YYYYMM, 2026-08-25 ตามคำขอพี่กิ๊บ).
 *  ใช้ substring ตรงๆ (ไม่ผ่าน Date) เพื่อเลี่ยงปัญหา timezone shift เหมือน dDisp() ด้านบน */
function yyyymm(s){
  if (!s) return '';
  return s.slice(0, 4) + s.slice(5, 7);
}

/** Sheet3 "Project" rows for one role — 1 แถวต่อ (lead × matched project ที่ lead คนนั้นดูแล
 *  ในบทบาทนี้ × phase ของ project นั้น) — project set มาจาก roleRows (ผลลัพธ์
 *  buildLeadRoleRows() ตัวเดียวกับที่ตาราง/Summary sheet ใช้ ไม่มีชุดข้อมูลที่สอง) MD ต่อ phase
 *  มาจาก S.periodAgg.byProjectPhase เหมือน By Project tab (buildProjectRows()) ทุกประการ */
function buildLeadProjectPhaseRows(roleTitle, roleRows, agg){
  const projByKey = currentProjMap();
  const byProjectPhase = agg.byProjectPhase || {};
  const out = [];
  roleRows.forEach(r => {
    const domainLabel = LEAD_DOMAIN_LABELS[leadDomainBucket(r.email)] || 'Other';
    [...r.projectKeys].sort().forEach(pk => {
      const proj = projByKey[pk];
      if (!proj) return;
      const app = proj.app || proj.other_app || '— ไม่มี App —';
      const { disp: periodDisp } = projectPeriodDisp(pk);
      const phases = S.phasesByProject[pk] || [];
      const pAgg = byProjectPhase[pk] || {};
      if (!phases.length) {
        // edge case: project ไม่มี project_phase เลย — ยังคง 1 แถวไว้ไม่ให้ project นี้หายไปเงียบๆ
        out.push([r.name, r.email, roleTitle, domainLabel, app, pk, proj.project_name || '', periodDisp, '—', '', '', '', '', '', proj.project_note || '']);
        return;
      }
      phases.forEach(ph => {
        const md = pAgg[ph.phase_code];
        out.push([
          r.name, r.email, roleTitle, domainLabel, app, pk, proj.project_name || '', periodDisp,
          ph.phase_label || phaseName(ph.phase_code),
          ph.start_date ? dDisp(ph.start_date) : '',
          yyyymm(ph.start_date),
          ph.end_date ? dDisp(ph.end_date) : '',
          yyyymm(ph.end_date),
          md ? Number(fmtMD(md)) : 0,
          proj.project_note || '',
        ]);
      });
    });
  });
  return out;
}

async function downloadLeadExcel(){
  const btn = $('downloadExcelBtn');
  btn.disabled = true;
  try {
    const { coverage, mainProjectsByLead, apps, agg } = computeLeadCoverage();
    if (!apps.length) { toast('ไม่มีข้อมูลให้ดาวน์โหลดสำหรับตัวกรองชุดนี้', true); return; }

    // Type ที่กำลังเลือกอยู่ (S.leadRoleFilter) → role(s) ที่จะรวมอยู่ใน Summary/Project sheet
    // 'all' = ทั้ง 3 role (เหมือนหน้าจอที่ stack ทั้ง 3 ตาราง) ไม่ใช่แค่ role เดียว
    const roleKeys = S.leadRoleFilter === 'all' ? ['main', 'sub', 'exec']
      : (Object.prototype.hasOwnProperty.call(LEAD_ROLE_META, S.leadRoleFilter) ? [S.leadRoleFilter] : ['main']);

    // ---- Sheet1: Filter ที่เลือก ----
    const filterAoa = buildDownloadFilterAoa(true);

    // ---- Sheet2: Summary + Sheet3: Project — buildLeadRoleRows() ต่อ role ป้อนทั้งคู่ ----
    const summaryAoa = [['Name', 'Email', 'Type', 'Domain', 'Total MD', 'Total Project', ...apps]];
    const projectAoa = [['Name', 'Email', 'Type', 'Domain', 'App', 'Project Key', 'Project Name', 'Project Period', 'Phase', 'Phase Start', 'Start_YYYYMM', 'Phase End', 'End_YYYYMM', 'MD', 'Note']];
    roleKeys.forEach(roleKey => {
      const meta = LEAD_ROLE_META[roleKey];
      const rows = buildLeadRoleRows(coverage[roleKey], mainProjectsByLead, apps, agg, meta.withMD);
      rows.forEach(r => {
        const domainLabelRow = LEAD_DOMAIN_LABELS[leadDomainBucket(r.email)] || 'Other';
        summaryAoa.push([
          r.name, r.email, meta.title, domainLabelRow,
          meta.withMD ? Number(fmtMD(r.totalMD)) : '',
          r.totalProject,
          ...apps.map(a => r.cellsByApp[a] || ''),
        ]);
      });
      projectAoa.push(...buildLeadProjectPhaseRows(meta.title, rows, agg));
    });

    if (summaryAoa.length === 1) { toast('ไม่มีข้อมูล Lead ให้ดาวน์โหลดสำหรับตัวกรองชุดนี้', true); return; }

    // ---- ประกอบไฟล์ .xlsx 3 sheet แล้วสั่งดาวน์โหลด ----
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(filterAoa), 'Filter');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryAoa), 'Summary');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(projectAoa), 'Project');

    const filename = downloadFilename('ByLead');
    writeWorkbookAndDownload(wb, filename);
    logExcelDownload();

    toast(`ดาวน์โหลด ${filename} สำเร็จ`);
  } catch (err) {
    console.error(err);
    toast('ดาวน์โหลด Excel ไม่สำเร็จ: ' + (err.message || String(err)), true);
  } finally {
    btn.disabled = false;
  }
}

/** By Project tab export — Sheet1 Filter (ไม่มี Type/Domain, มีผลแค่ By Lead) + Sheet2 "Project"
 *  1 แถวต่อ project เหมือนตาราง By Project บนจอทุกคอลัมน์ + แถวรวมท้ายตาราง เรียก
 *  buildProjectRows() ตรงๆ (เป็น standalone function อยู่แล้ว ไม่ต้อง duplicate ตรรกะเหมือนที่
 *  By Lead ทำกับ renderLeadView() — ดู comment หัวบล็อก DOWNLOAD EXCEL ด้านบน). 2026-08-25 ตามคำขอพี่กิ๊บ. */
async function downloadProjectExcel(){
  const btn = $('downloadExcelBtn');
  btn.disabled = true;
  try {
    const rows = buildProjectRows();
    if (!rows.length) { toast('ไม่มีข้อมูลให้ดาวน์โหลดสำหรับตัวกรองชุดนี้', true); return; }

    const filterAoa = buildDownloadFilterAoa(false);
    const projectAoa = [['App', 'Project Name', 'Lead', 'Sub Lead(s)', 'Executor(s)', 'Project Period', 'Total MD', 'TC Prep (MD)', 'UAT (MD)', 'Regression (MD)', 'Other1 (MD)', 'Other2 (MD)', 'Support (MD)']];
    let gTotal=0, gTcprep=0, gUat=0, gReg=0, gOther1=0, gOther2=0, gSupport=0;
    rows.forEach(r => {
      gTotal+=r.totalMD; gTcprep+=r.tcprep; gUat+=r.uat; gReg+=r.reg; gOther1+=r.other1; gOther2+=r.other2; gSupport+=r.support;
      projectAoa.push([
        r.app, r.projectName, r.lead, r.subLeads.join(', '), r.executors.join(', '), r.uatPeriodDisp,
        Number(fmtMD(r.totalMD)), Number(fmtMD(r.tcprep)), Number(fmtMD(r.uat)), Number(fmtMD(r.reg)),
        Number(fmtMD(r.other1)), Number(fmtMD(r.other2)), Number(fmtMD(r.support)),
      ]);
    });
    projectAoa.push([
      `รวมทั้งหมด (${rows.length} projects)`, '', '', '', '', '',
      Number(fmtMD(gTotal)), Number(fmtMD(gTcprep)), Number(fmtMD(gUat)), Number(fmtMD(gReg)),
      Number(fmtMD(gOther1)), Number(fmtMD(gOther2)), Number(fmtMD(gSupport)),
    ]);

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(filterAoa), 'Filter');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(projectAoa), 'Project');

    const filename = downloadFilename('ByProject');
    writeWorkbookAndDownload(wb, filename);
    logExcelDownload();

    toast(`ดาวน์โหลด ${filename} สำเร็จ`);
  } catch (err) {
    console.error(err);
    toast('ดาวน์โหลด Excel ไม่สำเร็จ: ' + (err.message || String(err)), true);
  } finally {
    btn.disabled = false;
  }
}

/** By App tab export (task 6, §5.60) — Sheet1 Filter (+ "Compare Actual" ใช่/ไม่ใช่ ต่อท้าย
 *  เดือนที่เลือก) + Sheet2 "App" ตรงกับตาราง By App บนจอเป๊ะ ทั้งการเรียง (genericSort() ผ่าน
 *  appKeyFns() ตัวเดียวกับ renderAppView() ใช้) และคอลัมน์ที่โชว์ — ไม่ติ๊ก Compare Actual =
 *  ไม่มีคอลัมน์ Actual MD/Booked − Actual ในชีตเลย (ไม่ใช่แค่ซ่อน) เหมือนตารางบนจอ */
async function downloadAppExcel(){
  const btn = $('downloadExcelBtn');
  btn.disabled = true;
  try {
    const rows = buildAppRows();
    if (!rows.length) { toast('ไม่มีข้อมูลให้ดาวน์โหลดสำหรับตัวกรองชุดนี้', true); return; }
    const months = S.months || [];
    const compareActual = S.compareActual;
    const sorted = genericSort(rows, S.appSort, appKeyFns(months));

    const filterAoa = buildDownloadFilterAoa(false);
    filterAoa.push(['Compare Actual', compareActual ? 'ใช่' : 'ไม่ใช่']);

    const header = ['App', 'Booked MD'];
    if (compareActual) header.push('Actual MD', 'Booked − Actual');
    months.forEach(mm => header.push(`Booked ${monthLabel(mm)}`));
    if (compareActual) months.forEach(mm => header.push(`Actual ${monthLabel(mm)}`));
    const appAoa = [header];

    let gBookedTotal = 0, gActualTotal = 0, gDiff = 0;
    const gBookedByMonth = {}, gActualByMonth = {};
    months.forEach(mm => { gBookedByMonth[mm] = 0; gActualByMonth[mm] = 0; });

    sorted.forEach(r => {
      gBookedTotal += r.bookedTotal; gActualTotal += r.actualTotal; gDiff += r.diff;
      const row = [r.app, Number(fmtMD(r.bookedTotal))];
      if (compareActual) row.push(Number(fmtMD(r.actualTotal)), Number(fmtMD(r.diff)));
      months.forEach(mm => {
        gBookedByMonth[mm] += r.bookedByMonth[mm];
        row.push(Number(fmtMD(r.bookedByMonth[mm])));
      });
      if (compareActual) {
        months.forEach(mm => {
          gActualByMonth[mm] += r.actualByMonth[mm];
          row.push(Number(fmtMD(r.actualByMonth[mm])));
        });
      }
      appAoa.push(row);
    });

    const totalRow = [`รวมทั้งหมด (${rows.length} apps)`, Number(fmtMD(gBookedTotal))];
    if (compareActual) totalRow.push(Number(fmtMD(gActualTotal)), Number(fmtMD(gDiff)));
    months.forEach(mm => totalRow.push(Number(fmtMD(gBookedByMonth[mm]))));
    if (compareActual) months.forEach(mm => totalRow.push(Number(fmtMD(gActualByMonth[mm]))));
    appAoa.push(totalRow);

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(filterAoa), 'Filter');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(appAoa), 'App');

    const filename = downloadFilename('ByApp');
    writeWorkbookAndDownload(wb, filename);
    logExcelDownload();

    toast(`ดาวน์โหลด ${filename} สำเร็จ`);
  } catch (err) {
    console.error(err);
    toast('ดาวน์โหลด Excel ไม่สำเร็จ: ' + (err.message || String(err)), true);
  } finally {
    btn.disabled = false;
  }
}

/** By OS tab export — §5.63 Task 7: แตกตาม S.osMode (booked/actual/compare) เหมือนตาราง
 *  By OS บนจอ (renderOsView()/renderOsCompare()) — โหมด actual/compare เรียก
 *  buildActualOsAgg()/buildCompareRows() ตัวเดียวกับที่บนจอใช้ตรงๆ (ห้ามคำนวณซ้ำเอง กันไฟล์ที่
 *  ดาวน์โหลดกับตารางบนจอเพี้ยนกันเงียบๆ) Sheet1 "Filter" เพิ่มบรรทัด "โหมด" ต่อท้ายบรรทัดเดิม
 *  บอกว่ากำลังดาวน์โหลดโหมดไหนอยู่. 2026-08-25 (โครงเดิม) / 2026-09-10 แตก 3 โหมด. */
async function downloadOsExcel(){
  const btn = $('downloadExcelBtn');
  btn.disabled = true;
  try {
    const filterAoa = buildDownloadFilterAoa(false);
    filterAoa.push(['โหมด', { booked: 'Booked MD', actual: 'Actual MD', compare: 'Compare' }[S.osMode] || 'Booked MD']);

    // ---- โหมด Compare: OS x App x เดือน เทียบ Booked vs Actual — buildCompareRows() ตัวเดียว
    // กับ renderOsCompare() (ห้าม copy ตรรกะรวมยอดซ้ำ) เขียนแถวย่อย App ทุกแถวเสมอ ไม่สนสถานะ
    // กาง/หุบของตัวแปร osExpanded บนจอ (เป็นแค่ view state ไม่มีผลกับไฟล์ที่ดาวน์โหลด)
    if (S.osMode === 'compare') {
      const rangeStart = S.overallRange.s || '';
      const months = S.months || [];
      const bAgg = (S.periodAggActiveOnly || {}).byOsAppMonth || {};
      const aAgg = buildActualOsAgg(S.actualPersonRows, Object.values(S.resourceMap), months, S.filter);
      const allRows = buildCompareRows(bAgg, aAgg, Object.values(S.resourceMap), months, rangeStart);

      if (!allRows.length) { toast('ไม่มีข้อมูลให้ดาวน์โหลดสำหรับตัวกรองชุดนี้', true); return; }

      // unmatched ตัดออกก่อน sort แล้วต่อท้ายทีหลังเสมอ — เหมือน renderOsCompare()
      const matchedRows = allRows.filter(r => !r.unmatched);
      const unmatchedRows = allRows.filter(r => r.unmatched);
      const sortedMatched = genericSort(matchedRows, S.osSort, compareKeyFns(months));
      const finalRows = [...sortedMatched, ...unmatchedRows];

      // หัว 2 แถวเหมือนบนจอ: OS | Role | App | Total(Booked/Actual/B−A) | <เดือน>(Booked/Actual/B−A) ...
      const headRow1 = ['OS', 'Role', 'App', 'Total', '', ''];
      const headRow2 = ['', '', '', 'Booked', 'Actual', 'B − A'];
      months.forEach(mk => {
        headRow1.push(monthLabel(mk), '', '');
        headRow2.push('Booked', 'Actual', 'B − A');
      });
      const compareAoa = [headRow1, headRow2];

      const cellsToRow = (name, role, app, cells) => {
        const row = [name, role, app, Number(fmtMD(cells.total.b)), Number(fmtMD(cells.total.a)), Number(fmtMD(cells.total.d))];
        months.forEach(mk => {
          const c = cells[mk] || { b: 0, a: 0, d: 0 };
          row.push(Number(fmtMD(c.b)), Number(fmtMD(c.a)), Number(fmtMD(c.d)));
        });
        return row;
      };

      finalRows.forEach(r => {
        const appLabel = r.apps.length === 1 ? r.apps[0].app : (r.apps.length ? `${r.apps.length} Apps` : '');
        compareAoa.push(cellsToRow(r.name, roleLabelFor(r.role_code), appLabel, r.cells));
        r.apps.forEach(ap => {
          compareAoa.push(cellsToRow('', '', ap.app, ap.cells));
        });
      });

      const grandCells = sumCompareCells(finalRows.map(r => r.cells), months);
      compareAoa.push(cellsToRow(`รวมทั้งหมด (${finalRows.length} คน)`, '', '', grandCells));

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(filterAoa), 'Filter');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(compareAoa), 'OS');

      const filename = downloadFilename('ByOS');
      writeWorkbookAndDownload(wb, filename);
      logExcelDownload();

      toast(`ดาวน์โหลด ${filename} สำเร็จ`);
      return;
    }

    // ---- โหมด Actual: buildActualOsAgg() ตัวเดียวกับ renderOsView() — โครงตารางเดิมของ booked
    // แต่ดึงข้อมูลจาก Actual แทน ต่อท้ายกลุ่ม "ไม่พบใน OS master" เสมอเมื่อมี unmatched ----
    if (S.osMode === 'actual') {
      const rangeStart = S.overallRange.s || '';
      const aAgg = buildActualOsAgg(S.actualPersonRows, Object.values(S.resourceMap), S.months, S.filter);
      const apps = sortedApps(aAgg.apps);
      const shaped = { byOsApp: {}, byOsTotal: aAgg.byResTotal };
      Object.keys(aAgg.byResAppMonth).forEach(rid => {
        shaped.byOsApp[rid] = {};
        Object.keys(aAgg.byResAppMonth[rid]).forEach(app => {
          shaped.byOsApp[rid][app] = Object.values(aAgg.byResAppMonth[rid][app]).reduce((s, v) => s + v, 0);
        });
      });
      const osRows = genericSort(Object.values(S.resourceMap)
        .filter(r => r.resource_type === 'outsource')
        .map(r => ({ ...r, total: shaped.byOsTotal[r.resource_id] || 0 }))
        .filter(r => osRowVisible(r, rangeStart))
        .sort((a,b) => (roleRank(a.role_code)-roleRank(b.role_code)) || String(a.nickname||a.full_name_en||'').localeCompare(String(b.nickname||b.full_name_en||''))),
        S.osSort, osKeyFns(apps, shaped));

      if (!apps.length && !aAgg.unmatched.length) { toast('ไม่มีข้อมูลให้ดาวน์โหลดสำหรับตัวกรองชุดนี้', true); return; }

      const osAoa = [['OS', 'Role', 'Total MD', ...apps]];
      const colTotals = {}; apps.forEach(a => colTotals[a] = 0);
      let grandTotal = 0;
      osRows.forEach(r => {
        grandTotal += r.total;
        const cells = apps.map(a => {
          const v = (shaped.byOsApp[r.resource_id] || {})[a] || 0;
          colTotals[a] += v;
          return v ? Number(fmtMD(v)) : 0;
        });
        osAoa.push([resName(r.nickname, r.full_name_en), roleLabelFor(r.role_code), Number(fmtMD(r.total)), ...cells]);
      });

      // กลุ่ม "ไม่พบใน OS master" — ยอดรวมท้ายตาราง (colTotals/grandTotal ตัวเดียวกับข้างบน)
      // ต้องนับรวมด้วยเสมอ เหมือน renderOsView()
      if (aAgg.unmatched.length) {
        osAoa.push([`ไม่พบใน OS master (${aAgg.unmatched.length} คน)`, '', '', ...apps.map(() => '')]);
        aAgg.unmatched.forEach(u => {
          const cells = apps.map(a => {
            const v = Object.values(u.byAppMonth[a] || {}).reduce((s, v2) => s + v2, 0);
            colTotals[a] += v;
            return v ? Number(fmtMD(v)) : 0;
          });
          grandTotal += u.total;
          osAoa.push([u.name, '', Number(fmtMD(u.total)), ...cells]);
        });
      }

      osAoa.push(['รวมทั้งหมด', '', Number(fmtMD(grandTotal)), ...apps.map(a => Number(fmtMD(colTotals[a])))]);

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(filterAoa), 'Filter');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(osAoa), 'OS');

      const filename = downloadFilename('ByOS');
      writeWorkbookAndDownload(wb, filename);
      logExcelDownload();

      toast(`ดาวน์โหลด ${filename} สำเร็จ`);
      return;
    }

    // ---- โหมด Booked (default) — §6: By OS counts MD only on bookings whose project
    // is_active = true — เหมือน renderOsView() (โค้ดเดิมทุกบรรทัดตั้งแต่ก่อน Task 7) ----
    const agg = S.periodAggActiveOnly || { byOsApp:{}, byOsTotal:{} };
    const appSet = new Set();
    Object.values(agg.byOsApp).forEach(m => Object.keys(m).forEach(a => appSet.add(a)));
    const apps = sortedApps([...appSet]);

    // §5.59: ซ่อน OS ที่ลาออกแล้วและไม่มี MD ในเดือนที่เลือก — เกณฑ์เดียวกับ renderOsView()
    // (osRowVisible()) เพื่อให้ไฟล์ที่ดาวน์โหลดได้แถวชุดเดียวกับตารางบนจอเสมอ
    const rangeStart = S.overallRange.s || '';
    const osRows = genericSort(Object.values(S.resourceMap)
      .filter(r => r.resource_type === 'outsource')
      .map(r => ({ ...r, total: agg.byOsTotal[r.resource_id] || 0 }))
      .filter(r => osRowVisible(r, rangeStart))
      .sort((a,b) => (roleRank(a.role_code)-roleRank(b.role_code)) || String(a.nickname||a.full_name_en||'').localeCompare(String(b.nickname||b.full_name_en||''))),
      S.osSort, osKeyFns(apps, agg));

    if (!apps.length) { toast('ไม่มีข้อมูลให้ดาวน์โหลดสำหรับตัวกรองชุดนี้', true); return; }

    const osAoa = [['OS', 'Role', 'Total MD', ...apps]];
    const colTotals = {}; apps.forEach(a => colTotals[a] = 0);
    let grandTotal = 0;
    osRows.forEach(r => {
      grandTotal += r.total;
      const cells = apps.map(a => {
        const v = (agg.byOsApp[r.resource_id] || {})[a] || 0;
        colTotals[a] += v;
        return v ? Number(fmtMD(v)) : 0;
      });
      osAoa.push([resName(r.nickname, r.full_name_en), roleLabelFor(r.role_code), Number(fmtMD(r.total)), ...cells]);
    });
    osAoa.push(['รวมทั้งหมด', '', Number(fmtMD(grandTotal)), ...apps.map(a => Number(fmtMD(colTotals[a])))]);

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(filterAoa), 'Filter');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(osAoa), 'OS');

    const filename = downloadFilename('ByOS');
    writeWorkbookAndDownload(wb, filename);
    logExcelDownload();

    toast(`ดาวน์โหลด ${filename} สำเร็จ`);
  } catch (err) {
    console.error(err);
    toast('ดาวน์โหลด Excel ไม่สำเร็จ: ' + (err.message || String(err)), true);
  } finally {
    btn.disabled = false;
  }
}

 *  sort ordering, and changing what it contains is out of scope for this task) — the spec
 *  (§5.3) asks specifically for only the active set in this one sheet. `app` is a tiny
